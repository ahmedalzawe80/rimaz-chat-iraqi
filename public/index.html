<script>
let sid=sessionStorage.getItem("rimaz_sid"), me=null, socket=null, currentRoom="الغرفة العامة";
let rooms=[["🏠","الغرفة العامة","نص فقط",120],["🔒","غرفة الأصدقاء","خاص",48],["❤️","غرفة الحب","خاص",35],["🎙️","غرفة الصوت","مايك",22]];
let privateToName="";
let rtc=null, rtcTarget="", rtcKind="", pendingIce=[];

async function api(url,opt={}){
 opt.headers={...(opt.headers||{}),...(sid?{"x-session":sid}:{})};
 let r=await fetch(url,opt);
 let j=await r.json().catch(()=>({}));
 if(!r.ok)throw Error(j.error||"حدث خطأ");
 return j;
}

async function start(){
 try{
  let s=await api("/api/state");
  me=s.user;
  if(me){
   await syncRooms();
   show("rooms");
  }else auth();
 }catch(e){auth()}
}

async function syncRooms(){
 try{
  const rs=await api("/api/rooms");
  const icons=["🏠","🔒","❤️","🎙️","🌙","⭐","🌹","🎧"];
  rooms=rs.map((r,i)=>[
   icons[i%icons.length],
   r.name,
   r.kind==="voice"?"مايك":r.kind==="private"?"خاص":r.desc||"نص فقط",
   r.online||r.count||0,
   r.kind
  ]);
 }catch(e){}
}

function auth(){
 app.innerHTML=`<div class="auth"><div class="authbox">
 <div class="logo">دردشة <span>ريماز عراقية</span></div>
 <p style="text-align:center">دخول بدون إيميل أو رقم هاتف</p>
 <div class="grid">
  <div class="authcard">
   <h2>دخول عضو</h2>
   <input id="ln" placeholder="اسم المستخدم">
   <input id="lp" type="password" placeholder="كلمة المرور">
   <button class="purple" style="width:100%" onclick="login()">دخول عضو</button>
   <p class="muted">المسجل سابقًا لا يحتاج إعادة التسجيل.</p>
  </div>
  <div class="authcard">
   <h2>تسجيل حساب</h2>
   <input id="rn" placeholder="اسم المستخدم">
   <input id="rp" type="password" placeholder="كلمة المرور">
   <button class="purple" style="width:100%" onclick="reg()">إنشاء حساب</button>
   <p class="muted">اسم + باسورد فقط.</p>
  </div>
 </div>
 <div class="authcard" style="margin-top:10px">
  <h2>دخول زائر</h2>
  <input id="gn" placeholder="اسم فريد">
  <button class="black" style="width:100%" onclick="guest()">دخول زائر</button>
 </div>
 </div></div>`;
}

async function reg(){
 try{
  const name=document.getElementById("rn").value;
  const password=document.getElementById("rp").value;
  let j=await api("/api/register",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({name,password})
  });
  sid=j.sid;
  sessionStorage.setItem("rimaz_sid",sid);
  start();
 }catch(e){alert(e.message)}
}

async function login(){
 try{
  const name=document.getElementById("ln").value;
  const password=document.getElementById("lp").value;
  let j=await api("/api/login",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({name,password})
  });
  sid=j.sid;
  sessionStorage.setItem("rimaz_sid",sid);
  start();
 }catch(e){alert(e.message)}
}

async function guest(){
 try{
  const name=document.getElementById("gn").value;
  let j=await api("/api/guest",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({name})
  });
  sid=j.sid;
  sessionStorage.setItem("rimaz_sid",sid);
  start();
 }catch(e){alert(e.message)}
}

function header(active){
 return `<header class="top">
  <div class="user">
   <div class="ava">👤</div>
   <span>${esc(me.name)}${me.type==="guest"?" (زائر)":""}</span>
  </div>

  <div class="logo">دردشة <span>ريماز عراقية</span></div>

  <nav class="nav">
   <button class="${active==="rooms"?"on":""}" onclick="show('rooms')">الغرف</button>
   <button class="${active==="private"?"on":""}" onclick="show('private')">الخاص</button>
   <button class="${active==="members"?"on":""}" onclick="show('members')">الأعضاء</button>
   <button class="${active==="wall"?"on":""}" onclick="show('wall')">الحائط</button>

   <button class="bell" onclick="notificationsView()">
    🔔 الإشعارات
    <span id="bellCount" class="bell-count" style="display:none">0</span>
   </button>

   <button onclick="settings()">⚙ الضبط</button>
  </nav>
 </header>`;
}

function side(){
 return `<aside class="card side">
  <div class="title">الغرف</div>
  ${rooms.map((r,i)=>`
   <div class="room ${r[1]===currentRoom?"active":""}" onclick="openRoom('${esc(r[1])}')">
    <div class="pic">${r[0]}</div>
    <div>
     <b>${esc(r[1])}</b>
     <div class="muted">${esc(r[2])}</div>
    </div>
    <span class="count">${r[3]}</span>
   </div>
  `).join("")}
 </aside>`;
}

function people(){
 return `<aside class="card side">
  <div class="title">الأعضاء المتصلون</div>
  <div class="member">
   <div class="ava">👤</div>
   <b>${esc(me?.name||"أنت")}</b>
   <span class="dot"></span>
  </div>
  <div class="muted" style="padding:10px;text-align:center">
   قائمة الأعضاء الكاملة من قسم الأعضاء.
  </div>
 </aside>`;
}

function roomsView(){
 const isPublic=currentRoom==="الغرفة العامة";

 return `<div class="rooms-strip">
  ${rooms.map(r=>`
   <div class="room ${r[1]===currentRoom?"active":""}" onclick="openRoom('${esc(r[1])}')">
    <div class="pic">${r[0]}</div>
    <div style="flex:1">
     <b>${esc(r[1])}</b>
     <div class="muted">${esc(r[2])}</div>
    </div>
    <span class="count">${r[3]}</span>
   </div>
  `).join("")}
 </d
