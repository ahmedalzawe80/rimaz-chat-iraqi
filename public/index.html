function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
async function api(url,opt={}){opt.headers={...(opt.headers||{}),'x-session':sid};let r=await fetch(url,opt);let j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'حدث خطأ');return j}
function toast(t){const x=document.getElementById('toast');if(!x)return;x.textContent=t;x.style.display='block';clearTimeout(x._t);x._t=setTimeout(()=>x.style.display='none',2600)}
function login(){app.innerHTML=`<div class="login"><div class="loginShell"><div class="loginHero"><img src="https://commons.wikimedia.org/wiki/Special:Redirect/file/An_Iraqi_Southern_woman_in_traditional_abaya_and_Sheila_-_Cultural_Heritage.jpg" alt="امرأة عراقية بزي عراقي تقليدي"><div class="heroGlow"></div><div class="loginHeroText"><div class="heroBadge">مجلس عراقي • خصوصية • احترام</div><b>دردشة ريماز عراقية</b><span>مكانك الهادئ للدردشة والتعارف والخاص</span><div class="heroStats"><span>♥ إعجابات وصلاحيات</span><span>● غرف متعددة</span><span>✦ خاص وتنبيهات</span></div></div></div><div class="loginCard"><div class="brandMark">R</div><div class="brand">دردشة ريماز عراقية</div><div class="sub">أهلاً بك في مجلسنا العراقي</div><div class="loginTabs"><button id="tabNew" class="active" onclick="loginMode('new')">حساب جديد</button><button id="tabIn" onclick="loginMode('in')">دخول عضو</button><button id="tabGuest" onclick="loginMode('guest')">دخول زائر</button></div><div id="loginForm" class="loginForm"></div><div class="loginPromise"><span>🔒</span><div><b>دخول بسيط وخصوصية واضحة</b><small>لا نطلب إيميل أو رقم هاتف</small></div></div><div class="loginCredit">الصورة: Saja Qader — Wikimedia Commons · CC BY-SA 4.0</div></div></div></div>`;loginMode('new')}
function loginMode(mode){['tabNew','tabIn','tabGuest'].forEach(id=>document.getElementById(id)?.classList.remove('active'));document.getElementById(mode==='new'?'tabNew':mode==='in'?'tabIn':'tabGuest')?.classList.add('active');const f=document.getElementById('loginForm');if(mode==='guest'){f.innerHTML=`<input id="ln" placeholder="اسم الزائر"><button class="primary guest" onclick="doGuest()">دخول زائر</button>`}else{f.innerHTML=`<input id="ln" placeholder="الاسم"><input id="lp" type="password" placeholder="الباسورد"><button class="primary" onclick="${mode==='new'?'doRegister()':'doLogin()'}">${mode==='new'?'تسجيل حساب جديد':'دخول عضو'}</button>`}}
async function doRegister(){try{const j=await api('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:ln.value,password:lp.value})});sid=j.sid;localStorage.setItem('rimaz_sid',sid);await boot()}catch(e){toast(e.message)}}
async function doLogin(){try{const j=await api('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:ln.value,password:lp.value})});sid=j.sid;localStorage.setItem('rimaz_sid',sid);await boot()}catch(e){toast(e.message)}}
async function doGuest(){try{const j=await api('/api/guest',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:ln.value})});sid=j.sid;localStorage.setItem('rimaz_sid',sid);await boot()}catch(e){toast(e.message)}}
async function boot(){try{const s=await api('/api/state');me=s.user;rooms=s.rooms;currentRoom='public';notifications=await api('/api/notifications');renderChat();connect();}catch(e){sid='';localStorage.removeItem('rimaz_sid');login()}}
function displayFor(x){return x?.displayName||x?.profile?.displayName||x?.name||''}
function avatarFor(p){return p?.avatar||'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect width="100" height="100" fill="#fff"/><circle cx="50" cy="40" r="22" fill="#e6d7e2"/><path d="M20 95c3-28 57-28 60 0" fill="#d9c3d5"/><text x="50" y="15" text-anchor="middle" font-size="12">ريماز</text></svg>`)}
function refreshRoomBar(){const r=rooms.find(x=>x.id===currentRoom)||{name:'الغرفة العامة'};const n=document.querySelector('.roomName');if(n)n.textContent=r.name}
function renderChat(){app.innerHTML=`<div class="chat"><div class="messages" id="msgs"></div><div class="composer"><button onclick="leaveRoom()">↪</button><button class="emojiBtn" onclick="emojiPicker('public')">🙂</button><input id="msgInput" placeholder="اكتب رسالتك هنا" onkeydown="if(event.key==='Enter')sendPublic()"><button onclick="sendPublic()">إرسال ➤</button></div><div class="bottom"><button onclick="openSettings()">⚙ الضبط</button><button onclick="openWall()">💬 الحائط <span id="wallCount" class="wallCount"></span></button><button onclick="openRooms()">♣ الغرف</button><button onclick="openPrivateList()">💬 خاص</button><button onclick="openMembers()">♟ <span id="onlineCount">0</span></button></div><div id="layer"></div><div id="toast" class="toast"></div></div>`;document.getElementById('msgs').innerHTML='';}
function connect(){if(socket)socket.disconnect();socket=io();socket.on('connect',()=>joinRoom(currentRoom));socket.on('history',a=>{if(currentRoom==='public'){document.getElementById('msgs').innerHTML='';a.forEach(addMessage)}});socket.on('message',m=>{if(m.room===currentRoom)addMessage(m)});socket.on('presence',d=>addPresence(d));socket.on('live-state',s=>{rooms=s.rooms||rooms;document.getElementById('onlineCount').textContent=(s.online||[]).length;});socket.on('likes-changed',d=>{if(me?.name===d.name){me.likes=d.likes;me.level=d.level;updateMeBadges()}});socket.on('error-msg',d=>showBlockModal(d.error,'تنبيه'));socket.on('admin-notice',d=>{const box=document.getElementById('msgs');if(box){box.insertAdjacentHTML('beforeend',`<div class="presence"><img src="${esc(avatarFor({}))}"><div class="presenceMain"><div class="presenceName">${esc(d.from||'الإدارة')}</div><span class="presenceNotice">📢 ${esc(d.text)}</span></div></div>`);box.scrollTop=box.scrollHeight;}else toast('📢 '+d.text)});socket.on('notification',d=>toast('✉ '+d.from+': '+d.text));socket.on('private-message',m=>{const other=key(m.from)===key(me.name)?m.to:m.from;if(privateOpen&&(key(privateTo)===key(m.from)||key(privateTo)===key(m.to))){addPrivate(m)}else{privateUnread[other]=(privateUnread[other]||0)+1;updatePrivateButton();toast('💬 رسالة خاصة من '+(m.fromDisplayName||m.from));}});socket.on('private-media',m=>{if(privateOpen&&(key(privateTo)===key(m.from)||key(privateTo)===key(m.to)))addPrivateMedia(m)});socket.on('wall-new',()=>{if(activeOverlay==='wall')openWall()});socket.on('kicked',d=>{if(currentRoom===d.room){currentRoom='public';joinRoom('public');toast('تم إخراجك من الغرفة')}});socket.on('call-offer',handleOffer);socket.on('call-answer',handleAnswer);socket.on('ice',handleIce);}
function key(x){return String(x||'').trim().toLowerCase()}
function joinRoom(room){const next=String(room||'public');if(!socket)return;if(inRoom&&currentRoom!==next)socket.emit('leave-room',{room:currentRoom});currentRoom=next;inRoom=true;setRoomInputState(true);socket.emit('join',{sid,room:next});api('/api/history?room='+encodeURIComponent(next)).then(a=>{const box=document.getElementById('msgs');if(!box)return;box.innerHTML='';a.forEach(addMessage);box.scrollTop=box.scrollHeight}).catch(()=>{});}
function setRoomInputState(enabled){const input=document.getElementById('msgInput');const buttons=document.querySelectorAll('.composer button');if(input){input.disabled=!enabled;input.placeholder=enabled?'اكتب رسالتك هنا':'أنت خارج الغرفة — اختر غرفة للدخول';}buttons.forEach(b=>b.disabled=!enabled);}
function leaveRoom(){if(!inRoom){openMembers();return;}const r=currentRoom;socket?.emit('leave-room',{room:r});inRoom=false;setRoomInputState(false);openMembers();}
function addPresence(d){if(currentRoom!==d.room)return;const box=document.getElementById('msgs');if(!box)return;const roomName=(rooms.find(r=>r.id===d.room)||{}).name||'الغرفة العامة';const dn=d.displayName||d.name;const text=d.action==='join'?`لقد دخل ${dn} إلى ${roomName}`:`لقد خرج ${dn} من ${roomName}`;box.insertAdjacentHTML('beforeend',`<div class="presence" style="cursor:pointer" onclick="openMemberCard('${esc(d.name)}')"><img src="${esc(avatarFor(d.profile||{}))}"><div class="presenceMain"><div class="presenceName">${esc(dn)}</div><span class="presenceNotice">${esc(text)}</span></div></div>`);box.scrollTop=box.scrollHeight;requestAnimationFrame(()=>{box.scrollTop=box.scrollHeight;box.lastElementChild?.scrollIntoView({block:'end'})})}
function addMessage(m){const box=document.getElementById('msgs');if(!box)return;const p=m.profile||{};let content=esc(m.text||'');if(m.media){content=m.media.mime.startsWith('image/')?`<img src="${esc(m.media.url)}" class="wallMedia">`:m.media.mime.startsWith('video/')?`<video src="${esc(m.media.url)}" class="wallMedia" controls></video>`:`<audio src="${esc(m.media.url)}" controls></audio>`}box.insertAdjacentHTML('beforeend',`<div class="msg"><img class="avatar" style="cursor:pointer" onclick="openMemberCard('${esc(m.from)}')" src="${esc(avatarFor(p))}"><div class="msgbody"><div class="msghead" style="color:${esc(p.nameColor||'#222')};cursor:pointer" onclick="openMemberCard('${esc(m.from)}')"><span>${esc(m.displayName||m.profile?.displayName||m.from)}</span> ${m.likes>=500?'<span class="badge">500+</span>':''}</div><div class="msgtext" style="background:${esc(p.bgColor||'#fff')}">${content}</div></div><div class="time">${new Date(m.at).toLocaleTimeString('ar-IQ',{hour:'2-digit',minute:'2-digit'})}</div></div>`);box.scrollTop=box.scrollHeight}
function sendPublic(){const text=document.getElementById('msgInput')?.value.trim();if(!text)return;socket.emit('send-message',{room:currentRoom,text});document.getElementById('msgInput').value=''}
function layer(html,name){activeOverlay=name;document.getElementById('layer').innerHTML=html}
function closeLayer(){activeOverlay=null;document.getElementById('layer').innerHTML=''}
function head(t){return `<div class="overlayHead"><span>${t}</span><button class="close" onclick="closeLayer()">×</button></div>`}
async function openMemberProfile(name){try{const s=await api('/api/state');const u=(s.online||[]).find(x=>key(x.name)===key(name));if(!u)return;const p=u.profile||{};const dn=displayFor(u)||name;layer(`<div class="profileOverlay"><div class="profileTop"><img src="${esc(avatarFor(p))}"><b>${esc(dn)}</b><button class="close" style="width:28px;height:28px;font-size:22px" onclick="closeLayer()">×</button></div><img class="profilePhoto" src="${esc(avatarFor(p))}" onerror="this.style.display='none'"><div class="profileInfo"><div style="font-size:12px;color:#777">${esc(p.status||'متصل الآن')}</div><div style="margin-top:4px"><span class="likeBig">♥ ${u.likes||0}</span> · مستوى ${u.level||1}</div></div><div class="profileGrid"><button onclick="sendLike('${esc(name)}');openMemberProfile('${esc(name)}')">♥ إعجاب</button><button onclick="notifyUser('${esc(name)}')">✉ تنبيه</button><button onclick="openPrivate('${esc(name)}')">💬 مراسلة خاصة</button><button onclick="ignoreUser('${esc(name)}')" class="ignore">⛔ تجاهل</button></div></div>`,'memberProfile')}catch(e){toast(e.message)}}
async function openMembers(){const s=await api('/api/state');const a=s.online||[];layer(`<div class="overlay">${head('المتواجدين')}<div class="overlayBody"><div style="padding:5px"><input id="memberSearch" style="width:100%;height:38px;border:1px solid #aaa;padding:5px" placeholder="... البحث" oninput="filterMembers()"></div><div id="memberList">${memberRows(a)}</div></div></div>`,'members')}
function memberRows(a){return a.map(x=>`<div class="member row" data-name="${esc(displayFor(x))}" onclick="openMemberProfile('${esc(x.name)}')"><img src="${esc(avatarFor(x.profile))}"><div class="memberMain"><div class="memberName">${esc(displayFor(x))} ${x.role==='owner'?'👑':x.role==='admin'?'🛡️':x.role==='super'?'⭐':x.vip?'🎁':''}</div><div class="memberSub">${esc(x.profile?.status||'متصل الآن')} · مستوى ${x.level}${x.vip?' · VIP':''}</div></div><div class="memberLikes">${x.likes} ♥<br><span class="flag">${x.type==='guest'?'👤':'🇮🇶'}</span></div></div>`).join('')||'<div class="empty">لا يوجد متواجدون</div>'}
function filterMembers(){const q=key(memberSearch.value);document.querySelectorAll('#memberList .member').forEach(x=>x.style.display=key(x.dataset.name).includes(q)?'grid':'none')}
async function openRooms(){const s=await api('/api/state');rooms=s.rooms;layer(`<div class="overlay">${head('غرف الدردشة: '+rooms.reduce((n,r)=>n+(r.online||0),0))}<div class="overlayBody"><button class="newRoom" onclick="toast('إنشاء الغرف من لوحة الادارة فقط')">+ غرفة جديدة</button>${rooms.map(r=>`<div class="room" onclick="closeLayer();joinRoom('${esc(r.id)}')"><img src="${esc(avatarFor({}))}"><div><div class="roomName">${esc(r.name)}</div><div class="roomDesc">${esc(r.desc||'غرفة عامة ..')}</div></div><div class="count ${r.kind==='voice'?'voice':''}">${r.kind==='voice'?'🎙️':'♟'}${r.online||0}/${r.capacity}</div></div>`).join('')}</div></div>`,'rooms')}
async function openWall(){const w=await api('/api/wall');layer(`<div class="overlay">${head('الحائط')}<div class="overlayBody"><div class="wallInput"><textarea id="wallText" placeholder="اكتب منشورك..."></textarea><div class="wallTools"><button onclick="emojiPicker('wall')">🙂</button><button onclick="wallMedia('image')">🖼️</button><button onclick="wallMedia('video')">🎬</button><button onclick="postWall()">إرسال ➤</button></div></div><div id="wallPosts">${w.map(wallCard).join('')}</div></div></div>`,'wall')}
function wallCard(p){let m='';if(p.media)m=p.media.mime.startsWith('image/')?`<img src="${esc(p.media.url)}" class="wallMedia">`:`<video src="${esc(p.media.url)}" class="wallMedia" controls></video>`;return `<div class="wallPost"><div class="wallText"><b>${esc(p.from)}</b><div>${esc(p.text||'')}</div>${m}</div><div class="wallActions"><button onclick="wallLike('${p.id}')">♥${p.likes||''}</button><button onclick="toast('التعليقات متاحة داخل المنشور')">💬</button></div></div>`}
async function postWall(){const text=document.getElementById('wallText')?.value.trim();if(!text)return toast('اكتب شيئاً أولاً');try{await api('/api/wall',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});toast('تم النشر');openWall()}catch(e){toast(e.message)}}
async function wallMedia(kind){const f=document.createElement('input');f.type='file';f.accept=kind==='image'?'image/*':'video/*';f.onchange=async()=>{const fd=new FormData();fd.append('file',f.files[0]);fd.append('scope','wall');try{await api('/api/media',{method:'POST',body:fd});openWall()}catch(e){toast(e.message)}};f.click()}
async function wallLike(id){try{const j=await api('/api/wall/like',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id})});toast('♥ '+j.likes);openWall()}catch(e){toast(e.message)}}
function openPrivateList(){Promise.all([api('/api/private/peers'),api('/api/state')]).then(([peers,s])=>{const online=new Map((s.online||[]).map(x=>[key(x.name),x]));const a=(peers||[]).filter(x=>key(x.name)!==key(me.name)).map(x=>({...x,...(online.get(key(x.name))||{})}));layer(`<div class="overlay">${head('المحادثات الخاصة')}<div class="overlayBody">${a.map(x=>`<div class="member row" onclick="openMemberProfile('${esc(x.name)}')"><img src="${esc(avatarFor(x.profile))}"><div class="memberMain"><div class="memberName">${esc(displayFor(x))}</div><div class="memberSub">${x.likes||0} إعجاب · مستوى ${x.level||1}${x.unread?' · جديد':''}</div></div><div>💬 ${x.unread?`<b class="unreadBadge">${x.unread}</b>`:''}</div></div>`).join('')||'<div class="empty">لا توجد محادثات خاصة محفوظة</div>'}</div></div>`,'privateList')}).catch(e=>toast(e.message))}
function showBlockModal(text,title='تنبيه'){const l=document.getElementById('layer');if(!l)return;l.insertAdjacentHTML('beforeend',`<div class="modalShade" id="blockModal"><div class="modalBox"><div class="modalTitle">${esc(title)}</div><div class="modalText">${esc(text)}</div><button class="modalOk" onclick="document.getElementById('blockModal')?.remove()">حسناً</button></div></div>`)}
async function openPrivate(name){privateUnread[name]=0;updatePrivateButton();const previous=activeOverlay;api('/api/state').then(s=>{const u=(s.online||[]).find(x=>key(x.name)===key(name));if(u?.profile?.privateOpen===false){showBlockModal(`لقد أغلق ${displayFor(u)} المحادثة الخاصة`);return}privateTo=name;privateOpen=true;const dn=displayFor(u)||name;layer(`<div class="overlay privateOverlay"><div class="privateHead"><button onclick="openPrivateList()">♟</button><div style="padding:0 5px;font-weight:900;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(dn)}<small style="display:block;font-size:9px;color:#bbb;overflow:hidden;text-overflow:ellipsis">${esc(u?.profile?.status||'متصل الآن')} · ${u?.likes||0} ♥ · مستوى ${u?.level||1}</small></div><button class="blue" onclick="notifyUser('${esc(name)}')">✉</button><button onclick="closeLayer();privateOpen=false">×</button></div><div id="privateBody" class="privateBody"></div><div class="privateComposer"><button class="green" onclick="startCall(false)">☎</button><button class="green" onclick="startCall(true)">📹</button><button onclick="sharePrivate()">↗</button><button class="smile" onclick="emojiPicker('private')">🙂</button><input id="privateText" placeholder="اكتب رسالتك هنا" onkeydown="if(event.key==='Enter')sendPrivate()"><button onclick="sendPrivate()">إرسال ➤</button></div></div>`,'private');api('/api/private/history?to='+encodeURIComponent(name)).then(a=>{const b=document.getElementById('privateBody');if(b){b.innerHTML='';a.forEach(m=>addPrivate(m));}}).catch(()=>{});}).catch(e=>toast(e.message))}
function maximizePrivate(){document.querySelector('#layer .privateOverlay')?.classList.toggle('privateMax')}
function sendPrivate(){const text=document.getElementById('privateText')?.value.trim();if(!text)return;socket.emit('private-message',{to:privateTo,text});document.getElementById('privateText').value=''}
function addPrivate(m){const b=document.getElementById('privateBody');if(!b)return;b.insertAdjacentHTML('beforeend',`<div class="pmsg ${key(m.from)===key(me.name)?'me':''}"><b style="cursor:pointer" onclick="openMemberCard('${esc(m.from)}')">${esc(m.from)}</b><div>${esc(m.text||'')}</div></div>`);b.scrollTop=b.scrollHeight}
function addPrivateMedia(m){const b=document.getElementById('privateBody');if(!b)return;const med=m.media.mime.startsWith('image/')?`<img src="${esc(m.media.url)}">`:m.media.mime.startsWith('video/')?`<video src="${esc(m.media.url)}" controls></video>`:`<audio src="${esc(m.media.url)}" controls></audio>`;b.insertAdjacentHTML('beforeend',`<div class="pmsg"><b style="cursor:pointer" onclick="openMemberCard('${esc(m.from)}')">${esc(m.from)}</b><div>${med}</div></div>`);b.scrollTop=b.scrollHeight}
function sharePrivate(){if(me.likes<500&&!me.admin)return toast('الإرسال والوسائط تفتح عند 500 إعجاب');const f=document.createElement('input');f.type='file';f.accept='image/*,video/*,audio/*';f.onchange=async()=>{const fd=new FormData();fd.append('file',f.files[0]);fd.append('to',privateTo);fd.append('scope','private');try{const j=await api('/api/media',{method:'POST',body:fd});addPrivateMedia(j)}catch(e){toast(e.message)}};f.click()}
async function openProfile(name){const s=await api('/api/state');const x=(s.online||[]).find(u=>key(u.name)===key(name))||{name,likes:0,level:1,profile:{}};layer(`<div class="profileOverlay"><div class="profileTop"><img src="${esc(avatarFor(x.profile))}"><b>${esc(displayFor(x))}</b><button class="close" style="width:40px;height:38px;font-size:22px" onclick="closeLayer()">×</button></div><img class="profilePhoto" src="${esc(avatarFor(x.profile))}"><div class="profileInfo"><div style="font-weight:900">${esc(x.profile?.status||'متصل الآن')}</div><div>${esc(x.profile?.bio||'عضو في دردشة ريماز عراقية')}</div><div class="badge">مستوى ${x.level} · ${x.likes||0} ♥</div></div><div class="profileGrid"><button onclick="sendLike('${esc(x.name)}')" class="likeBig">♥${x.likes}</button><button onclick="tryPrivate('${esc(x.name)}')">✉ محادثة خاصة</button><button onclick="notifyUser('${esc(x.name)}')">✉ تنبيه</button><button onclick="ignoreUser('${esc(x.name)}')" class="ignore">⛔ تجاهل</button></div></div>`,'profile')}
async function sendLike(n){try{const j=await api('/api/like',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({to:n})});toast('تم الإعجاب ♥ '+j.likes);openMemberProfile(n)}catch(e){toast(e.message)}}
function tryPrivate(n){openPrivate(n)}
async function notifyUser(n){const old=document.getElementById('noticeComposer');if(old)old.remove();const box=document.getElementById('layer');if(!box)return;box.insertAdjacentHTML('beforeend',`<div class="noticeMini" id="noticeComposer"><div class="noticeMiniHead"><b>إرسال تنبيه إلى ${esc(n)}</b><button type="button" onclick="document.getElementById('noticeComposer')?.remove()">×</button></div><div class="noticeMiniBody"><input id="noticeText" placeholder="اكتب التنبيه هنا..." value=""><button type="button" onclick="sendNotice('${esc(n)}')">إرسال ➤</button></div></div>`);document.getElementById('noticeText')?.focus()}
async function sendNotice(n){const text=document.getElementById('noticeText')?.value.trim();if(!text)return toast('اكتب التنبيه');try{await api('/api/notify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({to:n,text})});document.getElementById('noticeComposer')?.remove();toast('تم إرسال التنبيه')}catch(e){showBlockModal(e.message,'التنبيه')}}
function ignoreUser(n){toast('تم تجاهل '+n)}
function openSettings(){const p=me.profile||{};layer(`<div class="overlay">${head('الإعدادات')}<div class="overlayBody settings"><div class="srow"><div class="slabel">الزخرفة</div><div class="svalue"><input id="decor" value="${esc(p.displayName||me.name)}" placeholder="الاسم الظاهر"></div></div><div class="srow"><div class="slabel">الحالة</div><div class="svalue"><input id="status" value="${esc(p.status||'متصل الآن')}" placeholder="متصل الآن"></div></div><div class="srow"><div class="slabel">لون الإسم</div><div class="svalue"><input id="nameColor" type="color" value="${esc(p.nameColor||'#222222')}"></div></div><div class="srow"><div class="slabel">لون الخط</div><div class="svalue"><input id="fontColor" type="color" value="${esc(p.fontColor||p.nameColor||'#222222')}"></div></div><div class="srow"><div class="slabel">لون الخلفية</div><div class="svalue"><input id="bgColor" type="color" value="${esc(p.bgColor||'#ffffff')}"></div></div><button class="save" onclick="saveSettings()">🖉 حفظ</button><button class="plain">حجم الخط - 100%</button><button class="plain">السيرفر الصوتي: الأساسي</button><button class="plain">جودة المايك: الاساسية</button><button class="plain" onclick="changeAvatar()">${me.likes>=10||me.admin?'🖼 تغيير الصورة':'🔒 تغيير الصورة — تحتاج 10 إعجابات'}</button><button class="danger" onclick="deleteAvatar()">✖ حذف الصورة</button><button class="plain toggle ${p.privateOpen!==false?'on':''}" onclick="toggleSetting('privateOpen')">💬 المحادثات الخاصة: ${p.privateOpen!==false?'مفتوحة':'مغلقة'}</button><button class="plain toggle ${p.notificationsOpen!==false?'on':''}" onclick="toggleSetting('notificationsOpen')">✉ التنبيهات: ${p.notificationsOpen!==false?'مفتوحة':'مغلقة'}</button>${me.admin?`<button class="plain" onclick="openAdmin()">👑 لوحة الإدارة</button>`:''}<button class="danger" onclick="logout()">↪ تسجيل خروج</button></div></div>`,'settings')}
async function saveSettings(){try{const j=await api('/api/profile',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({displayName:document.getElementById('decor')?.value||'',status:document.getElementById('status')?.value||'متصل الآن',nameColor:document.getElementById('nameColor')?.value||'#222222',fontColor:document.getElementById('fontColor')?.value||'#222222',bgColor:document.getElementById('bgColor')?.value||'#ffffff'})});me.profile=j.profile;me.displayName=j.profile.displayName;toast('تم الحفظ');closeLayer()}catch(e){toast(e.message)}}
async function toggleSetting(k){const p=me.profile||{};p[k]=p[k]===false;try{const j=await api('/api/profile',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({[k]:p[k]})});me.profile=j.profile;openSettings()}catch(e){toast(e.message)}}
function changeAvatar(){if(me.likes<10&&!me.admin)return toast('الصورة تفتح بعد 10 إعجابات');const f=document.createElement('input');f.type='file';f.accept='image/*';f.onchange=async()=>{const fd=new FormData();fd.append('file',f.files[0]);try{const j=await api('/api/profile/avatar',{method:'POST',body:fd});me.profile.avatar=j.avatar;openSettings()}catch(e){toast(e.message)}};f.click()}
async function deleteAvatar(){try{const j=await api('/api/profile/avatar',{method:'DELETE'});me.profile.avatar='';toast('تم حذف الصورة');openSettings()}catch(e){toast(e.message)}}
async function logout(){try{await api('/api/logout',{method:'POST'})}catch{}localStorage.removeItem('rimaz_sid');sid='';socket?.disconnect();login()}
function emojiPicker(target){document.querySelector('.emojiModal')?.remove();const box=document.createElement('div');box.className='emojiModal';box.innerHTML='<div class="emojiHead"><b>الإيموجي</b><button type="button" id="emojiClose">×</button></div><div class="emojiGrid"></div>';document.querySelector('.chat').appendChild(box);const grid=box.querySelector('.emojiGrid');EMOJIS.forEach(e=>{const b=document.createElement('button');b.type='button';b.textContent=e;b.addEventListener('click',()=>pickEmoji(e,target));grid.appendChild(b)});box.querySelector('#emojiClose').addEventListener('click',()=>box.remove())}
function pickEmoji(e,target){if(target==='public'){const i=document.getElementById('msgInput');i.value+=e;i.focus()}else if(target==='private'){const i=document.getElementById('privateText');if(i){i.value+=e;i.focus()}}else{const i=document.getElementById('wallText');if(i){i.value+=e;i.focus()}}document.querySelector('.emojiModal')?.remove()}
function updateMeBadges(){document.getElementById('onlineCount')?.setAttribute('title',`إعجاباتك: ${me.likes}`)}
function updatePrivateButton(){const n=Object.values(privateUnread).reduce((a,b)=>a+(Number(b)||0),0);const b=document.querySelector('.bottom button:nth-child(4)');if(b)b.innerHTML=`💬 خاص${n?` <span class="unreadBadge">${n}</span>`:''}`}
function notifyCount(){return notifications.length?` (${notifications.length})`:''}
function jsq(s){return JSON.stringify(String(s)).replace(/</g,'\\u003c')}function adminUserRows(a){return a.map(u=>`<div class="adminUser"><div><b>${esc(u.name)}</b><br><small>${u.likes} إعجاب · مستوى ${u.level} · ${u.role||'member'}${u.vip?' · VIP':''}</small></div><button onclick="grantLike(${jsq(u.name)},10)">+10</button><button onclick="giftVip(${jsq(u.name)})">🎁 VIP</button><button onclick="setRole(${jsq(u.name)},'super')">⭐ سوبر</button><button onclick="setRole(${jsq(u.name)},'admin')">🛡️ أدمن</button><button class="red" onclick="resetLikes(${jsq(u.name)})">تصفير</button></div>`).join('')}
async function openAdmin(){try{const d=await api('/api/admin/data');layer(`<div class="overlay admin">${head('لوحة الإدارة')}<div class="tabs"><button class="active" onclick="adminTab('users')">الأعضاء</button><button onclick="adminTab('rooms')">الغرف</button><button onclick="adminTab('tools')">التحكم</button><button onclick="adminTab('banner')">البنرات</button></div><div id="adminBody" class="overlayBody adminPanel">${adminUsers(d.users)}</div></div>`,'admin')}catch(e){toast(e.message)}}
function adminUsers(a){return `<div class="adminCard"><h3>إدارة العضو</h3><div class="adminGrid"><input id="grantName" placeholder="اسم العضو"><input id="grantAmount" type="number" value="1"><button onclick="grantLike(grantName.value,grantAmount.value)">منح إعجاب</button><button onclick="resetLikes(grantName.value)">تصفير اللايكات</button></div><small>التصفير للمالك الأساسي فقط.</small></div><div class="adminCard"><h3>السوبر والأدمن وVIP</h3>${adminUserRows(a)}</div>`}
async function adminTab(t){const d=await api('/api/admin/data');const b=document.getElementById('adminBody');if(t==='users')b.innerHTML=adminUsers(d.users);else if(t==='rooms')b.innerHTML=`<div class="adminCard"><h3>إنشاء غرفة</h3><div class="adminGrid"><input id="rn" placeholder="اسم الغرفة"><input id="rc" type="number" value="50"><select id="rk"><option value="public">عامة</option><option value="private">خاصة</option><option value="voice">مايك</option></select><button onclick="createRoom()">إنشاء</button></div></div>${d.rooms.map(r=>`<div class="adminUser"><div><b>${esc(r.name)}</b><br><small>${r.online||0}/${r.capacity}</small></div><button onclick="toast('تحكم الغرفة: كتم، طرد، حظر')">تحكم</button><button class="red" onclick="deleteRoom('${r.id}')">حذف</button></div>`).join('')}`;else if(t==='banner')b.innerHTML=`<div class="adminCard"><h3>إعلان / بنر</h3><textarea id="bannerText" style="width:100%;min-height:70px" placeholder="اكتب البنر هنا"></textarea><button class="plain" onclick="addBanner()">نشر البنر للجميع</button></div>${(d.banners||[]).map(x=>`<div class="adminCard"><b>${esc(x.text)}</b><br><small>${new Date(x.at).toLocaleString('ar-IQ')}</small><button class="danger" onclick="deleteBanner('${x.id}')">حذف</button></div>`).join('')}`;else b.innerHTML=`<div class="adminCard"><h3>إعلان داخل الدردشة</h3><textarea id="broadcastText" style="width:100%;min-height:70px"></textarea><button class="plain" onclick="broadcast()">إرسال للجميع</button></div><div class="adminCard"><h3>تحكم بالعضو</h3><div class="adminGrid"><input id="modName" placeholder="اسم العضو"><input id="modRoom" value="public"><button onclick="modAction('mute')">كتم</button><button onclick="modAction('ban')">حظر</button><button onclick="modAction('unban')">رفع الحظر</button><button onclick="modAction('kick')">طرد</button></div></div><div class="adminCard"><h3>صلاحيات الإدارة</h3><p>👑 المالك: كل الصلاحيات ومنها تصفير اللايكات.</p><p>🛡️ الأدمن الثاني: إدارة الموقع بدون تصفير اللايكات أو تغيير رتبة المالك.</p><p>⭐ السوبر: رتبة تظهر أعلى الأعضاء، وVIP 🎁 مدته 24 ساعة.</p></div>`}
async function grantLike(n,a){try{const j=await api('/api/admin/grant-like',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n,amount:Number(a)})});toast('تمت إضافة الإعجابات: '+j.likes);openAdmin()}catch(e){toast(e.message)}}
async function resetLikes(n){try{await api('/api/admin/reset-likes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n})});toast('تم التصفير');openAdmin()}catch(e){toast(e.message)}}
async function setRole(n,role){try{await api('/api/admin/role',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n,role})});toast('تم تغيير الرتبة');openAdmin()}catch(e){toast(e.message)}}
async function giftVip(n){try{await api('/api/admin/gift-vip',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n})});toast('تم منح VIP لمدة 24 ساعة');openAdmin()}catch(e){toast(e.message)}}
async function createRoom(){try{await api('/api/admin/room',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:rn.value,capacity:rc.value,kind:rk.value})});toast('تم إنشاء الغرفة');adminTab('rooms')}catch(e){toast(e.message)}}
async function deleteRoom(id){try{await api('/api/admin/room/'+id,{method:'DELETE'});adminTab('rooms')}catch(e){toast(e.message)}}
async function modAction(action){try{await api('/api/admin/'+action,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:modName.value,room:modRoom.value})});toast('تم تنفيذ الأمر')}catch(e){toast(e.message)}}
async function broadcast(){try{await api('/api/admin/broadcast',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:broadcastText.value})});toast('تم الإرسال')}catch(e){toast(e.message)}}
async function addBanner(){try{await api('/api/admin/banner',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:bannerText.value})});toast('تم نشر البنر');adminTab('banner')}catch(e){toast(e.message)}}
async function deleteBanner(id){try{await api('/api/admin/banner/'+id,{method:'DELETE'});adminTab('banner')}catch(e){toast(e.message)}}
let pc=null,localStream=null,callMode='voice';
async function startCall(camera){if(me.likes<500&&!me.admin)return toast('الاتصال يفتح عند 500 إعجاب');callMode=camera?'camera':'voice';pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});localStream=await navigator.mediaDevices.getUserMedia(camera?{audio:true,video:true}:{audio:true});localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));showCall(camera);pc.onicecandidate=e=>e.candidate&&socket.emit('ice',{to:privateTo,candidate:e.candidate});pc.ontrack=e=>{const v=document.getElementById('remoteVideo');if(v)v.srcObject=e.streams[0]};const offer=await pc.createOffer();await pc.setLocalDescription(offer);socket.emit('call-offer',{to:privateTo,offer,video:camera})}
function showCall(camera){document.getElementById('layer').insertAdjacentHTML('beforeend',`<div class="call"><video id="remoteVideo" autoplay playsinline></video><div class="callBar"><button onclick="endCall()">إنهاء</button><button class="ok" onclick="toast('${camera?'كاميرا':'صوت'}')">${camera?'📹 اتصال كام':'☎ اتصال'}</button></div></div>`)}
async function handleOffer(d){if(key(d.from||d.to)!==key(privateTo))return;if(me.likes<500&&!me.admin)return;pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});pc.onicecandidate=e=>e.candidate&&socket.emit('ice',{to:d.from,candidate:e.candidate});pc.ontrack=e=>{const v=document.getElementById('remoteVideo');if(v)v.srcObject=e.streams[0]};localStream=await navigator.mediaDevices.getUserMedia(d.video?{audio:true,video:true}:{audio:true});localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));await pc.setRemoteDescription(d.offer);const ans=await pc.createAnswer();await pc.setLocalDescription(ans);socket.emit('call-answer',{to:d.from,answer:ans,video:d.video});showCall(!!d.video)}
async function handleAnswer(d){if(!pc)return;await pc.setRemoteDescription(d.answer)}
async function handleIce(d){try{await pc?.addIceCandidate(d.candidate)}catch{}}
function endCall(){localStream?.getTracks().forEach(t=>t.stop());pc?.close();pc=null;document.querySelector('.call')?.remove()}
window.addEventListener('beforeunload',()=>socket?.disconnect());
login()
</script>



<script>
(function(){
  if (typeof window.openMemberCard !== 'function') {
    window.openMemberCard = function(name){
      name = String(name || '').trim();
      if (!name) return;
      if (typeof window.openMemberProfile === 'function') return window.openMemberProfile(name);
      if (typeof window.showMemberCard === 'function') return window.showMemberCard(name);
      if (typeof window.openProfileCard === 'function') return window.openProfileCard(name);
    };
  }
})();
</script>
