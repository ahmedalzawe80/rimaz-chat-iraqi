<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>دردشة ريماز عراقية</title>
<script src="/socket.io/socket.io.js"></script>
<style>
:root{--bg:#f7f7f5;--panel:#fff;--soft:#f0f1ef;--line:#dddeda;--text:#222;--muted:#777;--accent:#111;--good:#198754;--danger:#c62828;--shadow:0 8px 30px rgba(0,0,0,.10)}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Tahoma,Arial,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0}.hidden{display:none!important}.app{height:100%;display:flex;flex-direction:column}.top{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:8px 14px;z-index:5}.brand{font-weight:900;font-size:18px;white-space:nowrap}.topstats{display:flex;gap:6px;align-items:center;flex:1;overflow:auto}.badge{background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:7px 10px;font-size:12px;white-space:nowrap}.top-actions{display:flex;gap:6px}.iconbtn,.btn{background:#111;color:#fff;border-radius:10px;padding:9px 12px}.lightbtn{background:#fff;color:#222;border:1px solid var(--line);border-radius:10px;padding:9px 12px}.danger{background:#b42318}.good{background:#198754}.layout{display:flex;flex:1;min-height:0}.side{width:250px;background:#fff;border-left:1px solid var(--line);padding:12px;overflow:auto}.main{flex:1;min-width:0;display:flex;flex-direction:column}.roomhead{background:#fff;border-bottom:1px solid var(--line);padding:12px;display:flex;align-items:center;justify-content:space-between;gap:10px}.roomtitle{font-weight:900}.chat{flex:1;overflow:auto;padding:14px}.msg{max-width:850px;margin:8px auto;background:#fff;border:1px solid var(--line);border-radius:14px;padding:9px 12px;box-shadow:0 2px 8px rgba(0,0,0,.03)}.msg.system{background:#fafafa;color:#666;text-align:center}.msgname{font-weight:800;font-size:13px}.msgtext{margin-top:5px;white-space:pre-wrap;word-break:break-word}.composer{background:#fff;border-top:1px solid var(--line);padding:10px;display:flex;gap:7px;align-items:end}.composer textarea{flex:1;min-height:44px;max-height:120px;resize:none;border:1px solid var(--line);border-radius:12px;padding:10px;background:#fff}.emoji-bar{display:flex;gap:4px;flex-wrap:wrap;padding:7px 10px;background:#fff;border-top:1px solid #eee}.emoji-bar button{background:#f2f2f2;border-radius:9px;padding:5px}.bottom{height:64px;background:#fff;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-around;gap:5px;padding:6px;z-index:5}.bottom button{flex:1;max-width:150px;background:#111;color:#fff;border-radius:10px;padding:9px 6px;font-size:12px}.roomlist{display:grid;gap:8px}.roomcard{background:#fff;border:1px solid var(--line);border-radius:13px;padding:11px;text-align:right}.roomcard strong{display:block}.roomcard small{color:var(--muted)}.overlay{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:30;display:flex;align-items:flex-start;justify-content:center;padding:12px}.sheet{background:#fff;width:min(620px,100%);max-height:calc(100vh - 24px);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}.sheet.half{height:62vh;margin-top:8vh}.sheet.private{width:min(720px,100%);height:min(80vh,720px);margin-top:6vh}.sheethead{padding:12px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}.sheethead .grow{flex:1}.sheetbody{padding:12px;overflow:auto;flex:1}.sheetfoot{border-top:1px solid var(--line);padding:9px;background:#fff}.person{display:flex;align-items:center;gap:9px;padding:10px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px}.avatar{width:42px;height:42px;border-radius:50%;object-fit:cover;background:#eee;display:flex;align-items:center;justify-content:center;font-size:22px;flex:none}.person .grow{flex:1}.person small{color:var(--muted)}.actions{display:flex;gap:6px;flex-wrap:wrap}.actions button{background:#111;color:#fff;border-radius:9px;padding:7px 9px;font-size:12px}.form{display:grid;gap:9px}.form input,.form textarea,.form select{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff}.form textarea{min-height:90px;resize:vertical}.notice{padding:10px;border-radius:10px;background:#fff4d6;border:1px solid #efd48a}.auth{min-height:100%;display:flex;align-items:center;justify-content:center;padding:18px;background:#fafaf8}.authbox{width:min(460px,100%);background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:20px}.tabs{display:flex;gap:6px;margin-bottom:12px}.tabs button{flex:1;background:#eee;border-radius:10px;padding:9px}.tabs button.active{background:#111;color:#fff}.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);z-index:100;background:#111;color:#fff;border-radius:12px;padding:10px 14px;max-width:90%;box-shadow:var(--shadow)}.wallpost{border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;background:#fff}.wallpost img,.wallpost video{max-width:100%;max-height:420px;border-radius:12px;margin-top:8px}.private-msg{padding:8px 10px;border-radius:12px;margin:6px 0;max-width:85%;background:#f0f1ef}.private-msg.mine{margin-right:auto;background:#111;color:#fff}.callbox{position:fixed;inset:auto 12px 76px 12px;background:#111;color:#fff;border-radius:16px;padding:12px;z-index:90;display:none}.callbox video{width:100%;max-height:360px;background:#000;border-radius:12px}.muted{color:var(--muted)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.sep{height:1px;background:var(--line);margin:12px 0}
@media(max-width:900px){.side{display:none}.brand{font-size:15px}.topstats{max-width:45%}.sheet.private{width:96vw;height:86vh;margin-top:3vh}.sheet.half{height:68vh;margin-top:12vh}}
@media(max-width:600px){.top{height:58px;padding:6px}.top-actions .lightbtn span,.top-actions .btn span{display:none}.badge{padding:6px 8px}.bottom{height:60px}.bottom button{font-size:10px;padding:8px 4px}.roomhead{padding:9px}.chat{padding:8px}.composer{padding:7px}.grid2{grid-template-columns:1fr}.overlay{padding:7px}.sheet{max-height:calc(100vh - 14px);border-radius:15px}.sheet.private{height:90vh;margin-top:2vh}}
</style>
</head>
<body>
<div id="root"></div>
<div id="toast" class="toast hidden"></div>
<div id="callBox" class="callbox"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><b id="callTitle">اتصال</b><button class="btn danger" onclick="endCall()">إنهاء</button></div><video id="remoteVideo" autoplay playsinline></video><audio id="remoteAudio" autoplay></audio></div>
<script>
const $=id=>document.getElementById(id);
const SID_KEY="rimaz_sid";
let sid=sessionStorage.getItem(SID_KEY)||"";
let me=null, rooms=[], currentRoom="الغرفة العامة", socket=null;
let privateTo="", privateMessages=[], ignored=false;
let pc=null, localStream=null, callPeer="", callVideo=false;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const avatarHtml=(p,cls="avatar")=>{const a=p?.avatar||"👤";return /^\/uploads\//.test(a)?`<img class="${cls}" src="${esc(a)}" alt="">`:`<div class="${cls}">${esc(a)}</div>`};
async function api(url,opt={}){opt.headers={...(opt.headers||{}),"x-session":sid};const r=await fetch(url,opt);let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.error||"حدث خطأ");return d}
function toast(t){$("toast").textContent=t;$("toast").classList.remove("hidden");clearTimeout(window.__toast);window.__toast=setTimeout(()=>$("toast").classList.add("hidden"),2600)}
function closeOverlay(){document.querySelectorAll(".overlay").forEach(x=>x.remove())}
function modal(title,body,cls=""){const d=document.createElement("div");d.className="overlay";d.innerHTML=`<div class="sheet ${cls}"><div class="sheethead"><b>${title}</b><span class="grow"></span><button class="lightbtn" onclick="this.closest('.overlay').remove()">✕</button></div><div class="sheetbody">${body}</div></div>`;document.body.appendChild(d);return d}
function emojiBar(targetId){const es=["😀","😂","😍","🥰","😘","❤️","🤣","😎","🤍","💔","🔥","👍","👏","🌹","🥺","😅","😢","😉","🤗","🎉"];return `<div class="emoji-bar">${es.map(e=>`<button onclick="addEmoji('${targetId}','${e}')">${e}</button>`).join("")}</div>`}
function addEmoji(id,e){const el=$(id);if(!el)return;el.value+=e;el.focus()}
function authView(){
$("root").innerHTML=`<div class="auth"><div class="authbox"><div style="text-align:center"><div style="font-size:44px">💬</div><h1 style="margin:5px 0">دردشة ريماز عراقية</h1><p class="muted">دردشة عراقية بسيطة وآمنة</p></div><div class="tabs"><button class="active" onclick="authTab('login',this)">دخول عضو</button><button onclick="authTab('register',this)">حساب جديد</button><button onclick="authTab('guest',this)">زائر</button></div><div id="authForm"></div></div></div>`;authTab("login",document.querySelector(".tabs button"));}
function authTab(kind,btn){document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("active"));btn?.classList.add("active");const f=$("authForm");if(kind==="guest")f.innerHTML=`<div class="form"><input id="an" placeholder="اسم الزائر"><button class="btn" onclick="doGuest()">دخول كزائر</button></div>`;else f.innerHTML=`<div class="form"><input id="an" placeholder="الاسم"><input id="ap" type="password" placeholder="الباسورد"><button class="btn" onclick="${kind==="login"?"doLogin()":"doRegister()"}">${kind==="login"?"دخول عضو":"إنشاء حساب"}</button></div>`}
async function doLogin(){try{const d=await apiNoSession("/api/login",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({name:$('an').value,password:$('ap').value})});sid=d.sid;sessionStorage.setItem(SID_KEY,sid);await start()}catch(e){toast(e.message)}}
async function doRegister(){try{const d=await apiNoSession("/api/register",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({name:$('an').value,password:$('ap').value})});sid=d.sid;sessionStorage.setItem(SID_KEY,sid);await start()}catch(e){toast(e.message)}}
async function doGuest(){try{const d=await apiNoSession("/api/guest",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({name:$('an').value})});sid=d.sid;sessionStorage.setItem(SID_KEY,sid);await start()}catch(e){toast(e.message)}}
async function apiNoSession(url,opt={}){const r=await fetch(url,opt);let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.error||"حدث خطأ");return d}
async function start(){try{const s=await api("/api/state");if(!s.user){sid="";sessionStorage.removeItem(SID_KEY);return authView()}me=s.user;rooms=s.rooms;currentRoom=me.room||"الغرفة العامة";renderApp();connectSocket();await joinRoom(currentRoom)}catch(e){sid="";sessionStorage.removeItem(SID_KEY);authView();toast(e.message)}}
function renderApp(){
$("root").innerHTML=`<div class="app"><header class="top"><div class="brand">دردشة ريماز عراقية</div><div class="topstats"><span class="badge">👤 ${esc(me.name)}</span><span class="badge">❤️ <b id="likes">${me.likes}</b></span><span class="badge">⭐ المستوى <b id="level">${me.level}</b></span><span class="badge" id="remain">${remainText()}</span></div><div class="top-actions"><button class="lightbtn" onclick="notificationsView()">🔔 <span id="bellCount">0</span></button><button class="lightbtn" onclick="settingsView()">⚙️</button></div></header><div class="layout"><aside class="side"><div class="roomtitle">الغرف</div><div id="sideRooms" class="roomlist" style="margin-top:10px"></div></aside><main class="main"><div class="roomhead"><div><div class="roomtitle" id="roomName">${esc(currentRoom)}</div><small class="muted" id="roomDesc"></small></div><div class="actions"><button class="lightbtn" onclick="roomsView()">🏠 الغرف</button><button class="lightbtn" onclick="peopleView()">👥 المتواجدين</button></div></div><div id="chat" class="chat"></div><div id="composerWrap"></div></main></div><nav class="bottom"><button onclick="settingsView()">⚙️ الضبط</button><button onclick="wallView()">📝 الجدار</button><button onclick="privateListView()">💬 الخاص</button><button onclick="peopleView()">👥 المتواجدين</button><button onclick="leaveRoom()">🚪 خروج</button><button onclick="profileView()">👤 حسابي</button></nav></div>`;
renderRooms();renderRoomInfo();renderComposer();loadRoomHistory();
}
function remainText(){if(me.likes<400)return `تبقى ${400-me.likes} للتنبيه`;if(me.likes<500)return `تبقى ${500-me.likes} للوسائط والاتصال`;return "الصلاحيات مكتملة"}
function updateStats(){if(!me)return;$("likes").textContent=me.likes;$("level").textContent=me.level;$("remain").textContent=remainText()}
function renderRooms(){const list=$("sideRooms");if(!list)return;list.innerHTML=rooms.map(r=>`<button class="roomcard" onclick="chooseRoom('${esc(r.name)}')"><strong>${esc(r.name)}</strong><small>${esc(r.desc)} · 👥 ${r.online}/${r.capacity}</small></button>`).join("")}
function renderRoomInfo(){const r=rooms.find(x=>x.name===currentRoom);if($('roomName'))$('roomName').textContent=currentRoom;if($('roomDesc'))$('roomDesc').textContent=r?`${r.desc} · ${r.online}/${r.capacity}`:""}
function renderComposer(){const wrap=$("composerWrap");const r=rooms.find(x=>x.name===currentRoom);if(!wrap)return;if(r?.kind==="voice"){wrap.innerHTML=`<div class="composer"><button class="btn" onclick="toggleMic()">🎤 تشغيل/إيقاف المايك</button><button class="lightbtn" onclick="micRequest()">📢 طلب مايك</button></div>`;return}wrap.innerHTML=`${emojiBar("roomInput")}<div class="composer"><textarea id="roomInput" placeholder="اكتب رسالتك..."></textarea><button class="btn" onclick="sendRoom()">➤ إرسال</button></div>`}
function connectSocket(){if(socket)socket.disconnect();socket=io();socket.on("connect",()=>joinRoom(currentRoom));socket.on("history",msgs=>renderMessages(msgs));socket.on("message",m=>appendMessage(m));socket.on("room-error",e=>toast(e.message));socket.on("room-denied",e=>toast(e.message));socket.on("room-kicked",e=>{toast("تم إخراجك من الغرفة");currentRoom="";renderRoomInfo()});socket.on("private",m=>{if(privateTo&&(m.from===privateTo||m.to===privateTo)){privateMessages.push(m);renderPrivateMessages()}else toast(`رسالة خاصة من ${m.from}`)});socket.on("private-opened",d=>{privateTo=d.to;privateMessages=d.messages||[];privateWindow(d.to)});socket.on("private-error",e=>toast(e.message));socket.on("notification",()=>loadBell());socket.on("call-offer",receiveOffer);socket.on("call-answer",receiveAnswer);socket.on("ice",receiveIce);socket.on("call-error",e=>toast(e.message));socket.on("room-presence",()=>{if(document.querySelector(".overlay[data-people]"))peopleView(true)});}
function joinRoom(room){if(!socket||!room)return;socket.emit("join",{sid,room})}
async function chooseRoom(room){closeOverlay();currentRoom=room;joinRoom(room);me.room=room;renderRoomInfo();renderComposer();renderMessages([]);await loadRoomHistory()}
async function loadRoomHistory(){try{const d=await api("/api/messages?room="+encodeURIComponent(currentRoom));renderMessages(d)}catch(e){}}
function renderMessages(msgs){const c=$("chat");if(!c)return;c.innerHTML="";msgs.forEach(appendMessage);c.scrollTop=c.scrollHeight}
function appendMessage(m){const c=$("chat");if(!c)return;const div=document.createElement("div");div.className="msg"+(m.system?" system":"");div.innerHTML=`<div class="msgname">${esc(m.name)} <small class="muted">${new Date(m.time).toLocaleTimeString('ar-IQ',{hour:'2-digit',minute:'2-digit'})}</small></div><div class="msgtext">${esc(m.text)}</div>`;c.appendChild(div);c.scrollTop=c.scrollHeight}
function sendRoom(){const el=$("roomInput");const text=el?.value.trim();if(!text||!socket)return;socket.emit("message",{text});el.value=""}
async function leaveRoom(){if(socket)socket.emit("leave-room");currentRoom="";toast("تم الخروج من الغرفة")}
async function peopleView(refresh=false){let old=document.querySelector("[data-people]");if(old&&!refresh){old.remove();return}if(old&&refresh)old.remove();try{const d=await api("/api/room/status?room="+encodeURIComponent(currentRoom));const o=document.createElement("div");o.className="overlay";o.dataset.people="1";o.innerHTML=`<div class="sheet half"><div class="sheethead"><b>👥 المتواجدين في ${esc(currentRoom)}</b><span class="grow"></span><button class="lightbtn" onclick="this.closest('.overlay').remove()">✕</button></div><div class="sheetbody">${d.people.map(p=>personCard(p)).join("")||'<p class="muted">لا يوجد أحد</p>'}</div></div>`;document.body.appendChild(o)}catch(e){toast(e.message)}}
function personCard(p){return `<div class="person">${avatarHtml(p.profile)}<div class="grow"><b>${esc(p.name)}</b><div><small>❤️ ${p.likes} · ⭐ ${p.level} · ${p.online?'🟢 متصل':'⚪ غير متصل'}</small></div></div><div class="actions"><button onclick="openProfile('${esc(p.name)}')">👤</button>${p.online&&p.name!==me.name?`<button onclick="openPrivate('${esc(p.name)}')">💬</button><button onclick="sendNoticePrompt('${esc(p.name)}')">🔔</button>`:""}</div></div>`}
async function roomsView(){const o=document.createElement("div");o.className="overlay";o.innerHTML=`<div class="sheet half"><div class="sheethead"><b>🏠 الغرف</b><span class="grow"></span><button class="lightbtn" onclick="this.closest('.overlay').remove()">✕</button></div><div class="sheetbody"><div class="roomlist">${rooms.map(r=>`<button class="roomcard" onclick="chooseRoom('${esc(r.name)}')"><strong>${esc(r.name)}</strong><small>${esc(r.desc)} · 👥 ${r.online}/${r.capacity}</small></button>`).join("")}</div></div></div>`;document.body.appendChild(o)}
async function openProfile(name){try{const p=await api("/api/profile/"+encodeURIComponent(name));modal(`👤 ${esc(name)}`,`${avatarHtml(p.profile)}<div style="margin-top:10px"><b>❤️ ${p.likes}</b> · ⭐ ${p.level}</div><p>${esc(p.profile.status)}</p><p>${esc(p.profile.bio)}</p><div class="actions">${p.online&&name!==me.name?`<button onclick="openPrivate('${esc(name)}')">💬 خاص</button><button onclick="sendNoticePrompt('${esc(name)}')">🔔 تنبيه</button><button onclick="toggleIgnore('${esc(name)}',${!p.ignoredByMe})">${p.ignoredByMe?'↩️ إلغاء التجاهل':'🚫 تجاهل'}</button>`:""}<button onclick="giveLike('${esc(name)}')">❤️ إعجاب</button></div>`)}catch(e){toast(e.message)}}
async function giveLike(name){try{const d=await api("/api/like",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({to:name})});toast("تم إعطاء اللايك ❤️");if(name===me.name)me.likes=d.targetLikes;updateStats()}catch(e){toast(e.message)}}
async function toggleIgnore(name,enabled){try{await api("/api/private/ignore",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({to:name,enabled})});toast(enabled?"تم التجاهل":"تم إلغاء التجاهل");closeOverlay()}catch(e){toast(e.message)}}
async function sendNoticePrompt(name){if(me.likes<400&&!me.admin)return toast("التنبيه يفتح عند 400 إعجاب");const o=modal("🔔 إرسال تنبيه",`<div class="form"><textarea id="noticeText" placeholder="اكتب التنبيه"></textarea><button class="btn" onclick="sendNotice('${esc(name)}')">إرسال التنبيه</button></div>`);}
async function sendNotice(name){try{await api("/api/notify",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({to:name,text:$("noticeText").value})});toast("تم إرسال التنبيه");closeOverlay()}catch(e){toast(e.message)}}
async function privateListView(){const d=await api("/api/members");const online=d.filter(x=>x.online&&x.name!==me.name);modal("💬 الخاص",`<p class="muted">اختار شخص حتى تفتح نافذة خاصة فوق الدردشة العامة.</p>${online.map(personCard).join("")||'<p>لا يوجد متصلون الآن.</p>'}`)}
function openPrivate(name){if(name===me.name)return;socket.emit("private-open",{to:name})}
function privateWindow(name){closeOverlay();ignored=false;const o=document.createElement("div");o.className="overlay";o.dataset.private="1";o.innerHTML=`<div class="sheet private"><div class="sheethead"><div class="grow"><b>💬 ${esc(name)}</b><div id="privateStats" class="muted">جاري التحميل...</div></div><button class="lightbtn" onclick="sendNoticePrompt('${esc(name)}')">🔔</button><button class="lightbtn" onclick="toggleIgnore('${esc(name)}',true)">🚫 تجاهل</button><button class="lightbtn" onclick="closePrivate()">✕</button></div><div id="privateBody" class="sheetbody"></div><div class="sheetfoot"><div class="actions"><button onclick="mediaPick('image')">🖼️ صورة</button><button onclick="mediaPick('video')">🎥 فيديو</button><button onclick="mediaPick('audio')">🎵 صوت</button><button onclick="startCall(false)">📞 اتصال صوتي</button><button onclick="startCall(true)">📹 اتصال كام</button></div>${emojiBar("privateInput")}<div class="composer" style="padding:8px 0 0"><textarea id="privateInput" placeholder="اكتب رسالة خاصة..."></textarea><button class="btn" onclick="sendPrivate()">➤ إرسال</button></div></div></div>`;document.body.appendChild(o);loadPrivateProfile(name)}
async function loadPrivateProfile(name){try{const p=await api("/api/profile/"+encodeURIComponent(name));$("privateStats").textContent=`❤️ ${p.likes} · ⭐ المستوى ${p.level} · ${p.online?'🟢 متصل':'⚪ غير متصل'}`;ignored=p.ignoredByMe}catch(e){}}
function renderPrivateMessages(){const b=$("privateBody");if(!b)return;b.innerHTML=privateMessages.map(m=>{const mine=m.from===me.name;let content=esc(m.text||"");if(m.kind==="media")content=`<div>${m.mime?.startsWith('image/')?`<img src="${esc(m.url)}" style="max-width:100%;border-radius:10px">`:m.mime?.startsWith('video/')?`<video src="${esc(m.url)}" controls style="max-width:100%"></video>`:`<audio src="${esc(m.url)}" controls></audio>`}</div>`;return `<div class="private-msg ${mine?'mine':''}"><b>${esc(m.from)}</b><div>${content}</div><small>${new Date(m.time).toLocaleTimeString('ar-IQ',{hour:'2-digit',minute:'2-digit'})}</small></div>`}).join("");b.scrollTop=b.scrollHeight}
function sendPrivate(){const el=$("privateInput");const text=el?.value.trim();if(!text)return;socket.emit("private",{to:privateTo,text});el.value=""}
function closePrivate(){if(socket)socket.emit("private-close",{to:privateTo});privateTo="";document.querySelector('[data-private]')?.remove()}
function mediaPick(kind){if(me.likes<500&&!me.admin)return toast("الوسائط تفتح عند 500 إعجاب");const input=document.createElement("input");input.type="file";input.accept=kind==="image"?"image/*":kind==="video"?"video/*":"audio/*";input.onchange=async()=>{const f=input.files[0];if(!f)return;const fd=new FormData();fd.append("file",f);fd.append("to",privateTo);try{const d=await api("/api/media",{method:"POST",body:fd});const m={id:d.id,from:d.from,to:d.to,url:d.url,mime:d.mime,name:d.name,time:d.time,kind:"media"};if(!privateMessages.some(x=>x.id===m.id))privateMessages.push(m);renderPrivateMessages();toast("تم إرسال الملف")}catch(e){toast(e.message)}};input.click()}
function wallView(){const o=document.createElement("div");o.className="overlay";o.innerHTML=`<div class="sheet"><div class="sheethead"><b>📝 الجدار</b><span class="grow"></span><button class="lightbtn" onclick="this.closest('.overlay').remove()">✕</button></div><div class="sheetbody"><div class="form"><textarea id="wallText" placeholder="اكتب على الجدار..."></textarea>${emojiBar("wallText")}<div class="actions"><button onclick="wallMedia('image')">🖼️ صورة</button><button onclick="wallMedia('video')">🎥 فيديو</button><button class="btn" onclick="wallPost()">➤ نشر</button></div></div><div class="sep"></div><div id="wallList">جارِ التحميل...</div></div></div>`;document.body.appendChild(o);loadWall()}
async function loadWall(){try{const d=await api("/api/wall");$("wallList").innerHTML=d.map(p=>`<div class="wallpost"><div><b>${esc(p.name)}</b> <small class="muted">❤️ ${p.likes}</small></div><p>${esc(p.text||"")}</p>${p.media?(p.media.mime.startsWith('image/')?`<img src="${esc(p.media.url)}">`:p.media.mime.startsWith('video/')?`<video src="${esc(p.media.url)}" controls></video>`:''):''}</div>`).join("")||'<p class="muted">الجدار فارغ.</p>'}catch(e){toast(e.message)}}
async function wallPost(){try{await api("/api/wall",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({text:$("wallText").value})});toast("تم النشر");$("wallText").value="";loadWall()}catch(e){toast(e.message)}}
function wallMedia(kind){if(me.likes<500&&!me.admin)return toast("صور وفيديو الجدار تفتح عند 500 إعجاب");const input=document.createElement("input");input.type="file";input.accept=kind==="image"?"image/*":"video/*";input.onchange=async()=>{const f=input.files[0];if(!f)return;const fd=new FormData();fd.append("file",f);fd.append("text",$("wallText").value);try{await api("/api/wall/media",{method:"POST",body:fd});toast("تم نشر الوسائط");$("wallText").value="";loadWall()}catch(e){toast(e.message)}};input.click()}
async function profileView(){try{const p=await api("/api/profile");const o=modal("👤 حسابي",`<div class="form"><div style="display:flex;align-items:center;gap:10px">${avatarHtml(p.profile)}<div><b>${esc(p.name)}</b><div>❤️ ${p.likes} · ⭐ ${p.level}</div></div></div><label>الصورة ${p.likes>=10?'':'🔒 تحتاج 10 لايكات'}<input id="avatarFile" type="file" accept="image/*" ${p.likes<10?'disabled':''}></label><input id="status" value="${esc(p.profile.status)}" placeholder="الحالة"><textarea id="bio" placeholder="نبذة">${esc(p.profile.bio)}</textarea><input id="nameColor" value="${esc(p.profile.nameColor)}" placeholder="لون الاسم"><input id="bgColor" value="${esc(p.profile.bgColor)}" placeholder="لون الخلفية"><button class="btn" onclick="saveProfile()">حفظ</button></div>`)}catch(e){toast(e.message)}}
async function saveProfile(){try{const body={status:$("status").value,bio:$("bio").value,nameColor:$("nameColor").value,bgColor:$("bgColor").value};await api("/api/profile",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(body)});const f=$("avatarFile")?.files?.[0];if(f){const fd=new FormData();fd.append("file",f);await api("/api/profile/avatar",{method:"POST",body:fd})}toast("تم حفظ الحساب");closeOverlay();const s=await api("/api/state");me=s.user;updateStats()}catch(e){toast(e.message)}}
async function settingsView(){const p=await api("/api/profile");const s=p.settings;const body=`<div class="form"><div class="notice">❤️ ${p.likes} لايك · تغيير الصورة يفتح عند 10.</div><label><input id="privateToggle" type="checkbox" ${s.privateEnabled?'checked':''}> فتح الخاص</label><label><input id="notifyToggle" type="checkbox" ${s.notificationsEnabled?'checked':''}> فتح التنبيهات</label><button class="btn" onclick="saveSettings()">حفظ الضبط</button><button class="lightbtn" onclick="profileView()">👤 الحساب</button>${p.admin?`<button class="lightbtn" onclick="adminView()">🛠️ لوحة الإدارة</button>`:''}<button class="danger btn" onclick="logout()">تسجيل الخروج</button></div>`;modal("⚙️ الضبط",body)}
async function saveSettings(){try{const d=await api("/api/settings",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({privateEnabled:$('privateToggle').checked,notificationsEnabled:$('notifyToggle').checked})});me.settings=d.settings;toast("تم حفظ الضبط");closeOverlay()}catch(e){toast(e.message)}}
async function notificationsView(){try{const d=await api("/api/notifications");const body=d.enabled?(d.items.map(n=>`<div class="person"><div class="grow"><b>${esc(n.from||"النظام")}</b><div>${esc(n.text)}</div></div></div>`).join("")||"<p class=\"muted\">لا توجد تنبيهات.</p>") : "<div class=\"notice\">التنبيهات مغلقة من الضبط.</div>";modal("🔔 التنبيهات",body);await api("/api/notifications/read",{method:"POST"})}catch(e){toast(e.message)}}
async function loadBell(){try{const d=await api("/api/notifications");const count=d.items.filter(x=>!x.read).length;if($("bellCount"))$("bellCount").textContent=count}catch(e){}}
async function adminView(){try{const d=await api("/api/admin/users");const r=await api("/api/rooms");modal("🛠️ لوحة الإدارة",`<div class="grid2"><div><h3>الأعضاء</h3>${d.members.map(x=>`<div class="person"><div class="grow"><b>${esc(x.name)}</b><small>❤️ ${x.likes} · ${x.online?'متصل':'غير متصل'} · ${esc(x.room)}</small></div><button class="lightbtn" onclick="grantLikePrompt('${esc(x.name)}')">❤️+</button></div>`).join("")}</div><div><h3>الزوار</h3>${d.guests.map(x=>`<div class="person"><div class="grow"><b>${esc(x.name)}</b><small>❤️ ${x.likes} · ${esc(x.room)}</small></div><button class="lightbtn" onclick="grantLikePrompt('${esc(x.name)}')">❤️+</button></div>`).join("")}<h3>الغرف</h3>${r.map(x=>`<div class="person"><div class="grow"><b>${esc(x.name)}</b><small>👥 ${x.online}/${x.capacity}</small></div></div>`).join("")}</div></div>`)}catch(e){toast(e.message)}}
async function grantLikePrompt(name){const amount=prompt("عدد اللايكات", "10");if(!amount)return;try{await api("/api/admin/grant-like",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({to:name,amount:Number(amount)})});toast("تمت الإضافة") }catch(e){toast(e.message)}}
async function toggleMic(){const r=rooms.find(x=>x.name===currentRoom);if(!r)return;try{await api("/api/room/mic",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({room:currentRoom,on:true})});toast("تم تشغيل المايك")}catch(e){try{await api("/api/room/mic",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({room:currentRoom,on:false})});toast("تم إيقاف المايك")}catch(_){toast(e.message)}}}
async function micRequest(){try{await api("/api/room/mic-request",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({room:currentRoom})});toast("تم إرسال طلب المايك")}catch(e){toast(e.message)}}
async function startCall(video){if(!privateTo)return toast("افتح الخاص أولًا");if(me.likes<500&&!me.admin)return toast("الاتصال يفتح عند 500 إعجاب");callPeer=privateTo;callVideo=video;try{localStream=await navigator.mediaDevices.getUserMedia({audio:true,video:video});pc=createPC();const offer=await pc.createOffer();await pc.setLocalDescription(offer);socket.emit("call-offer",{to:callPeer,offer,video}) ;showCallBox(video?"📹 اتصال كام":"📞 اتصال صوتي")}catch(e){toast("تعذر تشغيل الاتصال: "+e.message)}}
function createPC(){if(pc)pc.close();const p=new RTCPeerConnection({iceServers:[{urls:"stun:stun.l.google.com:19302"}]});localStream?.getTracks().forEach(t=>p.addTrack(t,localStream));p.onicecandidate=e=>{if(e.candidate)socket.emit("ice",{to:callPeer,candidate:e.candidate})};p.ontrack=e=>{$("remoteVideo").srcObject=e.streams[0];$("remoteAudio").srcObject=e.streams[0]};return p}
async function receiveOffer(d){if(!privateTo)return;if(me.likes<500&&!me.admin)return toast("الاتصال مرفوض: تحتاج 500 إعجاب");callPeer=d.from;callVideo=!!d.video;try{localStream=await navigator.mediaDevices.getUserMedia({audio:true,video:callVideo});pc=createPC();await pc.setRemoteDescription(d.offer);const answer=await pc.createAnswer();await pc.setLocalDescription(answer);socket.emit("call-answer",{to:callPeer,answer});showCallBox(callVideo?"📹 اتصال كام":"📞 اتصال صوتي")}catch(e){toast(e.message)}}
async function receiveAnswer(d){if(!pc)return;try{await pc.setRemoteDescription(d.answer)}catch(e){toast(e.message)}}
async function receiveIce(d){if(!pc||!d.candidate)return;try{await pc.addIceCandidate(d.candidate)}catch(_){}}
function showCallBox(t){$("callTitle").textContent=t;$("callBox").style.display="block"}
function endCall(){try{pc?.close()}catch{}pc=null;localStream?.getTracks().forEach(t=>t.stop());localStream=null;$("callBox").style.display="none"}
(async()=>{if(sid)await start();else authView()})();
</script>
</body>
