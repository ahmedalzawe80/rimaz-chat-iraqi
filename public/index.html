<script>
const app=document.getElementById('app');let sid=localStorage.getItem('rimaz_sid')||'',me=null,rooms=[],currentRoom='public',socket=null,activeOverlay=null,privateTo='',privateOpen=false,notifications=[],privateUnread={},wallUnread=0,privatePeerProfile={},privatePeerUser=null;
const EMOJIS='😀 😃 😄 😁 😆 😅 😂 🤣 😊 😇 🙂 🙃 😉 😌 😍 🥰 😘 😗 😙 😚 😋 😛 😝 😜 🤪 🤨 🧐 🤓 😎 🤩 🥳 😏 😒 😞 😔 😟 😕 🙁 ☹️ 😣 😖 😫 😩 🥺 😢 😭 😤 😠 😡 🤬 🤯 😳 🥵 🥶 😱 😨 😰 😥 😓 🤗 🤔 🫡 🤭 🤫 🤥 😶 😐 😑 😬 🙄 😯 😦 😧 😮 😲 🥱 😴 🤤 😪 😵 🤐 🤑 🤠 😈 👿 👹 👺 🤡 💩 👻 💀 ☠️ 👽 👾 🤖 🎃 😺 😸 😹 😻 😼 😽 🙀 😿 😾 ❤️ 🧡 💛 💚 💙 💜 🖤 🤍 🤎 💔 ❤️‍🔥 💕 💞 💓 💗 💖 💘 💝 💟 💋 👍 👎 👌 ✌️ 🤞 🤟 🤘 🤙 👈 👉 👆 👇 ☝️ ✋ 🤚 🖐️ 🖖 👋 🤏 💪 🙏 👏 🙌 🫶 🤝 💅 👀 👁️ 🧠 🔥 ⭐ 🌟 ✨ 💫 💥 🎉 🎊 🌹 🌷 🌸 🌺 🌻 🦋 🕊️ ☀️ 🌙 ⚡ 💎 👑 🥀 🥰'.split(' ');
function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
async function api(url,opt={}){opt.headers={...(opt.headers||{}),'x-session':sid};let r=await fetch(url,opt);let j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'حدث خطأ');return j}
function toast(t){const x=document.getElementById('toast');if(!x)return;x.textContent=t;x.style.display='block';clearTimeout(x._t);x._t=setTimeout(()=>x.style.display='none',2600)}
function login(){
app.innerHTML=`<div class="login rimazLogin"><header class="rlTop"><div class="rlBrand"><span class="rlHeartLogo" aria-label="دردشة ريماز"><span><b>دردشة</b><em>ريماز</em></span></span><div class="rlBrandTag"><small>محادثات · تواصل · أصدقاء</small></div></div><div class="rlTopTools"><span>⚙ الإعدادات</span><span>؟ مساعدة</span></div></header>
<section class="rlHero"><img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=900&q=85" alt="صورة فتاة للترحيب"><div class="rlHeroCopy"><h1>دردشة <strong>ريماز</strong><br>عراقية</h1><p>أهلاً وسهلاً بك في ريماز ♡</p><small>مكانك للتعارف وتكوين الصداقات</small><div class="rlFlag"><span>الله أكبر</span></div></div></section>
<section class="rlLoginPanel"><div class="rlTabs" dir="rtl">
<button id="tabGuest" onclick="loginMode('guest')"><span>♟</span> دخول زائر</button>
<button id="tabIn" onclick="loginMode('in')"><span>♟</span> دخول عضو</button>
<button id="tabNew" onclick="loginMode('new')"><span>♟✚</span> تسجيل عضو</button></div>
<div id="loginForm" class="loginForm rlForm"></div>
<div class="rlSpecial"><button id="tabHidden" onclick="loginMode('hidden')">🛡 دخول السوبر والإداري</button><button id="tabGhost" onclick="loginMode('ghost')">👻 دخول الشبح</button></div>
</section>
<section class="rlOnline"><div class="rlOnlineHead"><span>👥 المتواجدين الآن</span><b><span id="rlOnlineCount">—</span></b></div><div id="rlOnlineList" class="rlOnlineList"><div class="rlOnlineEmpty">جارٍ تحميل المتواجدين…</div></div><div class="rlOnlineFoot">قائمة للعرض فقط — سجّل دخولك للمشاركة بالدردشة</div></section>
<footer class="rlFooter"><span>دردشة ريماز عراقية</span><span>♥ أهلاً بكم</span></footer></div>`;
loginMode('in');loadPublicOnline();if(window.rimazOnlineTimer)clearInterval(window.rimazOnlineTimer);window.rimazOnlineTimer=setInterval(loadPublicOnline,15000);
}
function keepKeyboardVisible(){document.querySelectorAll('#loginForm input').forEach(i=>i.addEventListener('focus',()=>setTimeout(()=>i.scrollIntoView({block:'center',behavior:'smooth'}),120)));}
window.visualViewport?.addEventListener('resize',()=>{const a=document.activeElement;if(a&&a.matches?.('#loginForm input'))setTimeout(()=>a.scrollIntoView({block:'center',behavior:'smooth'}),60)});
function loginMode(mode){
['tabNew','tabIn','tabGuest','tabHidden','tabGhost'].forEach(id=>document.getElementById(id)?.classList.remove('active'));
const ids={new:'tabNew',in:'tabIn',guest:'tabGuest',hidden:'tabHidden',ghost:'tabGhost'};
document.getElementById(ids[mode])?.classList.add('active');
const f=document.getElementById('loginForm');if(!f)return;
if(mode==='guest'){
f.innerHTML=`<input id="ln" autocomplete="nickname" placeholder="اكتب اسم الزائر (اسم فريد)" aria-label="اسم الزائر"><button class="primary guest" onclick="doGuest()">دخول زائر ←</button>`;
}else if(mode==='in'||mode==='new'){
f.innerHTML=`<input id="ln" autocomplete="username" placeholder="${mode==='new'?'اختر اسم عضو غير مستخدم':'اكتب اسم العضو'}" aria-label="اسم العضو"><input id="lp" type="password" autocomplete="${mode==='new'?'new-password':'current-password'}" placeholder="اكتب كلمة المرور" aria-label="كلمة المرور"><button class="primary" onclick="${mode==='new'?'doRegister()':'doLogin()'}">${mode==='new'?'تسجيل (عضو جديد)':'دخول عضو'} ←</button>`;
}else{
f.innerHTML=`<div class="rlPrivateNote">${mode==='ghost'?'دخول الشبح مخصص لمالك الموقع فقط':'الدخول المخفي مخصص للسوبر والإداري المخوّل'}</div><input id="ln" autocomplete="username" placeholder="اسم الحساب" aria-label="اسم الحساب"><input id="lp" type="password" autocomplete="current-password" placeholder="كلمة المرور" aria-label="كلمة المرور"><button class="primary" onclick="doPrivilegedLogin('${mode}')">${mode==='ghost'?'دخول الشبح':'دخول مخفي'} ←</button>`;
}
keepKeyboardVisible();
}
async function doPrivilegedLogin(mode){
const n=document.getElementById('ln')?.value||'',p=document.getElementById('lp')?.value||'';
try{
const j=await api('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n,password:p})});
if(mode==='ghost'&&!j.user?.owner)throw new Error('دخول الشبح مخصص لمالك الموقع فقط');
if(mode==='hidden'&&!j.user?.staff)throw new Error('هذا الحساب لا يملك صلاحية الدخول المخفي');
sid=j.sid;localStorage.setItem('rimaz_sid',sid);await boot();
}catch(e){toast(e.message||'تعذر الدخول');}
}
async function loadPublicOnline(){
const list=document.getElementById('rlOnlineList');if(!list)return;
try{
const r=await fetch('/api/public-online',{cache:'no-store'});if(!r.ok)throw new Error('تعذر التحميل');const data=await r.json();
const users=Array.isArray(data.users)?data.users:[];
const count=document.getElementById('rlOnlineCount');if(count)count.textContent=users.length;
list.innerHTML=users.length?users.map(u=>`<div class="rlOnlineMember"><div class="rlAvatar">${u.avatar?`<img src="${esc(u.avatar)}" alt="">`:'👤'}</div><div class="rlMemberInfo"><b>${esc(u.displayName||u.name||'عضو')}</b><small><i></i> ${esc(u.status||(u.type==='guest'?'(غير مسجل)':'(عضو جديد)'))}</small></div><span class="rlFlagMini">🇮🇶</span><span class="rlDot"></span></div>`).join(''):'<div class="rlOnlineEmpty">لا يوجد أعضاء متصلون حالياً</div>';
}catch(e){list.innerHTML='<div class="rlOnlineEmpty">قائمة المتواجدين غير متاحة حالياً</div>';}
}
async function doRegister(){try{const j=await api('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:ln.value,password:lp.value})});sid=j.sid;localStorage.setItem('rimaz_sid',sid);await boot()}catch(e){toast(e.message)}}
async function doLogin(){try{const j=await api('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:ln.value,password:lp.value})});sid=j.sid;localStorage.setItem('rimaz_sid',sid);await boot()}catch(e){toast(e.message)}}
async function doGuest(){try{const j=await api('/api/guest',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:ln.value})});sid=j.sid;localStorage.setItem('rimaz_sid',sid);await boot()}catch(e){toast(e.message)}}
async function boot(){try{const s=await api('/api/state?entry=1');me=s.user;rooms=s.rooms;currentRoom='public';notifications=await api('/api/notifications');const privateContacts=await api('/api/private/contacts');privateContacts.forEach(x=>{privateUnread[key(x.name)]=Number(x.unread)||0});renderChat();updatePrivateButton();connect();}catch(e){sid='';localStorage.removeItem('rimaz_sid');login()}}
function displayFor(x){return x?.displayName||x?.profile?.displayName||x?.name||''}
function avatarFor(p){return p?.avatar||'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect width="100" height="100" fill="#fff"/><text x="50" y="43" text-anchor="middle" font-family="Tahoma" font-size="15" font-weight="700" fill="#111">دردشة</text><text x="50" y="62" text-anchor="middle" font-family="Tahoma" font-size="18" font-weight="900" fill="#111">ريماز</text></svg>`)}
function rankIconSvg(rank){const common='viewBox="0 0 32 32" aria-hidden="true" focusable="false"';const paths={
'admin-shield':'<path d="M16 2 29 9 26 23 16 30 6 23 3 9Z" fill="currentColor" stroke="currentColor" stroke-width="1.5"/><path d="M16 7 23 11 21 21 16 25 11 21 9 11Z" fill="none" stroke="#fff" stroke-width="1.4"/>',
'crown-gold':'<path d="M3 10 9 15 13 5 18 14 25 4 28 10 26 25 6 25Z" fill="currentColor" stroke="currentColor" stroke-width="1.4"/><path d="M7 20H25M8 28H24" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>',
'crown-silver':'<path d="M3 10 9 15 13 5 18 14 25 4 28 10 26 25 6 25Z" fill="currentColor" stroke="currentColor" stroke-width="1.4"/><path d="M7 20H25M8 28H24" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>',
'super-black':'<path d="M16 2 20 11 30 12 22.5 19 24.5 29 16 24 7.5 29 9.5 19 2 12 12 11Z" fill="currentColor" stroke="currentColor" stroke-linejoin="round"/>',

async function openMembers(){const a=await api('/api/members');layer(`<div class="overlay membersOverlay"><div class="overlayHead membersHead"><span>المتواجدين</span><button class="close" onclick="closeLayer()">×</button></div><div class="overlayBody"><div style="padding:5px"><input id="memberSearch" style="width:100%;height:38px;border:1px solid #aaa;padding:5px" placeholder="... البحث" oninput="filterMembers()"></div><div id="memberList">${memberRows(a)}</div></div></div>`,'members')}
function memberRows(a){const onlineUsers=a.filter(x=>x.online===true);const roomUsers=currentRoom?onlineUsers.filter(x=>String(x.room||'')===String(currentRoom)):[];const allRows=list=>list.map(x=>{const online=x.online!==false;const dot=memberStatusClass(x);return `<div class="member row ${String(x.name||'').toLowerCase()==='admin'?'adminMember':''}" data-name="${esc(displayFor(x))}" onclick="openMemberProfile('${esc(x.name)}')"><span class="memberStatusBar ${dot}" title="${online?(x.profile?.privateOpen===false?'الخاص مغلق':'الخاص مفتوح'):'غير موجود'}"></span><img src="${esc(avatarFor(x.profile))}">${memberBadge(x)}<div class="memberMain"><div class="memberName">${esc(displayFor(x))}</div><div class="memberSub">${esc(online?(x.profile?.status||(x.type==='guest'?'(غير مسجل)':'(عضو جديد)')):'غير متصل')}</div></div><div class="memberLikes">${String(x.name||'').toLowerCase()==='admin'?'':`${x.likes} ♥<br><span class="flag">${x.type==='guest'?'👤':'🇮🇶'}</span>`}</div></div>`}).join('');if(currentRoom){const roomRows=allRows(roomUsers);const roomUserNames=new Set(roomUsers.map(x=>key(x.name)));const otherOnlineUsers=onlineUsers.filter(x=>!roomUserNames.has(key(x.name)));const allOnlineRows=allRows(otherOnlineUsers);return `${roomRows||'<div class="empty">لا يوجد أعضاء في هذه الغرفة</div>'}<div class="memberSectionBar">المتواجدين في الدردشة</div>${allOnlineRows||'<div class="empty">لا يوجد متواجدون</div>'}`}return allRows(onlineUsers)||'<div class="empty">لا يوجد متواجدون</div>'}
function filterMembers(){const q=key(memberSearch.value);document.querySelectorAll('#memberList .member').forEach(x=>x.style.display=key(x.dataset.name).includes(q)?'grid':'none')}
async function openRooms(){const s=await api('/api/state');rooms=s.rooms;layer(`<div class="overlay roomsOverlay"><div class="overlayHead roomsHead"><button class="close" onclick="closeLayer()">×</button><span>غرف الدردشة: ${rooms.reduce((n,r)=>n+(r.online||0),0)}</span></div><div class="overlayBody"><button class="newRoom" onclick="openCreateRoomModal()">+ إنشاء غرفة</button>${rooms.map(r=>`<div class="room room-theme-${r.theme==='black'?'black':'red'}" onclick="reenterRoom('${esc(r.id)}')"><img src="${esc(r.image||avatarFor({}))}"><span class="roomLockMark">${r.locked?'🔒':''}</span><div><div class="roomName">${esc(r.name)}</div><div class="roomDesc">${esc(r.desc||'غرفة عامة ..')}</div></div><div class="count ${r.kind==='voice'?'voice':''}">${r.kind==='voice'?'🎙️':'♟'}${r.online||0}/${r.capacity}</div></div>`).join('')}</div></div>`,'rooms')}
function openCreateRoomModal(){layer(`<div class="overlay createRoomOverlay"><div class="overlayHead"><button class="close" onclick="openRooms()">×</button><b>إنشاء غرفة جديدة</b></div><div class="overlayBody createRoomForm"><label>اسم الغرفة</label><input id="publicRoomName" maxlength="40" placeholder="اكتب اسم الغرفة"><label>وصف الغرفة</label><input id="publicRoomDesc" maxlength="160" placeholder="وصف مختصر (اختياري)"><label>صورة الغرفة (اختياري)</label><label class="roomImagePicker">📷 إضافة صورة للغرفة<input id="publicRoomImageFile" type="file" accept="image/png,image/jpeg,image/webp,image/gif" onchange="previewPublicRoomImage(this)"><span id="publicRoomImageFileName">اضغط هنا لاختيار صورة</span></label><img id="publicRoomImagePreview" alt="معاينة صورة الغرفة" style="display:none;max-width:120px;max-height:120px;object-fit:cover;border-radius:8px"><label>نوع الغرفة</label><div class="createRoomKinds"><label><input type="radio" name="publicRoomKind" value="public" checked> 💬 كتابية</label><label><input type="radio" name="publicRoomKind" value="voice"> 🎙️ صوتية</label></div><label>عدد الأعضاء الأقصى</label><input id="publicRoomCapacity" type="number" min="2" max="200" value="50"><div id="publicMicSettings" style="display:none"><label>عدد المايكات</label><input id="publicRoomMics" type="number" min="1" max="20" value="8"><label>اللايكات المطلوبة لفتح المايك</label><input id="publicRoomLikes" type="number" min="0" max="1000000" value="30"></div><button type="button" onclick="document.getElementById('publicMicSettings').style.display=document.querySelector('input[name=publicRoomKind]:checked')?.value==='voice'?'block':'none'">تحديث إعدادات النوع</button><button class="newRoom" onclick="submitPublicRoom()">إنشاء الغرفة</button></div></div>`,'createRoom');document.querySelectorAll('input[name=publicRoomKind]').forEach(x=>x.addEventListener('change',()=>{const e=document.getElementById('publicMicSettings');if(e)e.style.display=document.querySelector('input[name=publicRoomKind]:checked')?.value==='voice'?'block':'none'}))}

async function openWall(){wallUnread=0;updateWallButton();const [w,members,status]=await Promise.all([api('/api/wall'),api('/api/members'),api('/api/wall/status')]);const byName=new Map(members.map(u=>[key(u.name),u]));const posts=w.map(p=>{const u=byName.get(key(p.from));return {...p,profile:u?.profile||p.profile||{},role:u?.role||p.role,vip:u?.vip||p.vip,displayName:u?(displayFor(u)||p.from):(p.displayName||p.from)}});const paused=!status.enabled;layer(`<div class="overlay">${head('الحائط')}<div class="overlayBody wallOverlayBody">${paused?'<div style="padding:10px;background:#fff1f1;color:#a00;text-align:center;font-weight:900">الحائط متوقف مؤقتاً من الإدارة</div>':''}<div id="wallPosts" class="wallPosts">${posts.map(wallCard).join('')}</div><div class="wallInput"><div class="wallCompose"><button ${paused?'disabled style="opacity:.45"':''} onclick="postWall()">إرسال ➤</button><textarea id="wallText" ${paused?'disabled':''} placeholder="${paused?'الحائط متوقف حالياً':'اكتب منشورك...'}"></textarea><button class="smile" ${paused?'disabled':''} onclick="emojiPicker('wall')">🙂</button><button ${paused?'disabled':''} onclick="wallMedia()">📎</button></div></div></div></div>`,'wall')}
function wallCard(p){let m='';if(p.media)m=p.media.mime.startsWith('image/')?`<img src="${esc(p.media.url)}" class="wallMedia">`:`<video src="${esc(p.media.url)}" class="wallMedia" controls></video>`;return `<div class="wallPost"><img class="wallAvatar" onclick="openMemberProfile('${esc(p.from)}')" src="${esc(avatarFor(p.profile||{}))}"><div class="wallPostMain"><div class="wallText"><div class="rimazUnifiedName"><span class="rimazRoleBadge">${memberBadge(p)}</span><b onclick="openMemberProfile('${esc(p.from)}')" style="cursor:pointer">${esc(p.displayName||p.from)}</b></div><div>${esc(p.text||'')}</div>${m}</div><div class="wallActions"><button onclick="wallLike('${p.id}')">♥${p.likes||''}</button><button onclick="toast('التعليقات متاحة داخل المنشور')">💬</button></div></div></div>`}
async function postWall(){const text=document.getElementById('wallText')?.value.trim();if(!text)return toast('اكتب شيئاً أولاً');try{await api('/api/wall',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});toast('تم النشر');openWall()}catch(e){toast(e.message)}}

function countryFlag(value){const raw=String(value||'').trim();let code=raw.toUpperCase();const names={'IRAQ':'IQ','العراق':'IQ','UNITED STATES':'US','USA':'US','AMERICA':'US','أمريكا':'US','السعودية':'SA','SAUDI ARABIA':'SA','KUWAIT':'KW','الكويت':'KW','JORDAN':'JO','الأردن':'JO','TURKEY':'TR','تركيا':'TR','SYRIA':'SY','سوريا':'SY','EGYPT':'EG','مصر':'EG','UNITED KINGDOM':'GB','BRITAIN':'GB','بريطانيا':'GB'};code=names[code]||code;if(!/^[A-Z]{2}$/.test(code))return '🏳️';return String.fromCodePoint(...[...code].map(c=>127397+c.charCodeAt(0)));}

function privateSenderBadge(m,mine,prof){const base=mine?(me||{}):(privatePeerUser||{});const actualProfile=m.profile||prof||base.profile||{};const role=m.role||base.role||actualProfile.role||(mine&&me?.owner?'owner':mine&&me?.admin?'admin':null);return memberBadge({...base,...m,...actualProfile,profile:actualProfile,role,name:m.from,from:m.from,vip:m.vip??base.vip??actualProfile.vip});}

async function saveClassicMemberStats(n,field){
 const el=document.getElementById(field==='likes'?'classicLikeAmount':'classicPointsAmount');
 const value=Number(el?.value);
 if(!Number.isInteger(value)||value<0||value>1000000)return toast('أدخل عدداً صحيحاً بين 0 و1000000');
 try{const j=await api('/api/admin/member-stats/'+encodeURIComponent(n),{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({field,value})});toast(field==='likes'?'تم حفظ عدد اللايكات: '+j.likes:'تم حفظ النقاط: '+j.points);await openMemberProfile(n)}catch(e){toast(e.message)}
}
async function saveClassicSelectedRank(n){

 if(!rank)return toast('اختر الرتبة أولاً');
 if(!Number.isInteger(days)||days<0||days>36500)return toast('المدة يجب أن تكون 0 أو عدد أيام صحيح');
 const label=RIMAZ_RANKS.find(r=>r[0]===rank)?.[1]||rank;
 if(!confirm('تأكيد منح '+label+' للعضو '+n+' لمدة '+(days===0?'دائمة':days+' يوم')+'؟'))return;
 try{await api('/api/admin/rank',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n,rank,durationDays:days})});toast('تم حفظ الرتبة والمدة');await openMemberProfile(n)}catch(e){toast(e.message)}
}

function adminOverview(d){const all=[...(d.users||[]),...(d.guests||[])];const shortcuts=[['users_view','users','إدارة الأعضاء'],['room_move','move','نقل الأعضاء'],['rooms_manage','rooms','إنشاء / تعديل غرفة'],['announcements','announcements','نشر إعلان'],['moderation','moderation','قوائم الحظر والكتم'],['messages_delete','messages','حذف رسالة'],['gifts','gifts','الهدايا'],['vip','gifts','إدارة VIP'],['rank_assign','roles','إدارة الرتب'],['permission_manage','rankpermissions','صلاحيات الرتب'],['avatar_delete','membertools','أدوات الأعضاء']].filter(([p])=>hasClientPermission(p));return `<div class="adminCard"><h3>ملخص الموقع</h3><div class="adminGrid"><div><b>${all.length}</b><br><small>حسابات وزوار معروفون</small></div><div><b>${all.filter(x=>x.online).length}</b><br><small>متصلون الآن</small></div><div><b>${(d.rooms||[]).length}</b><br><small>غرف</small></div><div><b>${(d.messages||[]).length}</b><br><small>رسائل محفوظة بالقائمة</small></div></div></div><div class="adminCard"><h3>اختصارات الإدارة</h3><div class="adminGrid">${shortcuts.map(([p,t,label])=>`<button onclick="adminTab('${t}')">${label}</button>`).join('')||'<p>لا توجد إجراءات إدارية ممنوحة لهذه الرتبة.</p>'}</div></div><div class="adminCard"><h3>حدود الصلاحيات</h3><p>${me?.owner?'إدارة المالك. الإجراءات الحساسة محمية.':'تظهر هنا الأقسام التي تسمح بها صلاحيات رتبتك فقط.'}</p></div>`}

async function modUser(action,n){if(action==='global'||action==='global-kick'||action==='global-ban'){let globalAction=action;if(action==='global'){const choice=prompt('اختار الإجراء خارج الدردشة:\n1 - طرد (يقدر يرجع مباشرة)\n2 - حظر 5 دقائق','1');if(choice===null)return;globalAction=choice.trim()==='1'?'global-kick':choice.trim()==='2'?'global-ban':'';}if(!globalAction)return toast('اختيار غير صحيح');if(!confirm((globalAction==='global-kick'?'طرد '+n+' من الدردشة كلها؟':'حظر '+n+' من الدردشة لمدة 5 دقائق؟')))return;try{await api('/api/admin/member-action',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n,action:globalAction})});toast(globalAction==='global-kick'?'تم طرد العضو من الدردشة؛ يمكنه الرجوع':'تم حظر العضو من الدردشة لمدة 5 دقائق');adminTab('users')}catch(e){toast(e.message)}return}const room=prompt('اكتب رمز الغرفة أو public للغرفة العامة',currentRoom||'public');if(!room)return;const route=action==='unban'?'/api/admin/unban':action==='unmute'?'/api/admin/unmute':'/api/admin/member-action';try{await api(route,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n,action,room})});toast(({kick:'تم الطرد من الغرفة',ban:'تم الحظر من الغرفة لمدة 15 دقيقة',mute:'تم الكتم في الغرفة',unban:'تم رفع الحظر',unmute:'تم رفع الكتم'})[action]||'تم التنفيذ');adminTab('users')}catch(e){toast(e.message)}}

async function adminDeleteAvatar(n){if(!confirm('متأكد تريد حذف صورة '+n+'؟'))return;try{await api('/api/admin/avatar/'+encodeURIComponent(n),{method:'DELETE'});toast('تم حذف صورة العضو');adminTab('users')}catch(e){toast(e.message)}}
async function adminChangeColor(n){const u=(window.adminCachedUsers||[]).find(x=>key(x.name)===key(n))||{},p=u.profile||{};const palette=['#111111','#ffffff','#e53935','#d81b60','#8e24aa','#3949ab','#1e88e5','#039be5','#00acc1','#00897b','#43a047','#7cb342','#fdd835','#fb8c00','#6d4c41','#757575'];const swatches=(id,current)=>palette.map(c=>`<button type="button" title="${c}" onclick="document.getElementById('${id}').value='${c}'" style="width:34px;height:34px;border:2px solid #bbb;border-radius:7px;background:${c};margin:3px"></button>`).join('');layer(`<div class="overlay">${head('اختيار ألوان العضو')}<div class="overlayBody settings"><p style="text-align:center;font-weight:800">اختار اللون من المربعات أو افتح منتقي الألوان</p><div class="srow"><div class="slabel">لون الاسم</div><div class="svalue"><input id="adminNameColor" type="color" value="${esc(p.nameColor||'#222222')}"></div></div><div class="adminColorPalette">${swatches('adminNameColor',p.nameColor)}</div><div class="srow"><div class="slabel">لون الخط</div><div class="svalue"><input id="adminFontColor" type="color" value="${esc(p.fontColor||p.nameColor||'#222222')}"></div></div><div class="adminColorPalette">${swatches('adminFontColor',p.fontColor||p.nameColor)}</div><div class="srow"><div class="slabel">لون الخلفية</div><div class="svalue"><input id="adminBgColor" type="color" value="${esc(p.bgColor||'#ffffff')}"></div></div><div class="adminColorPalette">${swatches('adminBgColor',p.bgColor)}</div><button class="save" onclick="saveAdminMemberColors(${jsq(n)})">حفظ الألوان</button><button class="plain" onclick="closeLayer()">إلغاء</button></div></div>`,'adminColorPicker')}
async function saveAdminMemberColors(n){try{await api('/api/admin/profile/'+encodeURIComponent(n),{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({nameColor:document.getElementById('adminNameColor')?.value||'#222222',fontColor:document.getElementById('adminFontColor')?.value||'#222222',bgColor:document.getElementById('adminBgColor')?.value||'#ffffff'})});toast('تم تحديث ألوان العضو');closeLayer();}catch(e){toast(e.message)}}
async function adminDecorateName(n){const u=(window.adminCachedUsers||[]).find(x=>key(x.name)===key(n))||{},p=u.profile||{};const decorated=prompt('اكتب زخرفة الاسم الجديدة للعضو '+n,p.displayName||u.displayName||n);if(decorated===null)return;if(!decorated.trim())return toast('الزخرفة لا يمكن أن تكون فارغة');try{await api('/api/admin/profile/'+encodeURIComponent(n),{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({displayName:decorated.trim()})});toast('تم حفظ زخرفة الاسم');const cached=(window.adminCachedUsers||[]).find(x=>key(x.name)===key(n));if(cached){cached.displayName=decorated.trim();cached.profile=cached.profile||{};cached.profile.displayName=decorated.trim()}adminTab('users')}catch(e){toast(e.message)}}
const RIMAZ_RANKS=[['admin-full','👑 ADMIN كامل الصلاحيات'],['admin-shield','⬟ الإداري'],['crown-gold','♛ البنر الذهبي'],['crown-silver','♛ البنر الفضي'],['super-black','★ السوبر الأسود'],['super-white','★ السوبر الأبيض'],['super-red','★ السوبر الأحمر']];
async function chooseRank(n){const opts=RIMAZ_RANKS.map((r,i)=>(i+1)+' - '+r[1]).join('\n');const answer=prompt('اختار رتبة للعضو '+n+':\n'+opts,'1');if(answer===null)return;const item=RIMAZ_RANKS[Number(answer)-1];if(!item)return toast('اختيار غير صحيح');if(!confirm('تأكيد تعيين '+item[1]+' للعضو '+n+'؟'))return;try{await api('/api/admin/rank',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n,rank:item[0]})});toast('تم تحديث رتبة العضو');adminTab('users')}catch(e){toast(e.message)}}
async function showMemberIp(n){if(!n)return toast('حدد العضو أولاً');try{const d=await api('/api/admin/member-ip/'+encodeURIComponent(n));if(!d.connections?.length)return alert('العضو غير متصل حالياً؛ لا يوجد IP مباشر متاح.');alert('معلومات اتصال '+n+' (لصاحب الموقع فقط):\n'+d.connections.map((x,i)=>(i+1)+'. IP: '+(x.ip||'غير متاح')+' | الغرفة: '+(x.room||'خارج الغرفة')).join('\n'))}catch(e){toast(e.message)}}

const RIMAZ_EXTRA_GIFTS=[['🎈','بالون احتفالي'],['🧿','عين زرقاء'],['🪻','زهرة بنفسجية'],['🦚','طاووس ملون'],['🎀','شريطة هدية'],['🍫','شوكولاتة'],['🌙','قمر فضي'],['🧸','دبدوب'],['🏆','كأس ذهبي']];

async function grantSelectedVip(){const n=document.getElementById('giftTarget')?.value;if(!n)return toast('حدد العضو أولاً');if(!confirm('منح VIP لمدة 24 ساعة إلى '+n+'؟'))return;try{await api('/api/admin/gift-vip',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n})});toast('تم منح VIP لمدة 24 ساعة');adminTab('gifts')}catch(e){toast(e.message)}}
function showSelectedMemberIp(){const n=document.getElementById('ipTarget')?.value;if(!n)return toast('حدد العضو أولاً');return showMemberIp(n)}
async function applySelectedRank(){const n=document.getElementById('rankTarget')?.value;const i=Number(document.getElementById('rankChoice')?.value);const daysRaw=document.getElementById('rankDurationDays')?.value??'0';const durationDays=Number(daysRaw);if(!n)return toast('حدد العضو أولاً');const r=RIMAZ_RANKS[i];if(!r)return toast('حدد رتبة صحيحة');if(!Number.isInteger(durationDays)||durationDays<0||durationDays>36500)return toast('المدة لازم تكون 0 أو عدد أيام صحيح');await chooseRankDirect(n,r[0],r[1],durationDays)}
async function chooseRankDirect(n,rank,label,durationDays=0){const durationText=rank==='none'?'':durationDays===0?' (دائمة)':' لمدة '+durationDays+' يوم';if(!confirm('تأكيد تعيين '+label+' للعضو '+n+durationText+'؟'))return;try{await api('/api/admin/rank',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n,rank,durationDays})});toast('تم تحديث رتبة العضو');adminTab('roles')}catch(e){toast(e.message)}}
async function adminShowGiftRemoval(name){try{await adminTab('gifts');const select=document.getElementById('giftTarget');if(select){select.value=name;renderGiftRemovalList();}else toast('ما كدرت أفتح قائمة الهدايا؛ افتح قسم الهدايا وجرب مرة ثانية');}catch(e){toast(e.message||'تعذر فتح هدايا العضو')}}
function renderGiftRemovalList(){const name=document.getElementById('giftTarget')?.value,box=document.getElementById('giftRemovalList');if(!box)return;const member=(window.adminCachedUsers||[]).find(u=>String(u.name)===String(name));const gifts=Array.isArray(member?.profile?.gifts)?member.profile.gifts:[];if(!name){box.innerHTML='<p class="muted">اختر عضواً لعرض هداياه الحالية.</p>';return}if(!gifts.length){box.innerHTML='<p class="muted">هذا العضو ما عنده هدايا ظاهرة قابلة للحذف.</p>';return}box.innerHTML=gifts.map((g,i)=>`<div class="adminUser"><div><b>${esc(g.gift||'هدية')}</b><br><small>${esc(g.from||'')} · ${g.at?new Date(g.at).toLocaleString('ar-IQ'):''}</small></div><button class="red" onclick="deleteGrantedGift(${jsq(name)},${i})">حذف الهدية</button></div>`).join('')}
async function deleteGrantedGift(name,index){if(!confirm('متأكد تريد حذف هذه الهدية من ملف '+name+'؟'))return;try{await api('/api/admin/gift/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,index})});toast('تم حذف الهدية');await adminTab('gifts');const sel=document.getElementById('giftTarget');if(sel){sel.value=name;renderGiftRemovalList()}}catch(e){toast('تعذر حذف الهدية: '+e.message)}}
async function renderGiftCatalogRemovalList(){const box=document.getElementById('giftCatalogRemovalList');if(!box)return;try{const d=await api('/api/admin/data');const list=Array.isArray(d.giftCatalog)?d.giftCatalog:[];box.innerHTML=list.length?list.map((g,i)=>`<div class="adminUser"><div><b>${esc(g.icon||g[0]||'🎁')} ${esc(g.name||g[1]||'هدية')}</b><br><small>هدية مضافة يدوياً</small></div><button class="red" onclick="deleteCatalogGift(${i})">حذف من القائمة</button></div>`).join(''):'<p class="muted">ماكو هدايا مضافة يدوياً حالياً.</p>';}catch(e){box.innerHTML='<p class="muted">تعذر تحميل الهدايا: '+esc(e.message||'خطأ')+'</p>'}}
async function deleteCatalogGift(index){if(!confirm('متأكد تريد حذف هذه الهدية من قائمة الاختيار؟ هذا لا يحذف الهدايا الممنوحة سابقاً للأعضاء.'))return;try{await api('/api/admin/gifts/catalog/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({index})});toast('تم حذف الهدية من القائمة');await adminTab('gifts');}catch(e){toast('تعذر حذف الهدية: '+e.message)}}
function selectGiftTile(i){if(!Array.isArray(window.activeGiftCatalog)||!window.activeGiftCatalog[i])return;window.selectedGiftIndex=i;document.querySelectorAll('.giftTile').forEach((el,j)=>el.classList.toggle('selected',j===i));}
async function addGiftToCatalog(){const icon=(document.getElementById('newGiftIcon')?.value||'').trim(),name=(document.getElementById('newGiftName')?.value||'').trim();if(!icon||!name)return toast('اكتب رمز الهدية واسمها');try{await api('/api/admin/gifts/catalog',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({icon,name})});toast('تمت إضافة الهدية');adminTab('gifts')}catch(e){toast(e.message)}}
async function sendSelectedGift(){const n=document.getElementById('giftTarget')?.value;if(!n)return toast('حدد العضو المستلم أولاً');const i=Number(window.selectedGiftIndex)||0;const g=window.activeGiftCatalog?.[i];if(!g)return toast('حدد هدية صحيحة');await sendGiftDirect(n,g[0]+' '+g[1],i<53?i:null)}
async function sendGiftDirect(n,gift,giftArtIndex=null){if(!confirm('إرسال '+gift+' إلى '+n+'؟'))return;try{await api('/api/admin/gift',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n,gift,giftArtIndex})});toast('تم إرسال الهدية فعلياً')}catch(e){toast(e.message)}}
async function deleteSelectedAvatar(){const n=document.getElementById('avatarTarget')?.value;if(!n)return toast('حدد العضو أولاً');await adminDeleteAvatar(n)}
function giftIconFromText(gift){const text=String(gift||'🎁');const found=(window.giftPickerCatalog||RIMAZ_GIFTS||[]).find(g=>text===String(g[0]+' '+g[1])||text.startsWith(String(g[0])));if(found)return found[0];const m=text.match(/^(\p{Extended_Pictographic}(?:\uFE0F|\u200D\p{Extended_Pictographic})*)/u);return m?m[1]:'🎁'}
function showGiftAnimation(gift,from='',giftArtIndex=null){const old=document.getElementById('rimazGiftCelebration');if(old)old.remove();const text=String(gift||'🎁');const ai=Number(giftArtIndex);const entry=giftEntryFromText(text)||(window.giftPickerCatalog||[]).find(g=>text===String(g[0]+' '+g[1]))||(!text&&Number.isInteger(ai)&&ai>=0&&ai<53?RIMAZ_GIFTS[ai]:null);const icon=entry?.[0]||giftIconFromText(gift);const art=entry?giftArtMarkup(entry,'100px'):esc(icon);const box=document.createElement('div');box.id='rimazGiftCelebration';box.className='rimaz-gift-celebration';box.innerHTML=`<div class="rimaz-gift-dim"></div><div class="rimaz-gift-burst" aria-hidden="true">${Array.from({length:16},(_,i)=>`<i style="--i:${i};--a:${i*22.5}deg">✦</i>`).join('')}</div><div class="rimaz-gift-card"><div class="rimaz-gift-ribbon">🎁</div><div class="rimaz-gift-icon">${art}</div><div class="rimaz-gift-title">${esc(entry?.[1]||String(gift||'هدية').replace(icon,'').trim()||'هدية')}</div><div class="rimaz-gift-from">${from?'من '+esc(from):'وصلتك هدية'}</div><div class="rimaz-gift-sparkles">✨ 💖 ✨</div><button type="button" onclick="document.getElementById('rimazGiftCelebration')?.remove()">حسناً</button></div>`;document.body.appendChild(box);box.addEventListener('click',e=>{if(e.target===box||e.target.classList.contains('rimaz-gift-dim'))box.remove()});window.setTimeout(()=>{if(box.isConnected)box.classList.add('is-settling')},2600);window.setTimeout(()=>box.remove(),3800)}
let giftPickerTarget='',giftPickerPreviousHtml='',giftPickerPreviousOverlay='';
async function sendGift(n){giftPickerTarget=n;giftPickerPreviousHtml=document.getElementById('layer')?.innerHTML||'';giftPickerPreviousOverlay=activeOverlay;let extra=[];try{const d=await api('/api/admin/data');extra=Array.isArray(d.giftCatalog)?d.giftCatalog:[];window.adminCachedUsers=[...(d.users||[]),...(d.guests||[])];}catch(e){return toast('تعذر تحميل الهدايا: '+e.message)}window.giftPickerCatalog=[...RIMAZ_GIFTS,...RIMAZ_EXTRA_GIFTS,...extra.map(g=>[g[0]||g.icon||'',g[1]||g.name||'هدية'])];window.giftPickerSelected=0;renderGiftPicker();}

async function adminRolePermissionEditor(){if(!me.owner&&!hasClientPermission('permission_manage'))return '<div class="adminCard"><h3>صلاحيات الرتب</h3><p>ما عندك صلاحية إدارة الصلاحيات.</p></div>';let d;try{d=await api('/api/admin/permissions')}catch(e){return '<div class="adminCard">تعذر تحميل الصلاحيات: '+esc(e.message)+'</div>'}window.rolePermissionData=d||{};d=d&&typeof d==='object'?d:{};const role=window.permissionRoleSelected||document.getElementById('permissionRole')?.value||'admin-full';const current=(d&&d.roles&&Array.isArray(d.roles[role])?d.roles[role]:null)||(d&&d.defaults&&Array.isArray(d.defaults[role])?d.defaults[role]:[]);const catalog=(d&&d.catalog&&typeof d.catalog==='object')?d.catalog:{};const groups=[['لوحة التحكم والأعضاء',['panel_access','users_view','member_ip']],['الإشراف داخل الغرفة وخارجها',['kick_room','ban_room','mute_room','global_kick','global_ban']],['الرتب والإدارة والصلاحيات',['role_assign','rank_assign','permission_manage']],['اللايكات والهدايا وVIP',['grant_likes','reset_likes','gifts','vip']],['الملف الشخصي',['profile_edit','avatar_delete']],['الغرف والرسائل والنقل',['rooms_manage','messages_delete','room_move']],['الإعلانات ورسائل الترحيب',['announcement_post','announcement_delete','welcome_manage']],['الحائط',['wall_stop','wall_restart','wall_clear','wall_delete_user']]];return `<div class="adminCard" id="permissionEditor"><h3>تخصيص صلاحيات كل رتبة</h3><p>كل إجراء له مربع مستقل، والتعديلات اليدوية تُحفظ لكل رتبة ولا تتغير عند إعادة فتح الشاشة. صاحب الموقع محمي من إجراءات الإدارة. الإداري الكامل يملك جميع الصلاحيات.</p><label>اختر الرتبة</label><select id="permissionRole" onchange="window.permissionRoleSelected=this.value;adminTab('rankpermissions')"><option value="admin-full" ${role==='admin-full'?'selected':''}>1 — 👑 ADMIN كامل الصلاحيات</option><option value="admin-shield" ${role==='admin-shield'?'selected':''}>2 — الإداري</option><option value="crown-gold" ${role==='crown-gold'?'selected':''}>3 — البنر الذهبي</option><optio async function adminWallControl(action){const labels={stop:'إيقاف الحائط مؤقتاً؟ لن يستطيع أحد نشر نصوص أو وسائط حتى تعيد تشغيله.',restart:'إعادة تشغيل الحائط والسماح بالنشر من جديد؟',clear:'حذف جميع منشورات الحائط نهائياً؟ هذا لا يحذف رسائل الدردشة أو حسابات الأعضاء.'};if(!confirm(labels[action]||'تأكيد الإجراء؟'))return;try{const r=await api('/api/admin/wall/control',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action})});toast(action==='stop'?'تم إيقاف الحائط':action==='restart'?'تمت إعادة تشغيل الحائط':'تم حذف الحائط بالكامل ('+(r.removed||0)+' منشور)');await adminTab('wall')}catch(e){toast(e.message)}}
async function adminDeleteWallUser(name){name=String(name||'').trim();if(!name)return toast('حدد العضو أولاً');if(!confirm('حذف جميع منشورات الحائط الخاصة بـ '+name+' فقط؟ لن تتأثر منشورات بقية الأعضاء.'))return;try{const r=await api('/api/admin/wall/control',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'delete-user',name})});toast('تم حذف '+r.removed+' منشور من الحائط للعضو '+name);if(activeOverlay==='wall')openWall()}catch(e){toast(e.message)}}
async function adminDeleteWallUserSelected(){const n=document.getElementById('wallDeleteTarget')?.value;if(!n)return toast('اختر العضو أولاً');return adminDeleteWallUser(n)}
async function grantLike(n,a){n=String(n||'').trim();if(!n)return toast('اكتب اسم الحساب');try{const j=await api('/api/admin/grant-like',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n,amount:Number(a)})});toast('تمت إضافة اللايكات: '+j.likes);adminTab('users')}catch(e){toast(e.message)}}
async function resetLikes(n){n=String(n||'').trim();if(!n)return toast('اكتب اسم الحساب');if(!confirm('متأكد تريد تصفير لايكات '+n+'؟'))return;try{await api('/api/admin/reset-likes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n})});toast('تم تصفير اللايكات');adminTab('users')}catch(e){toast(e.message)}}
function previewRoomImage(input){const file=input?.files?.[0],preview=document.getElementById('roomImagePreview'),label=document.getElementById('roomImageFileName');if(label)label.textContent=file?file.name:'ما مختار صورة بعد';if(!preview)return;if(!file){preview.style.display='none';preview.removeAttribute('src');return}if(!file.type.startsWith('image/')){toast('اختار ملف صورة فقط');input.value='';preview.style.display='none';return}preview.src=URL.createObjectURL(file);preview.style.display='block'}
async function createRoom(){const name=document.getElementById('rn')?.value,desc=document.getElementById('rd')?.value,capacity=document.getElementById('rc')?.value,kind=document.getElementById('rk')?.value,mics=document.getElementById('rmics')?.value,micLikesRequired=document.getElementById('rmlikes')?.value,file=document.getElementById('roomImageFile')?.files?.[0];try{const created=await api('/api/admin/room',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,desc,capacity,kind,mics,micLikesRequired})});if(file&&created.id){const fd=new FormData();fd.append('file',file);await api('/api/admin/room/'+encodeURIComponent(created.id)+'/image',{method:'POST',body:fd})}toast('تم إنشاء الغرفة'+(file?' وحفظ صورتها':'')+' بنجاح');adminTab('rooms')}catch(e){toast(e.message)}}
async function setRoomLock(id,name){const password=prompt('اكتب باسورد غرفة '+name+' (لا يمكن تفعيل القفل بدونه):');if(password===null)return;if(!password.trim()){toast('لازم تكتب الباسورد قبل تفعيل القفل');return;}try{await api('/api/admin/room/'+encodeURIComponent(id)+'/lock',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password})});toast('تم حفظ الباسورد وتفعيل قفل الغرفة');await adminTab('rooms')}catch(e){toast(e.message)}}
async function removeRoomLock(id,name){if(!confirm('حذف قفل غرفة '+name+' وفتحها للجميع؟'))return;try{await api('/api/admin/room/'+encodeURIComponent(id)+'/lock',{method:'DELETE'});toast('تم حذف القفل وفتح الغرفة');await adminTab('rooms')}catch(e){toast(e.message)}}
async function uploadRoomImage(id){const f=document.createElement('input');f.type='file';f.accept='image/*';f.onchange=async()=>{const file=f.files?.[0];if(!file)return;const fd=new FormData();fd.append('file',file);try{await api('/api/admin/room/'+encodeURIComponent(id)+'/image',{method:'POST',body:fd});toast('تم تحديث صورة الغرفة');adminTab('rooms')}catch(e){toast(e.message)}};f.click()}

async function siteGlobalMemberAction(action){const n=document.getElementById('globalModTarget')?.value;if(!n)return toast('حدد العضو أولاً');const ban=action==='global-ban';if(!confirm((ban?'حظر '+n+' من الدردشة بالكامل لمدة 5 دقائق؟':'طرد '+n+' من الدردشة بالكامل؟')))return;try{const r=await api('/api/admin/member-action',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n,action})});toast(ban?('تم الحظر لمدة 5 دقائق'+(Number.isFinite(r.ipCount)?' · عناوين IP المسجلة: '+r.ipCount:'')):'تم الطرد من الدردشة؛ يمكنه العودة مباشرة');adminTab('moderation')}catch(e){toast(e.message)}}
async function editRoom(id,oldName,oldDesc,oldCapacity){const name=prompt('اسم الغرفة',oldName);if(name===null)return;const desc=prompt('وصف الغرفة',oldDesc);if(desc===null)return;const capacity=prompt('سعة الغرفة',String(oldCapacity));if(capacity===null)return;try{await api('/api/admin/room/'+encodeURIComponent(id),{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,desc,capacity})});toast('تم حفظ تعديلات الغرفة');adminTab('rooms')}catch(e){toast(e.message)}}
async function deleteRoom(id){if(!confirm('تأكيد حذف الغرفة؟'))return;try{await api('/api/admin/room/'+encodeURIComponent(id),{method:'DELETE'});toast('تم حذف الغرفة');adminTab('rooms')}catch(e){toast(e.message)}}

async function deleteAnnouncement(id){if(!confirm('حذف الإعلان من السجل ومن رسائله المنشورة داخل الغرف؟'))return;try{const result=await api('/api/admin/announcement/'+encodeURIComponent(id),{method:'DELETE'});toast('تم حذف الإعلان ورسائله ('+(result.removedMessages||0)+')');adminTab('announcements')}catch(e){toast(e.message)}}

function callChoice(){if(!privateTo)return toast('اختر عضوًا أولًا');const layerEl=document.getElementById('layer');if(!layerEl)return;layerEl.insertAdjacentHTML('beforeend',`<div class="callChoice" id="callChoice"><div class="callChoiceBox"><h3>اختر نوع الاتصال</h3><button onclick="document.getElementById('callChoice')?.remove();startCall(false)">☎ اتصال صوتي</button><button onclick="document.getElementById('callChoice')?.remove();startCall(true)">📹 اتصال كام</button><button class="cancel" onclick="document.getElementById('callChoice')?.remove()">إلغاء</button></div></div>`)}
let pc=null,localStream=null,callMode='voice';
async function startCall(camera){if(me.likes<500&&!me.admin)return toast('الاتصال يفتح عند 500 إعجاب');callMode=camera?'camera':'voice';pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});localStream=await navigator.mediaDevices.getUserMedia(camera?{audio:true,video:true}:{audio:true});localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));showCall(camera);pc.onicecandidate=e=>e.candidate&&socket.emit('ice',{to:privateTo,candidate:e.candidate});pc.ontrack=e=>{const v=document.getElementById('remoteVideo');if(v)v.srcObject=e.streams[0]};const offer=await pc.createOffer();await pc.setLocalDescription(offer);socket.emit('call-offer',{to:privateTo,offer,video:camera})}
function showCall(camera){document.getElementById('layer').insertAdjacentHTML('beforeend',`<div class="call"><video id="remoteVideo" autoplay playsinline></video><div class="callBar"><button onclick="endCall()">إنهاء</button><button class="ok" onclick="toast('${camera?'كاميرا':'صوت'}')">${camera?'📹 اتصال كام':'☎ اتصال'}</button></div></div>`)}
async function handleOffer(d){if(key(d.from||d.to)!==key(privateTo))return;if(me.likes<500&&!me.admin)return;pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});pc.onicecandidate=e=>e.candidate&&socket.emit('ice',{to:d.from,candidate:e.candidate});pc.ontrack=e=>{const v=document.getElementById('remoteVideo');if(v)v.srcObject=e.streams[0]};localStream=await navigator.mediaDevices.getUserMedia(d.video?{audio:true,video:true}:{audio:true});localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));await pc.setRemoteDescription(d.offer);const ans=await pc.createAnswer();await pc.setLocalDescription(ans);socket.emit('call-answer',{to:d.from,answer:ans,video:d.video});showCall(!!d.video)}
async function handleAnswer(d){if(!pc)return;await pc.setRemoteDescription(d.answer)}
async function handleIce(d){try{await pc?.addIceCandidate(d.candidate)}catch{}}
function endCall(){localStream?.getTracks().forEach(t=>t.stop());pc?.close();pc=null;document.querySelector('.call')?.remove()}
window.addEventListener('beforeunload',()=>socket?.disconnect());
sid='';localStorage.removeItem('rimaz_sid');login();
