<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>دردشة ريماز عراقية</title>

<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Tahoma,Arial,sans-serif;background:#eee;color:#222}button,input,textarea,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}
:root{--black:#101010;--line:#d6d6d6;--paper:#faf8fa;--pink:#f9eeee;--red:#df5555;--green:#58bf61;--blue:#55b8df;--darkblue:#071323;--gold:#ffb800}
#app{height:100dvh;overflow:hidden;background:#f7f5f7}.login{height:100%;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#f6eff8,#fff 48%,#f8e9f1);padding:18px}.loginCard{width:min(430px,96vw);background:#fff;border-radius:24px;box-shadow:0 18px 50px #7b47751f;padding:24px;border:1px solid #eadce7}.brand{font-size:28px;font-weight:900;text-align:center;color:#7c3d72}.sub{color:#777;text-align:center;margin:7px 0 22px}.loginTabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:15px}.loginTabs button{border:0;border-radius:12px;padding:10px;background:#f0e5ee}.loginTabs button.active{background:#8b4c83;color:#fff}.loginForm{display:grid;gap:10px}.loginForm input{height:46px;border:1px solid #ddd;border-radius:11px;padding:0 12px;outline:none}.primary{height:46px;border:0;border-radius:11px;background:#8b4c83;color:#fff;font-weight:800}.guest{background:#eee1ea;color:#6b3c63}.hint{text-align:center;font-size:12px;color:#888;margin-top:10px}
.top{height:0;position:relative;z-index:5}
.roombar{height:45px;min-height:45px;background:#e9e9ee;border:2px solid #101010;display:grid;grid-template-columns:58px 1fr 48px 48px;align-items:center;direction:rtl;z-index:6}
.roombar .roomUser{display:flex;align-items:center;gap:5px;min-width:0;padding:2px 6px}
.roombar .roomAvatar{width:38px;height:38px;object-fit:cover;border:1px solid #222;background:#fff}
.roombar .roomName{font-size:17px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#10214a}
.roombar .roomStatus{font-size:11px;color:#777;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.roombar button{height:41px;border:1px solid #222;color:#fff;font-weight:900;font-size:18px}.roomExpand{background:#55b8df}.roomMin{background:#df5555}
.chat{height:100%;display:flex;flex-direction:column;position:relative;background:#fff}.messages{flex:1;overflow:auto;padding:2px 0 54px;background:#faf8fa}.msg{display:grid;grid-template-columns:76px 1fr 28px;min-height:58px;border-bottom:1px solid #eee;background:#fcfafd}.avatar{width:72px;height:72px;object-fit:cover;align-self:start;background:#fff;border-left:1px solid #ddd}.avatar.logo{object-fit:contain;padding:2px}.msgbody{padding:5px 6px 3px;min-width:0}.msghead{display:flex;align-items:center;gap:7px;font-size:18px;font-weight:900;line-height:1.05}.msgtext{font-size:17px;line-height:1.35;word-break:break-word}.time{font-size:12px;color:#888;text-align:center;padding-top:7px}.badge{display:inline-block;background:#111;color:#fff;font-size:11px;padding:1px 4px;border-radius:2px}.presence{background:#f9e8e8;border-bottom:1px solid #eee;padding:7px 8px;font-size:15px}.notice{background:#111;color:#fff;display:inline-block;padding:2px 5px;border-radius:2px}.composer{position:absolute;bottom:42px;right:0;left:0;height:50px;display:grid;grid-template-columns:44px 40px 1fr 70px;gap:3px;background:#fff;border-top:1px solid #bbb;padding:4px;z-index:4}.composer button{border:1px solid #ccc;background:#071323;color:#fff}.composer .emojiBtn{background:#fff;color:#222;font-size:23px}.composer input{border:1px solid #bbb;min-width:0;padding:0 8px;outline:none}.bottom{position:absolute;bottom:0;left:0;right:0;height:42px;background:#0b0b0b;display:grid;grid-template-columns:repeat(5,1fr);z-index:9;border-top:1px solid #333}.bottom button{border:0;background:#0c0c0c;color:#fff;border-left:1px solid #292929;font-weight:800;font-size:14px;white-space:nowrap}.bottom button.active,.bottom button:hover{background:#1c1c1c}.bottom .wallCount{color:#ffb800}
.overlay{position:absolute;z-index:20;top:0;right:0;width:75%;height:calc(100% - 42px);background:#fff;box-shadow:-5px 0 12px #0004;border-left:1px solid #555;display:flex;flex-direction:column}.overlayHead{height:52px;min-height:52px;background:#111;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 5px 0 10px;font-size:21px;font-weight:900}.close{width:46px;height:46px;border:0;border-radius:4px;background:#df5555;color:#fff;font-size:28px;font-weight:900}.overlayBody{overflow:auto;flex:1;background:#faf8fa}.empty{padding:25px;text-align:center;color:#999}.row{border-bottom:1px solid #ddd;background:#fbf9fb}.member{display:grid;grid-template-columns:70px 1fr 58px;min-height:73px;align-items:center}.member img{width:68px;height:68px;object-fit:cover}.memberMain{padding:4px 8px}.memberName{font-size:19px;font-weight:900}.memberSub{color:#888;font-size:14px}.memberLikes{font-size:11px;color:#777;text-align:center}.flag{font-size:20px}
.settings{padding:5px}.srow{display:grid;grid-template-columns:42% 58%;min-height:40px;border:1px solid #ddd;border-bottom:0}.srow:last-of-type{border-bottom:1px solid #ddd}.slabel{background:#111;color:#fff;padding:7px;text-align:center;font-weight:900}.svalue{background:#fff;padding:4px}.svalue input,.svalue select{width:100%;height:31px;border:1px solid #222}.save{height:48px;background:#58bf61;color:#fff;border:0;width:100%;font-weight:900;margin:5px 0}.danger{height:46px;background:#df5555;color:#fff;border:0;width:100%;margin:4px 0;font-weight:900}.plain{height:44px;background:#fff;color:#111;border:1px solid #222;width:100%;margin:4px 0;font-weight:800}.toggle.on{background:#58bf61;color:#fff}.avatarPreview{width:58px;height:58px;object-fit:cover;vertical-align:middle;margin-left:8px}
.roomTitle{padding:7px;background:#111;color:#fff;font-size:20px;font-weight:900}.newRoom{background:#58bf61;color:#fff;border:0;padding:8px 12px;margin:4px;font-weight:900}.room{display:grid;grid-template-columns:72px 1fr 82px;min-height:76px;border-bottom:1px solid #ddd;align-items:center;background:#faf8fa}.room img{width:66px;height:66px;object-fit:contain}.roomName{font-size:18px;font-weight:900}.roomDesc{font-size:13px;color:#888}.count{background:#111;color:#fff;padding:6px 4px;margin-left:3px;text-align:center;font-weight:900}.count.voice{background:#df5555}.wallPost{padding:7px 8px;border-bottom:1px solid #ddd;background:#fff}.wallText{font-size:18px;line-height:1.4}.wallMedia{max-width:100%;max-height:240px;display:block;margin:6px auto}.wallActions{display:flex;justify-content:flex-start;gap:2px;margin-top:4px}.wallActions button{background:#df5555;color:#fff;border:0;padding:4px 9px}.wallInput{padding:5px;border-bottom:1px solid #aaa}.wallInput textarea{width:100%;min-height:64px;border:1px solid #aaa;padding:6px}.wallTools{display:grid;grid-template-columns:45px 45px 1fr 65px;gap:3px;margin-top:4px}.wallTools button{border:1px solid #aaa;background:#071323;color:#fff}.wallTools .smile{background:#fff;color:#222;font-size:22px}
.privateHead{background:#111;color:#fff;height:45px;display:grid;grid-template-columns:40px 1fr 45px 45px;align-items:center}.privateHead button{height:44px;border:1px solid #444;background:#111;color:#fff}.privateHead .blue{background:#55b8df;color:#fff}.privateBody{flex:1;overflow:auto;background:#fff}.privateComposer{display:grid;grid-template-columns:42px 42px 48px 42px 1fr 62px;gap:3px;padding:4px;border-top:1px solid #aaa}.privateComposer button{height:44px;border:1px solid #aaa;background:#071323;color:#fff}.privateComposer .green{background:#58bf61}.privateComposer .smile{background:#fff;color:#222;font-size:22px}.pmsg{padding:7px;border-bottom:1px solid #eee}.pmsg.me{text-align:right;background:#fff9fb}.pmsg img,.pmsg video,.pmsg audio{max-width:100%;max-height:250px}.privateLocked{padding:20px;text-align:center;color:#888}
.profileOverlay{position:absolute;z-index:30;top:15px;right:8px;width:calc(75% - 16px);background:#fff;box-shadow:0 5px 30px #0008}.profileTop{height:45px;background:#111;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:4px}.profileTop img{height:37px;width:37px;object-fit:cover}.profilePhoto{width:100%;height:300px;object-fit:cover;background:#ddd}.profileInfo{text-align:center;padding:8px}.profileGrid{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid #ddd}.profileGrid button{min-height:52px;background:#fff;border:1px solid #eee;font-weight:900}.likeBig{color:#e22;font-size:18px}.ignore{color:#d22}
.admin .tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:4px;background:#ddd}.admin .tabs button{height:40px;background:#111;color:#fff;border:0}.admin .tabs button.active{background:#58bf61}.adminPanel{padding:5px}.adminCard{background:#fff;border:1px solid #ccc;margin-bottom:6px;padding:7px}.adminCard h3{margin:2px 0 7px}.adminGrid{display:grid;grid-template-columns:1fr 1fr;gap:5px}.adminGrid input,.adminGrid select{height:38px;border:1px solid #aaa;padding:4px}.adminGrid button{height:38px;border:0;background:#111;color:#fff}.adminUser{display:grid;grid-template-columns:1fr 80px 70px;align-items:center;border-top:1px solid #eee;padding:6px 0;gap:4px}.adminUser button{border:0;background:#111;color:#fff;padding:5px}.adminUser .red{background:#df5555}
.emojiModal{position:absolute;z-index:50;bottom:47px;right:4px;width:calc(100% - 8px);height:310px;background:#fff;border:2px solid #111;box-shadow:0 8px 30px #0005;display:flex;flex-direction:column}.emojiHead{background:#111;color:#fff;height:40px;display:flex;align-items:center;justify-content:space-between;padding:0 6px}.emojiGrid{overflow:auto;padding:6px;display:grid;grid-template-columns:repeat(9,1fr);gap:3px}.emojiGrid button{height:38px;background:#fff;border:1px solid #eee;font-size:23px}.modalShade{position:absolute;inset:0;background:#0006;z-index:120;display:flex;align-items:center;justify-content:center;padding:18px}.modalBox{width:min(360px,94%);background:#fff;border:2px solid #111;box-shadow:0 10px 35px #0008}.modalBox .modalTitle{background:#111;color:#fff;padding:10px;font-size:19px;font-weight:900}.modalBox .modalText{padding:20px 12px;text-align:center;font-size:18px;font-weight:800;line-height:1.5}.modalBox .modalOk{width:100%;height:44px;border:0;background:#55b8df;color:#fff;font-weight:900}
.toast{position:absolute;z-index:100;left:10px;right:10px;top:10px;background:#111;color:#fff;padding:11px;border-radius:4px;text-align:center;display:none}.call{position:absolute;z-index:60;inset:8px;background:#111;color:#fff;display:flex;flex-direction:column}.call video{width:100%;height:100%;object-fit:cover;background:#222}.callBar{position:absolute;bottom:10px;left:8px;right:8px;display:flex;justify-content:center;gap:7px}.callBar button{border:0;background:#df5555;color:#fff;padding:10px 18px}.callBar .ok{background:#58bf61}
@media(min-width:700px){.chat{max-width:590px;margin:auto;box-shadow:0 0 25px #0002}.overlay{right:calc((100% - 590px)/2);width:443px}.profileOverlay{right:calc((100% - 590px)/2 + 8px);width:427px}}
</style></head><body><div id="app"></div>
<script>
const app=document.getElementById('app');let sid=localStorage.getItem('rimaz_sid')||'',me=null,rooms=[],currentRoom='public',socket=null,activeOverlay=null,privateTo='',privateOpen=false,notifications=[],call=null;
const EMOJIS='😀 😃 😄 😁 😆 😅 😂 🤣 😊 😇 🙂 🙃 😉 😌 😍 🥰 😘 😗 😙 😚 😋 😛 😝 😜 🤪 🤨 🧐 🤓 😎 🤩 🥳 😏 😒 😞 😔 😟 😕 🙁 ☹️ 😣 😖 😫 😩 🥺 😢 😭 😤 😠 😡 🤬 🤯 😳 🥵 🥶 😱 😨 😰 😥 😓 🤗 🤔 🫡 🤭 🤫 🤥 😶 😐 😑 😬 🙄 😯 😦 😧 😮 😲 🥱 😴 🤤 😪 😵 🤐 🤑 🤠 😈 👿 👹 👺 🤡 💩 👻 💀 ☠️ 👽 👾 🤖 🎃 😺 😸 😹 😻 😼 😽 🙀 😿 😾 ❤️ 🧡 💛 💚 💙 💜 🖤 🤍 🤎 💔 ❤️‍🔥 💕 💞 💓 💗 💖 💘 💝 💟 💋 👍 👎 👌 ✌️ 🤞 🤟 🤘 🤙 👈 👉 👆 👇 ☝️ ✋ 🤚 🖐️ 🖖 👋 🤏 💪 🙏 👏 🙌 🫶 🤝 💅 👀 👁️ 🧠 🔥 ⭐ 🌟 ✨ 💫 💥 🎉 🎊 🌹 🌷 🌸 🌺 🌻 🦋 🕊️ ☀️ 🌙 ⚡ 💎 👑 🥀 🥰'.split(' ');
function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
async function api(url,opt={}){opt.headers={...(opt.headers||{}),'x-session':sid};let r=await fetch(url,opt);let j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'حدث خطأ');return j}
function toast(t){const x=document.getElementById('toast');if(!x)return;x.textContent=t;x.style.display='block';clearTimeout(x._t);x._t=setTimeout(()=>x.style.display='none',2600)}
function login(){app.innerHTML=`<div class="login"><div class="loginCard"><div class="brand">دردشة ريماز عراقية</div><div class="sub">نفس روح الدردشة العراقية، بشكل خفيف وسريع</div><div class="loginTabs"><button id="tabNew" class="active" onclick="loginMode('new')">تسجيل عضو</button><button id="tabIn" onclick="loginMode('in')">دخول عضو</button><button id="tabGuest" onclick="loginMode('guest')">زائر</button></div><div id="loginForm" class="loginForm"></div><div class="hint">لا نطلب إيميل أو رقم هاتف</div></div></div>`;loginMode('new')}
function loginMode(mode){['tabNew','tabIn','tabGuest'].forEach(id=>document.getElementById(id)?.classList.remove('active'));document.getElementById(mode==='new'?'tabNew':mode==='in'?'tabIn':'tabGuest')?.classList.add('active');const f=document.getElementById('loginForm');if(mode==='guest'){f.innerHTML=`<input id="ln" placeholder="اسم الزائر"><button class="primary guest" onclick="doGuest()">دخول زائر</button>`}else{f.innerHTML=`<input id="ln" placeholder="الاسم"><input id="lp" type="password" placeholder="الباسورد"><button class="primary" onclick="${mode==='new'?'doRegister()':'doLogin()'}">${mode==='new'?'تسجيل حساب جديد':'دخول عضو'}</button>`}}
async function doRegister(){try{const j=await api('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:ln.value,password:lp.value})});sid=j.sid;localStorage.setItem('rimaz_sid',sid);await boot()}catch(e){toast(e.message)}}
async function doLogin(){try{const j=await api('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:ln.value,password:lp.value})});sid=j.sid;localStorage.setItem('rimaz_sid',sid);await boot()}catch(e){toast(e.message)}}
async function doGuest(){try{const j=await api('/api/guest',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:ln.value})});sid=j.sid;localStorage.setItem('rimaz_sid',sid);await boot()}catch(e){toast(e.message)}}
async function boot(){try{const s=await api('/api/state');me=s.user;rooms=s.rooms;currentRoom='public';notifications=await api('/api/notifications');renderChat();connect();}catch(e){sid='';localStorage.removeItem('rimaz_sid');login()}}
function displayFor(x){return x?.displayName||x?.profile?.displayName||x?.name||''}
function avatarFor(p){return p?.avatar||'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect width="100" height="100" fill="#fff"/><circle cx="50" cy="40" r="22" fill="#e6d7e2"/><path d="M20 95c3-28 57-28 60 0" fill="#d9c3d5"/><text x="50" y="15" text-anchor="middle" font-size="12">ريماز</text></svg>`)}
function refreshRoomBar(){const a=document.querySelector('.roomAvatar'),n=document.querySelector('.roomName'),st=document.querySelector('.roomStatus');if(a)a.src=avatarFor(me.profile);if(n)n.textContent=displayFor(me);if(st)st.textContent=me.profile?.status||'متصل الآن'}
function renderChat(){app.innerHTML=`<div class="chat"><div class="roombar"><button class="roomExpand" onclick="openMembers()">👤</button><div class="roomUser"><img class="roomAvatar" src="${esc(avatarFor(me.profile))}"><div><div class="roomName">${esc(displayFor(me))}</div><div class="roomStatus">${esc(me.profile?.status||'متصل الآن')}</div></div></div><button class="roomExpand" onclick="openRooms()">↗</button><button class="roomMin" onclick="closeLayer()">−</button></div><div class="messages" id="msgs"></div><div class="composer"><button onclick="openProfile(me.name)">↪</button><button class="emojiBtn" onclick="emojiPicker('public')">🙂</button><input id="msgInput" placeholder="اكتب رسالتك هنا" onkeydown="if(event.key==='Enter')sendPublic()"><button onclick="sendPublic()">إرسال ➤</button></div><div class="bottom"><button onclick="openSettings()">⚙ الضبط</button><button onclick="openWall()">💬 الحائط <span id="wallCount" class="wallCount"></span></button><button onclick="openRooms()">♣ الغرف</button><button onclick="openPrivateList()">💬 خاص</button><button onclick="openMembers()">♟ <span id="onlineCount">0</span></button></div><div id="layer"></div><div id="toast" class="toast"></div></div>`;document.getElementById('msgs').innerHTML='';}
function connect(){if(socket)socket.disconnect();socket=io();socket.on('connect',()=>joinRoom(currentRoom));socket.on('history',a=>{if(currentRoom==='public'){document.getElementById('msgs').innerHTML='';a.forEach(addMessage)}});socket.on('message',m=>{if(m.room===currentRoom)addMessage(m)});socket.on('presence',d=>addPresence(d));socket.on('live-state',s=>{rooms=s.rooms||rooms;document.getElementById('onlineCount').textContent=(s.online||[]).length;});socket.on('likes-changed',d=>{if(me?.name===d.name){me.likes=d.likes;me.level=d.level;updateMeBadges()}});socket.on('error-msg',d=>showBlockModal(d.error,'تنبيه'));socket.on('admin-notice',d=>toast('📢 '+d.text));socket.on('notification',d=>toast('✉ '+d.from+': '+d.text));socket.on('private-message',m=>{if(privateOpen&&key(privateTo)===key(m.from)||privateOpen&&key(privateTo)===key(m.to))addPrivate(m)});socket.on('private-media',m=>{if(privateOpen&&(key(privateTo)===key(m.from)||key(privateTo)===key(m.to)))addPrivateMedia(m)});socket.on('wall-new',()=>{if(activeOverlay==='wall')openWall()});socket.on('kicked',d=>{if(currentRoom===d.room){currentRoom='public';joinRoom('public');toast('تم إخراجك من الغرفة')}});socket.on('call-offer',handleOffer);socket.on('call-answer',handleAnswer);socket.on('ice',handleIce);}
function key(x){return String(x||'').trim().toLowerCase()}
function joinRoom(room){currentRoom=room;socket?.emit('join',{sid,room});api('/api/history?room='+encodeURIComponent(room)).then(a=>{if(room==='public'){document.getElementById('msgs').innerHTML='';a.forEach(addMessage)}}).catch(()=>{});}
function addPresence(d){if(currentRoom!==d.room)return;const box=document.getElementById('msgs');if(!box)return;box.insertAdjacentHTML('beforeend',`<div class="presence"><span class="notice">${d.action==='join'?'دخل':'خرج'}</span> ${esc(d.displayName||d.name)} إلى ${esc((rooms.find(r=>r.id===d.room)||{}).name||'الغرفة')}</div>`);box.scrollTop=box.scrollHeight}
function addMessage(m){const box=document.getElementById('msgs');if(!box)return;const p=m.profile||{};let content=esc(m.text||'');if(m.media){content=m.media.mime.startsWith('image/')?`<img src="${esc(m.media.url)}" class="wallMedia">`:m.media.mime.startsWith('video/')?`<video src="${esc(m.media.url)}" class="wallMedia" controls></video>`:`<audio src="${esc(m.media.url)}" controls></audio>`}box.insertAdjacentHTML('beforeend',`<div class="msg"><img class="avatar" src="${esc(avatarFor(p))}"><div class="msgbody"><div class="msghead" style="color:${esc(p.nameColor||'#222')}"><span onclick="openProfile('${esc(m.from)}')">${esc(m.displayName||m.profile?.displayName||m.from)}</span> ${m.likes>=500?'<span class="badge">500+</span>':''}</div><div class="msgtext" style="background:${esc(p.bgColor||'#fff')}">${content}</div></div><div class="time">${new Date(m.at).toLocaleTimeString('ar-IQ',{hour:'2-digit',minute:'2-digit'})}</div></div>`);box.scrollTop=box.scrollHeight}
function sendPublic(){const text=document.getElementById('msgInput')?.value.trim();if(!text)return;socket.emit('send-message',{room:currentRoom,text});document.getElementById('msgInput').value=''}
function layer(html,name){activeOverlay=name;document.getElementById('layer').innerHTML=html}
function closeLayer(){activeOverlay=null;document.getElementById('layer').innerHTML=''}
function head(t){return `<div class="overlayHead"><span>${t}</span><button class="close" onclick="closeLayer()">×</button></div>`}
async function openMembers(){const s=await api('/api/state');const a=s.online||[];layer(`<div class="overlay">${head('المتواجدين')}<div class="overlayBody"><div style="padding:5px"><input id="memberSearch" style="width:100%;height:38px;border:1px solid #aaa;padding:5px" placeholder="... البحث" oninput="filterMembers()"></div><div id="memberList">${memberRows(a)}</div></div></div>`,'members')}
function memberRows(a){return a.map(x=>`<div class="member row" data-name="${esc(displayFor(x))}"><img src="${esc(avatarFor(x.profile))}"><div class="memberMain"><div class="memberName" onclick="openProfile('${esc(x.name)}')">${esc(displayFor(x))} ${x.name.toLowerCase()==='admin'?'👑':''}</div><div class="memberSub">${esc(x.profile?.status||'متصل الآن')} · مستوى ${x.level}</div></div><div class="memberLikes">${x.likes} ♥<br><span class="flag">${x.type==='guest'?'👤':'🇮🇶'}</span></div></div>`).join('')||'<div class="empty">لا يوجد متواجدون</div>'}
function filterMembers(){const q=key(memberSearch.value);document.querySelectorAll('#memberList .member').forEach(x=>x.style.display=key(x.dataset.name).includes(q)?'grid':'none')}
async function openRooms(){const s=await api('/api/state');rooms=s.rooms;layer(`<div class="overlay">${head('غرف الدردشة: '+rooms.reduce((n,r)=>n+(r.online||0),0))}<div class="overlayBody"><button class="newRoom" onclick="toast('إنشاء الغرف من لوحة الادارة فقط')">+ غرفة جديدة</button>${rooms.map(r=>`<div class="room" onclick="closeLayer();joinRoom('${esc(r.id)}')"><img src="${esc(avatarFor({}))}"><div><div class="roomName">${esc(r.name)}</div><div class="roomDesc">${esc(r.desc||'غرفة عامة ..')}</div></div><div class="count ${r.kind==='voice'?'voice':''}">${r.kind==='voice'?'🎙️':'♟'}${r.online||0}/${r.capacity}</div></div>`).join('')}</div></div>`,'rooms')}
async function openWall(){const w=await api('/api/wall');layer(`<div class="overlay">${head('الحائط')}<div class="overlayBody"><div class="wallInput"><textarea id="wallText" placeholder="اكتب منشورك..."></textarea><div class="wallTools"><button onclick="emojiPicker('wall')">🙂</button><button onclick="wallMedia('image')">🖼️</button><button onclick="wallMedia('video')">🎬</button><button onclick="postWall()">إرسال ➤</button></div></div><div id="wallPosts">${w.map(wallCard).join('')}</div></div></div>`,'wall')}
function wallCard(p){let m='';if(p.media)m=p.media.mime.startsWith('image/')?`<img src="${esc(p.media.url)}" class="wallMedia">`:`<video src="${esc(p.media.url)}" class="wallMedia" controls></video>`;return `<div class="wallPost"><div class="wallText"><b>${esc(p.from)}</b><div>${esc(p.text||'')}</div>${m}</div><div class="wallActions"><button onclick="wallLike('${p.id}')">♥${p.likes||''}</button><button onclick="toast('التعليقات متاحة داخل المنشور')">💬</button></div></div>`}
async function postWall(){const text=document.getElementById('wallText')?.value.trim();if(!text)return toast('اكتب شيئاً أولاً');try{await api('/api/wall',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});toast('تم النشر');openWall()}catch(e){toast(e.message)}}
async function wallMedia(kind){const f=document.createElement('input');f.type='file';f.accept=kind==='image'?'image/*':'video/*';f.onchange=async()=>{const fd=new FormData();fd.append('file',f.files[0]);fd.append('scope','wall');try{await api('/api/media',{method:'POST',body:fd});openWall()}catch(e){toast(e.message)}};f.click()}
async function wallLike(id){try{const j=await api('/api/wall/like',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id})});toast('♥ '+j.likes);openWall()}catch(e){toast(e.message)}}
function openPrivateList(){api('/api/state').then(s=>{const a=(s.online||[]).filter(x=>key(x.name)!==key(me.name));layer(`<div class="overlay">${head('المحادثات الخاصة')}<div class="overlayBody">${a.map(x=>`<div class="member row" onclick="openPrivate('${esc(x.name)}')"><img src="${esc(avatarFor(x.profile))}"><div class="memberMain"><div class="memberName">${esc(displayFor(x))}</div><div class="memberSub">${x.likes} إعجاب · مستوى ${x.level}</div></div><div>💬</div></div>`).join('')||'<div class="empty">لا توجد محادثات خاصة متاحة الآن</div>'}</div></div>`,'privateList')})}
function showBlockModal(text,title='تنبيه'){const l=document.getElementById('layer');if(!l)return;l.insertAdjacentHTML('beforeend',`<div class="modalShade" id="blockModal"><div class="modalBox"><div class="modalTitle">${esc(title)}</div><div class="modalText">${esc(text)}</div><button class="modalOk" onclick="document.getElementById('blockModal')?.remove()">حسناً</button></div></div>`)}
async function openPrivate(name){const s=await api('/api/state');const u=(s.online||[]).find(x=>key(x.name)===key(name));if(u?.profile?.privateOpen===false){showBlockModal(`لقد أغلق ${displayFor(u)} المحادثة الخاصة`);return}privateTo=name;privateOpen=true;const dn=displayFor(u)||name;layer(`<div class="overlay" style="width:100%;height:calc(100% - 42px)"><div class="privateHead"><button onclick="openPrivateList()">♟</button><div style="padding:0 7px;font-weight:900">${esc(dn)}<small style="display:block;font-size:10px;color:#bbb">${esc(u?.profile?.status||'متصل الآن')} · ${u?.likes||0} ♥ · مستوى ${u?.level||1}</small></div><button class="blue" onclick="maximizePrivate()">↗</button><button onclick="closeLayer();privateOpen=false">−</button></div><div id="privateBody" class="privateBody"></div><div class="privateComposer"><button class="green" onclick="startCall(false)">☎</button><button class="green" onclick="startCall(true)">📹</button><button onclick="sharePrivate()">↗</button><button class="smile" onclick="emojiPicker('private')">🙂</button><input id="privateText" placeholder="اكتب رسالتك هنا" onkeydown="if(event.key==='Enter')sendPrivate()"><button onclick="sendPrivate()">إرسال ➤</button></div></div>`,'private')}
function maximizePrivate(){document.querySelector('#layer .overlay').style.width='100%'}
function sendPrivate(){const text=document.getElementById('privateText')?.value.trim();if(!text)return;socket.emit('private-message',{to:privateTo,text});document.getElementById('privateText').value=''}
function addPrivate(m){const b=document.getElementById('privateBody');if(!b)return;b.insertAdjacentHTML('beforeend',`<div class="pmsg ${key(m.from)===key(me.name)?'me':''}"><b>${esc(m.from)}</b><div>${esc(m.text||'')}</div></div>`);b.scrollTop=b.scrollHeight}
function addPrivateMedia(m){const b=document.getElementById('privateBody');if(!b)return;const med=m.media.mime.startsWith('image/')?`<img src="${esc(m.media.url)}">`:m.media.mime.startsWith('video/')?`<video src="${esc(m.media.url)}" controls></video>`:`<audio src="${esc(m.media.url)}" controls></audio>`;b.insertAdjacentHTML('beforeend',`<div class="pmsg"><b>${esc(m.from)}</b><div>${med}</div></div>`);b.scrollTop=b.scrollHeight}
function sharePrivate(){if(me.likes<500&&!me.admin)return toast('الإرسال والوسائط تفتح عند 500 إعجاب');const f=document.createElement('input');f.type='file';f.accept='image/*,video/*,audio/*';f.onchange=async()=>{const fd=new FormData();fd.append('file',f.files[0]);fd.append('to',privateTo);fd.append('scope','private');try{const j=await api('/api/media',{method:'POST',body:fd});addPrivateMedia(j)}catch(e){toast(e.message)}};f.click()}
async function openProfile(name){const s=await api('/api/state');const x=(s.online||[]).find(u=>key(u.name)===key(name))||{name,likes:0,level:1,profile:{}};layer(`<div class="profileOverlay"><div class="profileTop"><img src="${esc(avatarFor(x.profile))}"><b>${esc(displayFor(x))}</b><button class="close" style="width:40px;height:38px;font-size:22px" onclick="closeLayer()">×</button></div><img class="profilePhoto" src="${esc(avatarFor(x.profile))}"><div class="profileInfo"><div style="font-weight:900">${esc(x.profile?.status||'متصل الآن')}</div><div>${esc(x.profile?.bio||'عضو في دردشة ريماز عراقية')}</div><div class="badge">مستوى ${x.level} · ${x.likes||0} ♥</div></div><div class="profileGrid"><button onclick="sendLike('${esc(x.name)}')" class="likeBig">♥${x.likes}</button><button onclick="tryPrivate('${esc(x.name)}')">✉ محادثة خاصة</button><button onclick="notifyUser('${esc(x.name)}')">✉ تنبيه</button><button onclick="ignoreUser('${esc(x.name)}')" class="ignore">⛔ تجاهل</button></div></div>`,'profile')}
async function sendLike(n){try{const j=await api('/api/like',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({to:n})});toast('تم الإعجاب ♥ '+j.likes);openProfile(n)}catch(e){toast(e.message)}}
function tryPrivate(n){openPrivate(n)}
async function notifyUser(n){try{await api('/api/notify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({to:n,text:'تنبيه من '+displayFor(me)})});toast('تم إرسال التنبيه')}catch(e){showBlockModal(e.message,'التنبيه')}}
function ignoreUser(n){toast('تم تجاهل '+n)}
function openSettings(){const p=me.profile||{};layer(`<div class="overlay">${head('الإعدادات')}<div class="overlayBody settings"><div class="srow"><div class="slabel">الزخرفة</div><div class="svalue"><input id="decor" value="${esc(p.displayName||me.name)}" placeholder="الاسم الظاهر"></div></div><div class="srow"><div class="slabel">الحالة</div><div class="svalue"><input id="status" value="${esc(p.status||'متصل الآن')}" placeholder="متصل الآن"></div></div><div class="srow"><div class="slabel">لون الإسم</div><div class="svalue"><input id="nameColor" type="color" value="${esc(p.nameColor||'#222222')}"></div></div><div class="srow"><div class="slabel">لون الخط</div><div class="svalue"><input id="fontColor" type="color" value="${esc(p.fontColor||p.nameColor||'#222222')}"></div></div><div class="srow"><div class="slabel">لون الخلفية</div><div class="svalue"><input id="bgColor" type="color" value="${esc(p.bgColor||'#ffffff')}"></div></div><button class="save" onclick="saveSettings()">🖉 حفظ</button><button class="plain">حجم الخط - 100%</button><button class="plain">السيرفر الصوتي: الأساسي</button><button class="plain">جودة المايك: الاساسية</button><button class="plain" onclick="changeAvatar()">${me.likes>=10||me.admin?'🖼 تغيير الصورة':'🔒 تغيير الصورة — تحتاج 10 إعجابات'}</button><button class="danger" onclick="deleteAvatar()">✖ حذف الصورة</button><button class="plain toggle ${p.privateOpen!==false?'on':''}" onclick="toggleSetting('privateOpen')">💬 المحادثات الخاصة: ${p.privateOpen!==false?'مفتوحة':'مغلقة'}</button><button class="plain toggle ${p.notificationsOpen!==false?'on':''}" onclick="toggleSetting('notificationsOpen')">✉ التنبيهات: ${p.notificationsOpen!==false?'مفتوحة':'مغلقة'}</button>${me.admin?`<button class="plain" onclick="openAdmin()">👑 لوحة الإدارة</button>`:''}<button class="danger" onclick="logout()">↪ تسجيل خروج</button></div></div>`,'settings')}
async function saveSettings(){try{const j=await api('/api/profile',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({displayName:decor.value,status:status.value,nameColor:nameColor.value,fontColor:fontColor.value,bgColor:bgColor.value})});me.profile=j.profile;me.displayName=j.profile.displayName;toast('تم الحفظ');closeLayer();refreshRoomBar()}catch(e){toast(e.message)}}
async function toggleSetting(k){const p=me.profile||{};p[k]=p[k]===false;try{const j=await api('/api/profile',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({[k]:p[k]})});me.profile=j.profile;openSettings()}catch(e){toast(e.message)}}
function changeAvatar(){if(me.likes<10&&!me.admin)return toast('الصورة تفتح بعد 10 إعجابات');const f=document.createElement('input');f.type='file';f.accept='image/*';f.onchange=async()=>{const fd=new FormData();fd.append('file',f.files[0]);try{const j=await api('/api/profile/avatar',{method:'POST',body:fd});me.profile.avatar=j.avatar;openSettings()}catch(e){toast(e.message)}};f.click()}
async function deleteAvatar(){toast('تم حذف الصورة المحلية');me.profile.avatar='';openSettings()}
async function logout(){try{await api('/api/logout',{method:'POST'})}catch{}localStorage.removeItem('rimaz_sid');sid='';socket?.disconnect();login()}
function emojiPicker(target){document.querySelector('.emojiModal')?.remove();const box=document.createElement('div');box.className='emojiModal';box.innerHTML=`<div class="emojiHead"><b>الإيموجي</b><button onclick="this.parentNode.parentNode.remove()">×</button></div><div class="emojiGrid">${EMOJIS.map(e=>`<button onclick="pickEmoji(${JSON.stringify(e)},'${target}')">${e}</button>`).join('')}</div>`;document.querySelector('.chat').appendChild(box)}
function pickEmoji(e,target){if(target==='public'){const i=document.getElementById('msgInput');i.value+=e;i.focus()}else if(target==='private'){const i=document.getElementById('privateText');if(i){i.value+=e;i.focus()}}else{const i=document.getElementById('wallText');if(i){i.value+=e;i.focus()}}document.querySelector('.emojiModal')?.remove()}
function updateMeBadges(){document.getElementById('onlineCount')?.setAttribute('title',`إعجاباتك: ${me.likes}`)}
function notifyCount(){return notifications.length?` (${notifications.length})`:''}
function jsq(s){return JSON.stringify(String(s)).replace(/</g,'\\u003c')}function adminUserRows(a){return a.map(u=>`<div class="adminUser"><div><b>${esc(u.name)}</b><br><small>${u.likes} إعجاب · مستوى ${u.level}</small></div><button onclick="grantLike(${jsq(u.name)},10)">+10</button><button class="red" onclick="resetLikes(${jsq(u.name)})">تصفير</button></div>`).join('')}
async function openAdmin(){try{const d=await api('/api/admin/data');layer(`<div class="overlay admin">${head('لوحة الإدارة — المالك')}<div class="tabs"><button class="active" onclick="adminTab('users')">الأعضاء</button><button onclick="adminTab('rooms')">الغرف</button><button onclick="adminTab('tools')">التحكم</button></div><div id="adminBody" class="overlayBody adminPanel">${adminUsers(d.users)}</div></div>`,'admin')}catch(e){toast(e.message)}}
function adminUsers(a){return `<div class="adminCard"><h3>إدارة الإعجابات</h3><div class="adminGrid"><input id="grantName" placeholder="اسم العضو"><input id="grantAmount" type="number" value="1"><button onclick="grantLike(grantName.value,grantAmount.value)">منح إعجاب</button><button onclick="resetLikes(grantName.value)">تصفير</button></div></div><div class="adminCard"><h3>الأعضاء</h3>${adminUserRows(a)}</div>`}
async function adminTab(t){const d=await api('/api/admin/data');const b=document.getElementById('adminBody');if(t==='users')b.innerHTML=adminUsers(d.users);else if(t==='rooms')b.innerHTML=`<div class="adminCard"><h3>إنشاء غرفة</h3><div class="adminGrid"><input id="rn" placeholder="اسم الغرفة"><input id="rc" type="number" value="50"><select id="rk"><option value="public">عامة</option><option value="private">خاصة</option><option value="voice">مايك</option></select><button onclick="createRoom()">إنشاء</button></div></div>${d.rooms.map(r=>`<div class="adminUser"><div><b>${esc(r.name)}</b><br><small>${r.online||0}/${r.capacity}</small></div><button onclick="toast('الغرف الأساسية محمية')">تحكم</button><button class="red" onclick="deleteRoom('${r.id}')">حذف</button></div>`).join('')}`;else b.innerHTML=`<div class="adminCard"><h3>إعلان عام</h3><textarea id="broadcastText" style="width:100%;min-height:80px"></textarea><button class="plain" onclick="broadcast()">إرسال للجميع</button></div><div class="adminCard"><h3>تحكم بالعضو</h3><div class="adminGrid"><input id="modName" placeholder="اسم العضو"><input id="modRoom" value="public"><button onclick="modAction('mute')">كتم</button><button onclick="modAction('ban')">حظر</button><button onclick="modAction('unban')">رفع الحظر</button><button onclick="modAction('kick')">طرد</button></div></div><div class="adminCard"><h3>صلاحيات المالك</h3><p>الادمن <b>admin</b> هو مالك الموقع وصلاحياته كاملة ولا تعتمد على عدد الإعجابات.</p><p>400 إعجاب = التنبيهات. 500 = صورة وفيديو وصوت + اتصال صوتي + اتصال كام.</p></div>`}
async function grantLike(n,a){try{const j=await api('/api/admin/grant-like',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n,amount:Number(a)})});toast('تمت إضافة الإعجابات: '+j.likes);openAdmin()}catch(e){toast(e.message)}}
async function resetLikes(n){try{await api('/api/admin/reset-likes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n})});toast('تم التصفير');openAdmin()}catch(e){toast(e.message)}}
async function createRoom(){try{await api('/api/admin/room',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:rn.value,capacity:rc.value,kind:rk.value})});toast('تم إنشاء الغرفة');adminTab('rooms')}catch(e){toast(e.message)}}
async function deleteRoom(id){try{await api('/api/admin/room/'+id,{method:'DELETE'});adminTab('rooms')}catch(e){toast(e.message)}}
async function modAction(action){try{await api('/api/admin/'+action,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:modName.value,room:modRoom.value})});toast('تم تنفيذ الأمر');}catch(e){toast(e.message)}}
async function broadcast(){try{await api('/api/admin/broadcast',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:broadcastText.value})});toast('تم الإرسال')}catch(e){toast(e.message)}}
let pc=null,localStream=null,callMode='voice';
async function startCall(camera){if(me.likes<500&&!me.admin)return toast('الاتصال يفتح عند 500 إعجاب');callMode=camera?'camera':'voice';pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});localStream=await navigator.mediaDevices.getUserMedia(camera?{audio:true,video:true}:{audio:true});localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));showCall(camera);pc.onicecandidate=e=>e.candidate&&socket.emit('ice',{to:privateTo,candidate:e.candidate});pc.ontrack=e=>{const v=document.getElementById('remoteVideo');if(v)v.srcObject=e.streams[0]};const offer=await pc.createOffer();await pc.setLocalDescription(offer);socket.emit('call-offer',{to:privateTo,offer,video:camera})}
function showCall(camera){document.getElementById('layer').insertAdjacentHTML('beforeend',`<div class="call"><video id="remoteVideo" autoplay playsinline></video><div class="callBar"><button onclick="endCall()">إنهاء</button><button class="ok" onclick="toast('${camera?'كاميرا':'صوت'}')">${camera?'📹 اتصال كام':'☎ اتصال'}</button></div></div>`)}
async function handleOffer(d){if(key(d.from||d.to)!==key(privateTo))return;if(me.likes<500&&!me.admin)return;pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});pc.onicecandidate=e=>e.candidate&&socket.emit('ice',{to:d.from,candidate:e.candidate});pc.ontrack=e=>{const v=document.getElementById('remoteVideo');if(v)v.srcObject=e.streams[0]};localStream=await navigator.mediaDevices.getUserMedia(d.video?{audio:true,video:true}:{audio:true});localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));await pc.setRemoteDescription(d.offer);const ans=await pc.createAnswer();await pc.setLocalDescription(ans);socket.emit('call-answer',{to:d.from,answer:ans,video:d.video});showCall(!!d.video)}
async function handleAnswer(d){if(!pc)return;await pc.setRemoteDescription(d.answer)}
async function handleIce(d){try{await pc?.addIceCandidate(d.candidate)}catch{}}
function endCall(){localStream?.getTracks().forEach(t=>t.stop());pc?.close();pc=null;document.querySelector('.call')?.remove()}
window.addEventListener('beforeunload',()=>socket?.disconnect());
if(sid)boot();else login();
</script></body></html>
