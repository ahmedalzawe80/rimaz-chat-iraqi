async function roomInfo(){
 try{const st=await api(`/api/room/status?room=${encodeURIComponent(currentRoom)}`);
 const r=st.room;
 openModal(`<div class="boxhead">معلومات الغرفة<button class="close" onclick="closeM()">×</button></div><div class="boxbody"><p><b>الغرفة:</b> ${esc(r.name)}</p><p><b>النوع:</b> ${r.kind==="voice"?"مايك وصوت":r.kind==="private"?"خاصة":"نص فقط"}</p><p><b>السعة:</b> ${r.capacity}</p><p><b>عدد المايكات:</b> ${r.mics||0}</p><p><b>المتصلون الآن:</b> ${st.people.length}</p><div class="notice">${r.kind==="voice"?"🎙️ هذه الغرفة مخصصة للصوت والمايك فقط. الغرفة العامة لا تحتوي على مايك.":r.name==="الغرفة العامة"?"✍️ الغرفة العامة للكتابة النصية فقط.":"🔒 غرفة منفصلة عن العامة."}</div>${st.canManage?`<button class="black" style="width:100%;margin-top:7px" onclick="roomAdmin()">👑 إدارة الغرفة</button>`:""}</div>`);
 }catch(e){alert(e.message)}
}
async function createRoomPrompt(){
 if(!me.admin)return alert("الإدارة فقط");
 const name=prompt("اسم الغرفة:"); if(!name)return;
 const kind=prompt("النوع: public / private / voice","public"); if(!kind)return;
 const desc=prompt("وصف الغرفة:",kind==="voice"?"مايك":"نص فقط")||"نص فقط";
 const capacity=prompt("السعة:","50")||50; const mics=kind==="voice"?(prompt("عدد المايكات:","4")||4):0;
 try{await api("/api/rooms/create",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name,kind,desc,capacity,mics})});await syncRooms();alert("تم إنشاء الغرفة");show("rooms")}catch(e){alert(e.message)}
}
async function roomAdmin(){
 if(!me.admin)return alert("الإدارة فقط");
 try{
  const st=await api(`/api/room/status?room=${encodeURIComponent(currentRoom)}`),r=st.room;
  const rows=st.people.map(x=>{
   const rn=JSON.stringify(r.name),xn=JSON.stringify(x.name);
   return `<div class="moderation-row"><div><b>${esc(x.name)}</b> <span class="room-badge">❤️ ${x.likes}</span><br><small>${x.muted?"🔇 مكتوم":"🟢 متاح"}</small></div><div class="moderation-actions"><button class="black" onclick='moderate(${rn},${xn},${x.muted?"unmute":"mute"})'>${x.muted?"🔊 فك الكتم":"🔇 كتم"}</button><button class="black" onclick='moderate(${rn},${xn},"kick")'>🚪 طرد</button><button class="red" onclick='moderate(${rn},${xn},"ban")'>⛔ حظر</button></div></div>`;
  }).join("");
  const bans=st.banned.map(n=>`<div class="member-row"><div class="member-meta"><b>${esc(n)}</b><small>محظور في ${esc(r.name)}</small></div><button class="black" onclick='moderate(${JSON.stringify(r.name)},${JSON.stringify(n)},"unban")'>رفع الحظر</button></div>`).join("");
  const micInput=r.kind==="voice"?`<label>عدد المايكات</label><input id="raMics" type="number" value="${r.mics||4}">`:"";
  const del=r.name!=="الغرفة العامة"&&r.name!=="غرفة الصوت"?`<button class="red" style="width:100%;margin-top:10px" onclick='deleteRoom(${JSON.stringify(r.name)})'>حذف الغرفة</button>`:"";
  openModal(`<div class="boxhead">إدارة ${esc(r.name)}<button class="close" onclick="closeM()">×</button></div><div class="boxbody"><div class="notice">الكتم والطرد والحظر تعمل على هذه الغرفة فقط.</div><div class="room-admin"><b>إعدادات الغرفة</b><div class="settings-grid"><div><label>الوصف</label><input id="raDesc" value="${esc(r.desc)}"></div><div><label>السعة</label><input id="raCap" type="number" value="${r.capacity}"></div></div>${micInput}<button class="black" style="width:100%" onclick="saveRoomSettings()">حفظ إعدادات الغرفة</button></div><div class="title" style="margin-top:10px">الأعضاء داخل الغرفة</div><div class="moderation-list">${rows||`<div class="muted" style="padding:12px;text-align:center">لا يوجد أعضاء حاليًا.</div>`}</div><div class="title" style="margin-top:10px">المحظورون</div><div>${bans||`<div class="muted">لا توجد أسماء محظورة.</div>`}</div>${del}</div>`);
 }catch(e){alert(e.message)}
}
async function saveRoomSettings(){try{await api("/api/rooms/update",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:currentRoom,desc:raDesc.value,capacity:raCap.value,mics:window.raMics?.value||4})});alert("تم حفظ إعدادات الغرفة");roomAdmin()}catch(e){alert(e.message)}}
async function moderate(room,to,action){const mins=prompt(action==="ban"?"مدة الحظر بالدقائق:":action==="kick"?"مدة الطرد بالدقائق:":"مدة الكتم بالدقائق:",action==="ban"?60:10);if(!mins)return;try{await api("/api/room/moderate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({room,to,action,minutes:mins})});alert("تم تنفيذ الإجراء");roomAdmin()}catch(e){alert(e.message)}}
async function deleteRoom(name){if(!confirm("حذف الغرفة "+name+"؟"))return;try{await api("/api/rooms/delete",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name})});currentRoom="الغرفة العامة";closeM();show("rooms")}catch(e){alert(e.message)}}

function connect(){if(socket)socket.disconnect();socket=io();socket.emit("join",{sid,room:currentRoom});socket.on("history",a=>{a.forEach(add);requestAnimationFrame(()=>{if(msgs)msgs.scrollTop=msgs.scrollHeight})});socket.on("message",add);socket.on("private",d=>{if(d.to===me.name&&d.from===privateToName)pmsgs.insertAdjacentHTML("beforeend",`<div class="msg"><div class="ava">👤</div><div><div class="bubble"><div class="name">${esc(d.from)}</div>${esc(d.text)}</div></div></div>`)});socket.on("call-offer",async d=>{if(Number(me.likes||0)<500)return; if(!confirm(`مكالمة ${d.from} — قبول؟`))return; try{rtcTarget=d.from;rtcKind=d.video?"video":"audio";rtc=new RTCPeerConnection({iceServers:[{urls:"stun:stun.l.google.com:19302"}]});const stream=await navigator.mediaDevices.getUserMedia({audio:true,video:rtcKind==="video"});stream.getTracks().forEach(t=>rtc.addTrack(t,stream));rtc.onicecandidate=e=>{if(e.candidate)socket.emit("ice",{to:d.from,candidate:e.candidate})};rtc.ontrack=e=>{let v=document.getElementById("remoteMedia");if(!v){v=document.createElement(rtcKind==="video"?"video":"audio");v.id="remoteMedia";v.playsInline=true;v.autoplay=true;document.body.appendChild(v)}v.srcObject=e.streams[0]};await rtc.setRemoteDescription(d.offer);const ans=await rtc.createAnswer();await rtc.setLocalDescription(ans);socket.emit("call-answer",{to:d.from,answer:ans});}catch(e){alert(e.message)}});socket.on("call-answer",async d=>{if(rtc)try{await rtc.setRemoteDescription(d.answer)}catch(e){}});socket.on("ice",async d=>{if(rtc&&d.candidate)try{await rtc.addIceCandidate(d.candidate)}catch(e){}});socket.on("room-denied",d=>alert(d.message));socket.on("room-error",d=>alert(d.message));socket.on("room-kicked",d=>{alert(d.action==="ban"?"تم حظرك من الغرفة":"تم طردك من الغرفة");currentRoom="الغرفة العامة";show("rooms")});socket.on("mic-state",()=>{if(currentRoom==="غرفة الصوت")show("voice")})}
function add(m){msgs.insertAdjacentHTML("beforeend",`<div class="msgline"><div class="ava">👤</div><div class="msgbody"><div><div class="bubble"><div class="name">${esc(m.name)}</div>${esc(m.text)}</div><span class="msgtools"><button onclick="reactMsg('❤️')">♥</button><button onclick="reactMsg('👍')">👍</button></span></div><div class="time">${new Date(m.time).toLocaleTimeString("ar-IQ",{hour:"2-digit",minute:"2-digit"})}</div></div></div>`);msgs.scrollTop=msgs.scrollHeight}
function reactMsg(e){alert('تفاعل '+e+' مع الرسالة')}
function send(){let v=msg.value.trim();if(!v)return;socket.emit("message",{text:v});msg.value=""}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function openRoom(n){currentRoom=n;if(n==="الغرفة العامة"||n==="غرفة الأصدقاء"||n==="غرفة الحب"){show("rooms");return}if(n==="غرفة الصوت"){show("voice");return}show("rooms")}
function rules(){openModal(`<div class="boxhead">قوانين الغرفة<button class="close" onclick="closeM()">×</button></div><div class="boxbody"><p>الغرفة العامة: كتابة نصية فقط.</p><p>لا صور ولا فيديو ولا تسجيل صوت ولا مكالمات.</p><p>الإعجاب: انتظار 10 ثوانٍ بين كل إعجاب.</p><p>400 إعجاب: التنبيهات. 500 إعجاب: الصور والفيديو والخصائص المحددة.</p></div>`)}
async function voiceView(){
 let st;try{st=await api(`/api/room/status?room=${encodeURIComponent("غرفة الصوت")}`)}catch(e){return `<main class="layout"><section class="card" style="padding:15px"><div class="notice">${esc(e.message)}</div></section></main>`}

async function recordVoice(){
 if(!privateToName)return alert("اختر شخصًا أولًا");
 if(Number(me.likes||0)<500)return alert("التسجيل الصوتي يفتح عند 500 إعجاب");
 if(!navigator.mediaDevices?.getUserMedia)return alert("المتصفح لا يدعم التسجيل الصوتي");
 try{
   const stream=await navigator.mediaDevices.getUserMedia({audio:true});
   const rec=new MediaRecorder(stream); const chunks=[];
   rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
   rec.onstop=async()=>{stream.getTracks().forEach(t=>t.stop()); const blob=new Blob(chunks,{type:rec.mimeType||"audio/webm"}); const fd=new FormData(); fd.append("file",blob,"voice.webm"); fd.append("to",privateToName); try{const j=await api("/api/media",{method:"POST",body:fd});pmsgs.insertAdjacentHTML("beforeend",`<div class="notice">🎙️ تسجيل صوتي خاص: <audio controls src="${j.url}"></audio></div>`)}catch(e){alert(e.message)}};
   rec.start(); alert("بدأ التسجيل. اضغط موافق ثم التسجيل سيستمر 10 ثوانٍ."); setTimeout(()=>{if(rec.state!=="inactive")rec.stop()},10000);
 }catch(e){alert(e.message)}
}

function rankInfo(n){n=Number(n)||0;if(n>=500)return {name:"عضو ملكي",icon:"👑",next:null};if(n>=400)return {name:"عضو ماسي",icon:"💎",next:500};if(n>=300)return {name:"عضو فضي",icon:"🔷",next:400};if(n>=200)return {name:"عضو ذهبي",icon:"⭐",next:300};if(n>=100)return {name:"عضو مميز",icon:"🌟",next:200};if(n>=50)return {name:"مشارك نشط",icon:"🔥",next:100};return {name:"عضو جديد",icon:"✦",next:50}}
function badgeInfo(n){n=Number(n)||0;return [{need:100,icon:"❤️",name:"المحبة"},{need:200,icon:"👑",name:"النجم"},{need:300,icon:"💎",name:"الماس"},{need:400,icon:"🔥",name:"النشاط"},{need:500,icon:"📷",name:"المصور"},{need:500,icon:"🎙️",name:"الصوت"},{need:500,icon:"🛡️",name:"التميز"}]}
function rankBadgeHtml(n){const r=rankInfo(n);return `<span class="rank-pill"><span class="rank-icon">${r.icon}</span>${r.name}</span>`}
function badgesHtml(n){return `<div class="badge-row">${badgeInfo(n).map(b=>`<div class="badge ${n>=b.need?"":"locked"}" title="${b.name} — ${b.need} إعجاب">${b.icon}<small>${b.need}</small></div>`).join("")}</div>`}
function rankPanelHtml(n){const r=rankInfo(n);const prev=r.next?({50:0,100:50,200:100,300:200,400:300,500:400}[r.next]||0):500;const pct=r.next?Math.min(100,Math.round(((n-prev)/(r.next-prev))*100)):100;return `<div class="rank-panel"><div class="rank-title">${r.icon} ${r.name}</div><div class="muted">${r.next?`${n} إعجاب — باقي ${Math.max(0,r.next-n)} للوصول إلى الرتبة التالية`:`${n} إعجاب — أعلى رتبة حالياً`}</div><div class="rank-progress"><i style="width:${pct}%"></i></div></div>`}

async function startCall(video){
 if(!privateToName)return alert("اختر شخصًا أولًا");
 if(Number(me.likes||0)<500)return alert("المكالمات الخاصة تفتح عند 500 إعجاب");
 if(!window.isSecureContext && location.hostname!=="localhost")return alert("المكالمات تحتاج HTTPS عند الاستضافة");
 try{
   rtcTarget=privateToName; rtcKind=video?"video":"audio";
   rtc=new RTCPeerConnection({iceServers:[{urls:"stun:stun.l.google.com:19302"}]});
   const stream=await navigator.mediaDevices.getUserMedia({audio:true,video:video});
   window.rimazCallStream=stream; stream.getTracks().forEach(t=>rtc.addTrack(t,stream));
   rtc.onicecandidate=e=>{if(e.candidate)socket.emit("ice",{to:privateToName,candidate:e.candidate})};
   rtc.ontrack=e=>{let v=document.getElementById("remoteMedia");if(!v){v=document.createElement(video?"video":"audio");v.id="remoteMedia";v.playsInline=true;v.autoplay=true;v.controls=true;v.style="position:fixed;right:12px;bottom:80px;z-index:120;max-width:80vw;max-height:45vh;background:#111;border-radius:12px";document.body.appendChild(v)}v.srcObject=e.streams[0]};
   const offer=await rtc.createOffer(); await rtc.setLocalDescription(offer); socket.emit("call-offer",{to:privateToName,offer,video});
   alert(video?"تم إرسال طلب مكالمة فيديو 📹":"تم إرسال طلب مكالمة صوتية 📞");
 }catch(e){alert(e.message||"تعذر تشغيل المكالمة")}
}

function openHalf(h){openModal(h,true)}
function closeM(){document.getElementById("modal").classList.remove("open");box.className="box"}

function bottomNav(active){return `<div class="bottom premium-bottom"><button onclick="settings()">⚙️<b>الضبط</b></button><button onclick="openWallHalf()">📝<b>الحائط</b></button><button onclick="openRoomsHalf()">🏠<b>الغرف</b></button><button onclick="openPrivateHalf()">💬<b>الخاص</b></button><button onclick="openPeopleHalf()">👥<b>المتواجدين</b></button><button onclick="profileView()">👤<b>الحساب</b></button><button onclick="exitRoom()">🚪<b>خروج</b></button></div>`}
async function openPeopleHalf(){const list=await api("/api/members");openHalf(`<div class="boxhead">👥 المتواجدين في ${esc(currentRoom)} <button class="close" onclick="closeM()">×</button></div><div class="boxbody">${list.map(x=>`<div class="admin-row"><div><b>${esc(x.name)} ${x.online?"🟢":"⚪"}</b><small>${rankBadgeHtml(x.likes)} · ❤️ ${x.likes} · ${esc(x.profile?.status||"")}</small></div><div class="admin-actions"><button class="like-btn" onclick='like(${JSON.stringify(x.name)})'>❤️</button><button class="black" onclick='openPrivateTarget(${JSON.stringify(x.name)})'>خاص</button></div></div>`).join("")||`<div class="muted">لا يوجد متواجدون.</div>`}</div>`)}
function openPrivateTarget(n){privateToName=n;closeM();openPrivateHalf()}
async function openRoomsHalf(){await syncRooms();openHalf(`<div class="boxhead">🏠 الغرف <button class="close" onclick="closeM()">×</button></div><div class="boxbody">${rooms.map(r=>`<div class="admin-row"><div><b>${r[0]} ${esc(r[1])}</b><small>${esc(r[2])} · ${r[3]||0} متصل</small></div><button class="black" onclick='selectRoomHalf(${JSON.stringify(r[1])})'>دخول</button></div>`).join("")}</div>`)}
function selectRoomHalf(n){closeM();openRoom(n)}
async function openPrivateHalf(){connect();openHalf(privateView().replace('<main class="layout">','<div>').replace('</main>','</div>'))}
async function openWallHalf(){try{const html=await wallView();openHalf(html.replace('<main class="layout">','<div>').replace('</main>','</div>'))}catch(e){alert(e.message)}}
function exitRoom(){if(!socket||!currentRoom)return;socket.emit("leave-room");currentRoom="الغرفة العامة";show("rooms")}

async function show(page){let s=await api("/api/state");me=s.user;if(!me)return auth();await syncRooms();if(page==="rooms"){app.innerHTML=header("rooms")+roomsView()+bottomNav("rooms");connect()}else if(page==="voice"){app.innerHTML=header("rooms")+(await voiceView())+bottomNav("rooms");connect()}else if(page==="private"){app.innerHTML=header("rooms")+roomsView()+bottomNav("rooms");connect();openPrivateHalf()}else if(page==="members"){app.innerHTML=header("rooms")+roomsView()+bottomNav("rooms");connect();openPeopleHalf()}else{app.innerHTML=header("rooms")+roomsView()+bottomNav("rooms");connect();openWallHalf()};refreshBell()}

start();
</script>
</body></html>
