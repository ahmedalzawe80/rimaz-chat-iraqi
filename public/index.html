</head><body><div id="app"></div>
<script>
const app=document.getElementById('app');let sid=localStorage.getItem('rimaz_sid')||'',me=null,rooms=[],currentRoom='public',socket=null,activeOverlay=null,privateTo='',privateOpen=false,notifications=[],privateUnread={},privatePeerProfile={};
const EMOJIS='😀 😃 😄 😁 😆 😅 😂 🤣 😊 😇 🙂 🙃 😉 😌 😍 🥰 😘 😗 😙 😚 😋 😛 😝 😜 🤪 🤨 🧐 🤓 😎 🤩 🥳 😏 😒 😞 😔 😟 😕 🙁 ☹️ 😣 😖 😫 😩 🥺 😢 😭 😤 😠 😡 🤬 🤯 😳 🥵 🥶 😱 😨 😰 😥 😓 🤗 🤔 🫡 🤭 🤫 🤥 😶 😐 😑 😬 🙄 😯 😦 😧 😮 😲 🥱 😴 🤤 😪 😵 🤐 🤑 🤠 😈 👿 👹 👺 🤡 💩 👻 💀 ☠️ 👽 👾 🤖 🎃 😺 😸 😹 😻 😼 😽 🙀 😿 😾 ❤️ 🧡 💛 💚 💙 💜 🖤 🤍 🤎 💔 ❤️‍🔥 💕 💞 💓 💗 💖 💘 💝 💟 💋 👍 👎 👌 ✌️ 🤞 🤟 🤘 🤙 👈 👉 👆 👇 ☝️ ✋ 🤚 🖐️ 🖖 👋 🤏 💪 🙏 👏 🙌 🫶 🤝 💅 👀 👁️ 🧠 🔥 ⭐ 🌟 ✨ 💫 💥 🎉 🎊 🌹 🌷 🌸 🌺 🌻 🦋 🕊️ ☀️ 🌙 ⚡ 💎 👑 🥀 🥰'.split(' ');
function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
async function api(url,opt={}){opt.headers={...(opt.headers||{}),'x-session':sid};let r=await fetch(url,opt);let j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'حدث خطأ');return j}
function toast(t){const x=document.getElementById('toast');if(!x)return;x.textContent=t;x.style.display='block';clearTimeout(x._t);x._t=setTimeout(()=>x.style.display='none',2600)}
function login(){
app.innerHTML=`<div class="login rimazLogin"><header class="rlTop"><div class="rlBrand"><span class="rlCrown">♛</span><div><b>دردشة <em>ريماز</em> عراقية</b><small>محادثات · تواصل · أصدقاء</small></div></div><div class="rlTopTools"><span>⚙ الإعدادات</span><span>؟ مساعدة</span></div></header>
<section class="rlHero"><img src="/rimaz-login-banner.jpg" alt="صورة فتاة للترحيب"><div class="rlHeroCopy"><h1>دردشة <strong>ريماز</strong><br>عراقية</h1><p>أهلاً وسهلاً بك في ريماز ♡</p><small>مكانك للتعارف وتكوين الصداقات</small><div class="rlFlag"><span>الله أكبر</span></div></div></section>
<section class="rlLoginPanel"><div class="rlTabs" dir="rtl">
<button id="tabGuest" onclick="loginMode('guest')"><span>♟</span> دخول زائر</button>
<button id="tabIn" onclick="loginMode('in')"><span>♟</span> دخول عضو</button>
<button id="tabNew" onclick="loginMode('new')"><span>♟✚</span> تسجيل عضو</button></div>
<div id="loginForm" class="loginForm rlForm"></div>
<div class="rlSpecial"><button id="tabHidden" onclick="loginMode('hidden')">🛡 دخول السوبر والإداري</button><button id="tabGhost" onclick="loginMode('ghost')">👻 دخول الشبح</button></div>
</section>
<section class="rlOnline"><div class="rlOnlineHead"><span>👥 المتواجدين الآن</span><b><span id="rlOnlineCount">—</span></b></div><div id="rlOnlineList" class="rlOnlineList"><div class="rlOnlineEmpty">جارٍ تحميل المتواجدين…</div></div><div class="rlOnlineFoot">قائمة للعرض فقط — سجّل دخولك للمشاركة بالدردشة</div></section>
<footer class="rlFooter"><span>دردشة ريماز عراقية</span><span>♥ أهلاً بكم</span></footer><nav class="rlBottomNav" aria-label="معاينة أزرار الدردشة"><span><b>♟</b>حسابي</span><span><b>⇥</b>خروج من الغرفة</span><span><b>♟♟</b>المتواجدون داخل الغرفة</span><span><b>☏</b>الخاص</span><span><b>▣</b>الحائط</span><span><b>⚙</b>الضبط</span></nav></div>`;
loginMode('in');loadPublicOnline();if(window.rimazOnlineTimer)clearInterval(window.rimazOnlineTimer);window.rimazOnlineTimer=setInterval(loadPublicOnline,15000);
}
function keepKeyboardVisible(){document.querySelectorAll('#loginForm input').forEach(i=>i.addEventListener('focus',()=>setTimeout(()=>i.scrollIntoView({block:'center',behavior:'smooth'}),120)));}
window.visualViewport?.addEventListener('resize',()=>{const a=document.activeElement;if(a&&a.matches?.('#loginForm input'))setTimeout(()=>a.scrollIntoView({block:'center',behavior:'smooth'}),60)});
function loginMode(mode){
['tabNew','tabIn','tabGuest','tabHidden','tabGhost'].forEach(id=>document.getElementById(id)?.classList.remove('active'));
const ids={new:'tabNew',in:'tabIn',guest:'tabGuest',hidden:'tabHidden',ghost:'tabGhost'};
document.getElementById(ids[mode])?.classList.add('active');
const f=document.getElementById('loginForm');if(!f)return;
if(mode==='guest'){
f.innerHTML=`<input id="ln" autocomplete="nickname" placeholder="اكتب اسم الزائر (اسم فريد)" aria-label="اسم الزائر"><button class="primary guest" onclick="doGuest()">دخول زائر ←</button>`;
}else if(mode==='in'||mode==='new'){
f.innerHTML=`<input id="ln" autocomplete="username" placeholder="${mode==='new'?'اختر اسم عضو غير مستخدم':'اكتب اسم العضو'}" aria-label="اسم العضو"><input id="lp" type="password" autocomplete="${mode==='new'?'new-password':'current-password'}" placeholder="اكتب كلمة المرور" aria-label="كلمة المرور"><button class="primary" onclick="${mode==='new'?'doRegister()':'doLogin()'}">${mode==='new'?'تسجيل عضو جديد':'دخول عضو'} ←</button>`;
}else{
f.innerHTML=`<div class="rlPrivateNote">${mode==='ghost'?'دخول الشبح مخصص لمالك الموقع فقط':'الدخول المخفي مخصص للسوبر والإداري المخوّل'}</div><input id="ln" autocomplete="username" placeholder="اسم الحساب" aria-label="اسم الحساب"><input id="lp" type="password" autocomplete="current-password" placeholder="كلمة المرور" aria-label="كلمة المرور"><button class="primary" onclick="doPrivilegedLogin('${mode}')">${mode==='ghost'?'دخول الشبح':'دخول مخفي'} ←</button>`;
}
keepKeyboardVisible();
}
async function doPrivilegedLogin(mode){
const n=document.getElementById('ln')?.value||'',p=document.getElementById('lp')?.value||'';
try{
const j=await api('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n,password:p})});
if(mode==='ghost'&&!j.user?.owner)throw new Error('دخول الشبح مخصص لمالك الموقع فقط');
if(mode==='hidden'&&!j.user?.staff)throw new Error('هذا الحساب لا يملك صلاحية الدخول المخفي');
sid=j.sid;localStorage.setItem('rimaz_sid',sid);await boot();
}catch(e){toast(e.message||'تعذر الدخول');}
}
async function loadPublicOnline(){
const list=document.getElementById('rlOnlineList');if(!list)return;
try{
const r=await fetch('/api/public-online',{cache:'no-store'});if(!r.ok)throw new Error('تعذر التحميل');const data=await r.json();
const users=Array.isArray(data.users)?data.users:[];
const count=document.getElementById('rlOnlineCount');if(count)count.textContent=users.length;
list.innerHTML=users.length?users.map(u=>`<div class="rlOnlineMember"><div class="rlAvatar">${u.avatar?`<img src="${esc(u.avatar)}" alt="">`:'👤'}</div><div class="rlMemberInfo"><b>${esc(u.displayName||u.name||'عضو')}</b><small><i></i> ${esc(u.status||'متصل الآن')}</small></div><span class="rlFlagMini">🇮🇶</span><span class="rlDot"></span></div>`).join(''):'<div class="rlOnlineEmpty">لا يوجد أعضاء متصلون حالياً</div>';
}catch(e){list.innerHTML='<div class="rlOnlineEmpty">قائمة المتواجدين غير متاحة حالياً</div>';}
}
async function doRegister(){try{const j=await api('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:ln.value,password:lp.value})});sid=j.sid;localStorage.setItem('rimaz_sid',sid);await boot()}catch(e){toast(e.message)}}
async function doLogin(){try{const j=await api('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:ln.value,password:lp.value})});sid=j.sid;localStorage.setItem('rimaz_sid',sid);await boot()}catch(e){toast(e.message)}}
async function doGuest(){try{const j=await api('/api/guest',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:ln.value})});sid=j.sid;localStorage.setItem('rimaz_sid',sid);await boot()}catch(e){toast(e.message)}}
async function boot(){try{const s=await api('/api/state');me=s.user;rooms=s.rooms;currentRoom='public';notifications=await api('/api/notifications');renderChat();connect();}catch(e){sid='';localStorage.removeItem('rimaz_sid');login()}}
function displayFor(x){return x?.displayName||x?.profile?.displayName||x?.name||''}
function avatarFor(p){return p?.avatar||'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect width="100" height="100" fill="#fff"/><text x="50" y="54" text-anchor="middle" font-family="Tahoma" font-size="15" font-weight="700" fill="#111">دردشة ريماز</text></svg>`)}
function memberBadge(x){const gifts=x?.profile?.gifts||[];const g=gifts[0]?.gift||'';if(g.includes('أسود'))return '<span class="memberBadge giftBlack" title="درع أسود">🛡️</span>';if(g.includes('أبيض'))return '<span class="memberBadge giftWhite" title="درع أبيض">🛡️</span>';if(g.includes('فضي'))return '<span class="memberBadge giftSilver" title="درع فضي">🛡️</span>';if(g.includes('وردة'))return '<span class="memberBadge giftRose" title="وردة">🌹</span>';if(x?.role==='owner'||x?.role==='admin')return '<span class="memberBadge roleAdmin" title="إداري">👑</span>';if(x?.role==='super')return '<span class="memberBadge roleSuper" title="سوبر">⭐</span>';if(x?.role==='banner')return '<span class="memberBadge roleBanner" title="بنر">🛡️</span>';if(x?.vip)return '<span class="memberBadge roleVip" title="VIP">👑</span>';return '<span class="memberBadge emptyBadge" aria-hidden="true"></span>'}
function memberStatusClass(x){const online=x?.online!==false;const open=x?.profile?.privateOpen!==false;return online?(open?'statusOpen':'statusClosed'):'statusOffline'}
function avatarLabel(p){return p?.avatar?`<img class="avatarThumb" src="${esc(p.avatar)}">`:`<span class="defaultAvatar">دردشة ريماز</span>`}
function refreshRoomBar(){const r=rooms.find(x=>x.id===currentRoom)||{name:'الغرفة العامة'};const n=document.querySelector('.roomName');if(n)n.textContent=r.name}
function exitRoom(){if(!socket||!currentRoom)return;const old=currentRoom;socket.emit('leave-room',{room:old});currentRoom='';const n=document.querySelector('.roomName');if(n)n.textContent='خارج الغرفة';const input=document.getElementById('msgInput');if(input){input.disabled=true;input.placeholder='أنت خارج الغرفة';}openMembers()}
function reenterRoom(room){const old=currentRoom;if(socket&&old&&old!==room)socket.emit('leave-room',{room:old});closeLayer();joinRoom(room);}
function renderChat(){app.innerHTML=`<div class="chat"><div class="messages" id="msgs"></div><div class="composer"><button onclick="sendPublic()">إرسال ➤</button><input id="msgInput" placeholder="اكتب رسالتك هنا" onkeydown="if(event.key==='Enter')sendPublic()"><button class="emojiBtn" onclick="emojiPicker('public')">🙂</button><button class="exitComposer" onclick="exitRoom()">↪</button></div><div class="bottom"><button onclick="openSettings()">⚙ الضبط</button><button onclick="openWall()">💬 الحائط <span id="wallCount" class="wallCount"></span></button><button onclick="openRooms()">♣ الغرف</button><button onclick="openPrivateList()">💬 خاص</button><button onclick="openMembers()">👤 <span id="onlineCount">0</span></button></div><div id="layer"></div><div id="toast" class="toast"></div></div>`;document.getElementById('msgs').innerHTML='';}
function connect(){if(socket)socket.disconnect();socket=io();socket.on('connect',()=>{if(currentRoom)joinRoom(currentRoom)});socket.on('history',d=>{const box=document.getElementById('msgs');if(!box||!d||d.room!==currentRoom)return;box.innerHTML='';(d.items||[]).forEach(addMessage);box.scrollTop=box.scrollHeight});socket.on('message',m=>{if(m.room===currentRoom)addMessage(m)});socket.on('live-state',s=>{rooms=s.rooms||rooms;const c=document.getElementById('onlineCount');if(c)c.textContent=(s.online||[]).length;});socket.on('likes-changed',d=>{if(me?.name===d.name){me.likes=d.likes;me.level=d.level;updateMeBadges();}});socket.on('error-msg',d=>showBlockModal(d.error,'تنبيه'));socket.on('join-error',d=>{currentRoom='';const input=document.getElementById('msgInput');if(input){input.disabled=true;input.placeholder='أنت خارج الغرفة'};showBlockModal(d.error||'لا يمكنك دخول الغرفة','تنبيه');openMembers();});socket.on('admin-notice',d=>toast('📢 '+d.text));socket.on('notification',d=>showIncomingNotice('تنبيه من '+(d.from||'عضو'),d.text));socket.on('like-received',d=>showIncomingNotice('إعجاب ❤️',d.text));socket.on('gift',d=>{if(key(d.name)===key(me?.name))showIncomingNotice('🎁 هدية من '+(d.from||'الإدارة'),d.gift||'هدية');});socket.on('vip-changed',d=>{if(key(d.name)===key(me?.name))showIncomingNotice('👑 VIP', 'تم منحك VIP لمدة 24 ساعة');});socket.on('role-changed',d=>{if(me&&key(d.name||me.name)===key(me.name)){me.role=d.role;me.admin=['owner','admin'].includes(d.role);me.staff=['owner','admin','super','banner'].includes(d.role);showIncomingNotice('الصلاحية','تم تحديث صلاحيتك إلى '+d.role);}});socket.on('private-message',m=>{const other=key(m.from)===key(me.name)?m.to:m.from;if(privateOpen&&(key(privateTo)===key(m.from)||key(privateTo)===key(m.to))){addPrivate(m)}else{privateUnread[other]=(privateUnread[other]||0)+1;updatePrivateButton();toast('💬 رسالة خاصة من '+(m.fromDisplayName||m.from));}});socket.on('private-media',m=>{if(privateOpen&&(key(privateTo)===key(m.from)||key(privateTo)===key(m.to)))addPrivateMedia(m);else toast('📎 وسائط خاصة من '+m.from)});socket.on('wall-new',()=>{if(activeOverlay==='wall')openWall()});socket.on('kicked',d=>{if(currentRoom===d.room){currentRoom='';refreshRoomBar();const input=document.getElementById('msgInput');if(input){input.disabled=true;input.placeholder='أنت خارج الغرفة'};openMembers();toast(d.banned?'تم حظرك من الغرفة لمدة 15 دقيقة':'تم طردك من الغرفة، يمكنك العودة مباشرة')}});socket.on('call-offer',handleOffer);socket.on('call-answer',handleAnswer);socket.on('ice',handleIce);}
function key(x){return String(x||'').trim().toLowerCase()}
function joinRoom(room){if(!room)return;currentRoom=room;refreshRoomBar();const input=document.getElementById('msgInput');if(input){input.disabled=false;input.placeholder='اكتب رسالتك هنا';}socket?.emit('join',{sid,room});}
function addPresence(d){if(currentRoom!==d.room)return;const box=document.getElementById('msgs');if(!box)return;const p=d.profile||{};const action=d.action==='join'?'دخل':'خرج';const roomName=(rooms.find(r=>r.id===d.room)||{}).name||'الغرفة العامة';const t=new Date(d.at||Date.now()).toLocaleTimeString('ar-IQ',{hour:'2-digit',minute:'2-digit'});const phrase=action==='دخل'?'هذا المستخدم قد دخل':'هذا المستخدم قد خرج';box.insertAdjacentHTML('beforeend',`<div class="presence"><img class="presenceAvatar" onclick="openMemberProfile('${esc(d.name)}')" src="${esc(avatarFor(p))}"><div class="presenceBody"><span class="presenceName" onclick="openMemberProfile('${esc(d.name)}')" style="color:${esc(p.nameColor||'#111')}">${esc(d.displayName||d.name)}</span><span class="presenceText">${phrase} <span class="notice">${esc(roomName)}</span></span></div><div class="presenceTime">${t}</div></div>`);box.scrollTop=box.scrollHeight}

function addMessage(m){if(m?.type==='presence'){addPresence({name:m.from,displayName:m.displayName||m.from,profile:m.profile||{},action:m.presenceAction||'join',room:m.room,at:m.at});return;}const box=document.getElementById('msgs');if(!box)return;const p=m.profile||{};let content=esc(m.text||'');if(m.media){content=m.media.mime.startsWith('image/')?`<img src="${esc(m.media.url)}" class="wallMedia">`:m.media.mime.startsWith('video/')?`<video src="${esc(m.media.url)}" class="wallMedia" controls></video>`:`<audio src="${esc(m.media.url)}" controls></audio>`}box.insertAdjacentHTML('beforeend',`<div class="msg"><img class="avatar" onclick="openMemberProfile('${esc(m.from)}')" src="${esc(avatarFor(p))}"><div class="msgbody"><div class="msghead" style="color:${esc(p.nameColor||'#222')}"><span onclick="openMemberProfile('${esc(m.from)}')">${esc(m.displayName||m.from)}</span> ${m.likes>=500?'<span class="badge">500+</span>':''}</div><div class="msgtext" style="background:${esc(p.bgColor||'#fff')}">${content}</div></div><div class="time">${new Date(m.at).toLocaleTimeString('ar-IQ',{hour:'2-digit',minute:'2-digit'})}</div></div>`);box.scrollTop=box.scrollHeight}

function sendPublic(){const text=document.getElementById('msgInput')?.value.trim();if(!text)return;socket.emit('send-message',{room:currentRoom,text});document.getElementById('msgInput').value=''}
function layer(html,name){activeOverlay=name;document.getElementById('layer').innerHTML=html}
function closeLayer(){activeOverlay=null;document.getElementById('layer').innerHTML=''}
function head(t){return `<div class="overlayHead"><span>${t}</span><button class="close" onclick="closeLayer()">×</button></div>`}
async function openMemberProfile(name){const a=await api('/api/members');const u=a.find(x=>key(x.name)===key(name));if(!u)return;const p=u.profile||{};const dn=displayFor(u)||name;layer(`<div class="profileOverlay"><div class="profileTop"><img class="profileTopAvatar" src="${esc(avatarFor(p))}" alt=""><b>${esc(dn)}</b><button type="button" class="close" style="width:28px;height:28px;font-size:22px" onclick="closeLayer()">×</button></div><img class="profilePhoto" src="${esc(avatarFor(p))}" onerror="this.style.display='none'"><div class="profileInfo"><div style="font-size:12px;color:#777"><span class="statusDot ${u.online?(p.privateOpen===false?'statusClosed':'statusOpen'):'statusOffline'}"></span>${esc(u.online?(p.status||'متصل الآن'):'غير متصل')}</div><div style="margin-top:4px"><span class="likeBig">♥ ${u.likes||0}</span> · مستوى ${u.level||1}${u.vip?' · 👑 VIP':''}</div></div><div class="profileGrid"><button type="button" onclick="sendLike('${esc(name)}')">♥ إعجاب</button><button type="button" onclick="notifyUser('${esc(name)}')">✉ تنبيه</button><button type="button" onclick="openPrivate('${esc(name)}')">💬 مراسلة خاصة</button>${me.staff&&key(name)!==key(me.name)?`<button type="button" onclick="memberAdminMenu('${esc(name)}')">🛠 إدارة</button>`:''}</div></div>`,'memberProfile')}

async function openMembers(){const a=await api('/api/members');layer(`<div class="overlay membersOverlay"><div class="overlayHead membersHead"><span>المتواجدين</span><button class="close" onclick="closeLayer()">×</button></div><div class="overlayBody"><div style="padding:5px"><input id="memberSearch" style="width:100%;height:38px;border:1px solid #aaa;padding:5px" placeholder="... البحث" oninput="filterMembers()"></div><div id="memberList">${memberRows(a)}</div></div></div>`,'members')}
function memberRows(a){return a.map(x=>{const online=x.online!==false;const dot=memberStatusClass(x);return `<div class="member row" data-name="${esc(displayFor(x))}" onclick="openMemberProfile('${esc(x.name)}')"><span class="memberStatusBar ${dot}" title="${online?(x.profile?.privateOpen===false?'الخاص مغلق':'الخاص مفتوح'):'غير موجود'}"></span><img src="${esc(avatarFor(x.profile))}">${memberBadge(x)}<div class="memberMain"><div class="memberName">${esc(displayFor(x))} ${x.name.toLowerCase()==='admin'?'👑':''}</div><div class="memberSub">${esc(online?(x.profile?.status||'متصل الآن'):'غير متصل')} · مستوى ${x.level}</div></div><div class="memberLikes">${x.likes} ♥<br><span class="flag">${x.type==='guest'?'👤':'🇮🇶'}</span></div></div>`}).join('')||'<div class="empty">لا يوجد متواجدون</div>'}
function filterMembers(){const q=key(memberSearch.value);document.querySelectorAll('#memberList .member').forEach(x=>x.style.display=key(x.dataset.name).includes(q)?'grid':'none')}
async function openRooms(){const s=await api('/api/state');rooms=s.rooms;layer(`<div class="overlay roomsOverlay"><div class="overlayHead roomsHead"><button class="close" onclick="closeLayer()">×</button><span>غرف الدردشة: ${rooms.reduce((n,r)=>n+(r.online||0),0)}</span></div><div class="overlayBody"><button class="newRoom" onclick="toast('إنشاء الغرف من لوحة الادارة فقط')">+ غرفة جديدة</button>${rooms.map(r=>`<div class="room" onclick="reenterRoom('${esc(r.id)}')"><img src="${esc(avatarFor({}))}"><div><div class="roomName">${esc(r.name)}</div><div class="roomDesc">${esc(r.desc||'غرفة عامة ..')}</div></div><div class="count ${r.kind==='voice'?'voice':''}">${r.kind==='voice'?'🎙️':'♟'}${r.online||0}/${r.capacity}</div></div>`).join('')}</div></div>`,'rooms')}
async function openWall(){const w=await api('/api/wall');layer(`<div class="overlay">${head('الحائط')}<div class="overlayBody wallOverlayBody"><div id="wallPosts" class="wallPosts">${w.map(wallCard).join('')}</div><div class="wallInput"><div class="wallCompose"><button onclick="postWall()">إرسال ➤</button><textarea id="wallText" placeholder="اكتب منشورك..."></textarea><button class="smile" onclick="emojiPicker('wall')">🙂</button><button onclick="wallMedia()">📎</button></div></div></div></div>`,'wall')}
function wallCard(p){let m='';if(p.media)m=p.media.mime.startsWith('image/')?`<img src="${esc(p.media.url)}" class="wallMedia">`:`<video src="${esc(p.media.url)}" class="wallMedia" controls></video>`;return `<div class="wallPost"><img class="wallAvatar" onclick="openMemberProfile('${esc(p.from)}')" src="${esc(avatarFor(p.profile||{}))}"><div class="wallPostMain"><div class="wallText"><b onclick="openMemberProfile('${esc(p.from)}')" style="cursor:pointer">${esc(p.displayName||p.from)}</b><div>${esc(p.text||'')}</div>${m}</div><div class="wallActions"><button onclick="wallLike('${p.id}')">♥${p.likes||''}</button><button onclick="toast('التعليقات متاحة داخل المنشور')">💬</button></div></div></div>`}
async function postWall(){const text=document.getElementById('wallText')?.value.trim();if(!text)return toast('اكتب شيئاً أولاً');try{await api('/api/wall',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});toast('تم النشر');openWall()}catch(e){toast(e.message)}}
async function wallMedia(kind){const f=document.createElement('input');f.type='file';f.accept=kind==='image'?'image/*':'video/*';f.onchange=async()=>{const fd=new FormData();fd.append('file',f.files[0]);fd.append('scope','wall');try{await api('/api/media',{method:'POST',body:fd});openWall()}catch(e){toast(e.message)}};f.click()}
async function wallLike(id){try{const j=await api('/api/wall/like',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id})});toast('♥ '+j.likes);openWall()}catch(e){toast(e.message)}}
async function openPrivateList(){try{const a=await api('/api/private/contacts');const live=await api('/api/members');const byName=new Map(live.map(x=>[key(x.name),x]));const rows=a.map(x=>{const u=byName.get(key(x.name))||{name:x.name,profile:x.profile,online:x.online,likes:0,level:1};return `<div class="member row" onclick="openPrivate('${esc(x.name)}')"><span class="memberStatusBar ${memberStatusClass(u)}" title="${u.online?(u.profile?.privateOpen===false?'الخاص مغلق':'الخاص مفتوح'):'غير موجود'}"></span><img src="${esc(avatarFor(u.profile))}">${memberBadge(u)}<div class="memberMain"><div class="memberName">${esc(displayFor(u)||x.name)}</div><div class="memberSub">${esc(x.last||'محادثة خاصة')} ${privateUnread[x.name]?`· <b class="unreadBadge">${privateUnread[x.name]}</b>`:''}</div></div><div class="memberLikes">${u.likes||0} ♥</div></div>`});layer(`<div class="overlay privateListOverlay"><div class="overlayHead privateListHead"><span>المحادثات الخاصة</span><button class="close" onclick="closeLayer()">×</button></div><div class="overlayBody">${rows.join('')||'<div class="empty">لا توجد محادثات خاصة بعد</div>'}</div></div>`,'privateList')}catch(e){toast(e.message)}}
function showBlockModal(text,title='تنبيه'){const l=document.getElementById('layer');if(!l)return;l.insertAdjacentHTML('beforeend',`<div class="modalShade" id="blockModal"><div class="modalBox"><div class="modalTitle">${esc(title)}</div><div class="modalText">${esc(text)}</div><button class="modalOk" onclick="document.getElementById('blockModal')?.remove()">حسناً</button></div></div>`)}
async function openPrivate(name){privateUnread[name]=0;updatePrivateButton();const previous=activeOverlay;api('/api/members').then(a=>{const u=a.find(x=>key(x.name)===key(name));if(!u||!u.online){showBlockModal('هذا المستخدم غير متصل');return}if(u?.profile?.privateOpen===false){showBlockModal(`لقد أغلق ${displayFor(u)} المحادثة الخاصة`);return}privateTo=name;privatePeerProfile=u.profile||{};privateOpen=true;const dn=displayFor(u)||name;layer(`<div class="overlay privateOverlay"><div class="privateHead"><span class="privateStatus ${u?.online?(u?.profile?.privateOpen===false?'statusClosed':'statusOpen'):'statusOffline'}" title="${u?.online?(u?.profile?.privateOpen===false?'الخاص مغلق':'الخاص مفتوح'):'غير موجود'}"></span><img class="privateHeadAvatar" src="${esc(avatarFor(u.profile||{}))}" alt=""><div class="privateHeadName"><b>${esc(dn)}</b><small>${esc(u?.profile?.status||'متصل الآن')} · مستوى ${u?.level||1}</small></div><div class="privateHeadActions"><button class="privateClose" title="إغلاق النافذة مع الاحتفاظ بالمحادثة" onclick="minimizePrivate()">×</button><button class="blue" title="إرسال تنبيه" onclick="notifyUser('${esc(name)}')">✉</button><button class="privateLike" title="إعجاب" onclick="sendLike('${esc(name)}')">♥</button></div></div><div id="privateBody" class="privateBody"></div><button class="privateMinimize" type="button" title="إخفاء المحادثة مع الاحتفاظ بها" onclick="minimizePrivate()">− إخفاء المحادثة</button><div class="privateComposer"><button onclick="sendPrivate()">إرسال ➤</button><input id="privateText" placeholder="اكتب رسالتك هنا" onkeydown="if(event.key==='Enter')sendPrivate()"><button class="smile" onclick="emojiPicker('private')">🙂</button><button onclick="sharePrivate()">📎</button><button class="green" onclick="callChoice()">☎</button></div></div>`,'private');api('/api/private/history?to='+encodeURIComponent(name)).then(a=>{const b=document.getElementById('privateBody');if(b){b.innerHTML='';a.forEach(m=>addPrivate(m));}}).catch(()=>{});}).catch(e=>toast(e.message))}
function maximizePrivate(){document.querySelector('#layer .privateOverlay')?.classList.toggle('privateMax')}
function minimizePrivate(){closeLayer();/* keep privateTo and privateOpen so this conversation can be reopened */}
function sendPrivate(){const text=document.getElementById('privateText')?.value.trim();if(!text)return;socket.emit('private-message',{to:privateTo,text});document.getElementById('privateText').value=''}
function addPrivate(m){const b=document.getElementById('privateBody');if(!b)return;const mine=key(m.from)===key(me.name);const prof=mine?(me.profile||{}):privatePeerProfile;const av=avatarFor(prof);b.insertAdjacentHTML('beforeend',`<div class="pmsg ${mine?'me':''}"><div class="pmsgHead"><img src="${esc(av)}"><b>${esc(m.fromDisplayName||m.from)}</b></div><div>${esc(m.text||'')}</div></div>`);b.scrollTop=b.scrollHeight}
function addPrivateMedia(m){const b=document.getElementById('privateBody');if(!b)return;const mine=key(m.from)===key(me.name);const prof=mine?(me.profile||{}):privatePeerProfile;const av=avatarFor(prof);const url=String(m.media?.url||'');const mime=String(m.media?.mime||'');let med='';if(mime.startsWith('image/')){med=`<button type="button" class="privateMediaThumb imageThumb" data-media-type="image" data-media-url="${esc(url)}" onclick="openPrivateMediaFrom(this)" aria-label="فتح الصورة"><img src="${esc(url)}" alt="صورة مرسلة" loading="lazy"></button>`}else if(mime.startsWith('video/')){med=`<button type="button" class="privateMediaThumb videoThumb" data-media-type="video" data-media-url="${esc(url)}" onclick="openPrivateMediaFrom(this)" aria-label="تشغيل الفيديو"><span class="videoPlayIcon">▶</span><span>فيديو · اضغط للتشغيل</span></button>`}else if(mime.startsWith('audio/')){med=`<audio class="privateAudio" src="${esc(url)}" controls preload="metadata"></audio>`}b.insertAdjacentHTML('beforeend',`<div class="pmsg ${mine?'me':''}"><div class="pmsgHead"><img src="${esc(av)}"><b>${esc(m.fromDisplayName||m.from)}</b></div><div class="privateMediaArea">${med}</div></div>`);b.scrollTop=b.scrollHeight}
function openPrivateMediaFrom(el){const type=el?.dataset?.mediaType,url=el?.dataset?.mediaUrl;if(!type||!url)return;openPrivateMediaViewer(type,url)}
function openPrivateMediaViewer(type,url){const chat=document.querySelector('.chat');if(!chat)return;document.querySelector('.privateMediaViewer')?.remove();const modal=document.createElement('div');modal.className='privateMediaViewer';modal.innerHTML=type==='image'?`<div class="privateMediaFrame imageFrame"><button class="privateMediaClose" type="button" aria-label="إغلاق">×</button><img class="privateMediaFullImage" src="${esc(url)}" alt="الصورة المرسلة"></div>`:`<div class="privateMediaFrame videoFrame"><div class="privateMediaTitle">مشاهدة الفيديو<button class="privateMediaClose" type="button" aria-label="إغلاق">×</button></div><video class="privateMediaFullVideo" src="${esc(url)}" controls playsinline preload="metadata"></video></div>`;chat.appendChild(modal);modal.addEventListener('click',e=>{if(e.target===modal||e.target.closest('.privateMediaClose')){modal.querySelector('video')?.pause();modal.remove()}})}
function sharePrivate(){if(me.likes<500&&!me.admin)return toast('الإرسال والوسائط تفتح عند 500 إعجاب');const f=document.createElement('input');f.type='file';f.accept='image/*,video/*,audio/*';f.onchange=async()=>{const fd=new FormData();fd.append('file',f.files[0]);fd.append('to',privateTo);fd.append('scope','private');try{const j=await api('/api/media',{method:'POST',body:fd});addPrivateMedia(j)}catch(e){toast(e.message)}};f.click()}
async function openProfile(name){const s=await api('/api/state');const x=(s.online||[]).find(u=>key(u.name)===key(name))||{name,likes:0,level:1,profile:{}};layer(`<div class="profileOverlay"><div class="profileTop"><img src="${esc(avatarFor(x.profile))}"><b>${esc(displayFor(x))}</b><button class="close" style="width:40px;height:38px;font-size:22px" onclick="closeLayer()">×</button></div><img class="profilePhoto" src="${esc(avatarFor(x.profile))}"><div class="profileInfo"><div style="font-weight:900">${esc(x.profile?.status||'متصل الآن')}</div><div>${esc(x.profile?.bio||'عضو في دردشة ريماز عراقية')}</div><div class="badge">مستوى ${x.level} · ${x.likes||0} ♥</div></div><div class="profileGrid"><button onclick="sendLike('${esc(x.name)}')" class="likeBig">♥${x.likes}</button><button onclick="tryPrivate('${esc(x.name)}')">✉ محادثة خاصة</button><button onclick="notifyUser('${esc(x.name)}')">✉ تنبيه</button><button onclick="ignoreUser('${esc(x.name)}')" class="ignore">⛔ تجاهل</button></div></div>`,'profile')}
async function sendLike(n){try{const j=await api('/api/like',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({to:n})});toast('تم الإعجاب ♥ '+j.likes);if(activeOverlay==='memberProfile'||activeOverlay==='profile')openMemberProfile(n)}catch(e){showBlockModal(e.message,'تنبيه')}}
function tryPrivate(n){openPrivate(n)}
function showIncomingNotice(title,text){const old=document.getElementById('incomingNotice');if(old)old.remove();const layerEl=document.getElementById('layer');if(!layerEl)return;layerEl.insertAdjacentHTML('beforeend',`<div class="incomingNotice" id="incomingNotice"><div class="inHead"><span>${esc(title)}</span><button class="inClose" onclick="document.getElementById('incomingNotice')?.remove()">×</button></div><div class="inBody">${esc(text)}</div></div>`)}
async function notifyUser(n){const old=document.getElementById('noticeComposer');if(old)old.remove();const box=document.getElementById('layer');if(!box)return;box.insertAdjacentHTML('beforeend',`<div class="noticeMini" id="noticeComposer"><div class="noticeMiniHead"><b>إرسال تنبيه إلى ${esc(n)}</b><button type="button" onclick="document.getElementById('noticeComposer')?.remove()">×</button></div><div class="noticeMiniBody"><input id="noticeText" placeholder="اكتب التنبيه هنا..." value=""><button type="button" onclick="sendNotice('${esc(n)}')">إرسال ➤</button></div></div>`);document.getElementById('noticeText')?.focus()}
async function sendNotice(n){const text=document.getElementById('noticeText')?.value.trim();if(!text)return toast('اكتب التنبيه');try{await api('/api/notify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({to:n,text})});document.getElementById('noticeComposer')?.remove();toast('تم إرسال التنبيه')}catch(e){showBlockModal(e.message,'التنبيه')}}
async function ignoreUser(n){try{const j=await api('/api/ignore',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n})});toast(j.ignored?'تم تجاهل '+n:'تم إلغاء تجاهل '+n)}catch(e){toast(e.message)}}
function openSettings(){const p=me.profile||{};layer(`<div class="overlay">${head('الإعدادات')}<div class="overlayBody settings"><div class="srow"><div class="slabel">الزخرفة</div><div class="svalue"><input id="decor" value="${esc(p.displayName||me.name)}" placeholder="الاسم الظاهر"></div></div><div class="srow"><div class="slabel">الحالة</div><div class="svalue"><input id="status" value="${esc(p.status||'متصل الآن')}" placeholder="متصل الآن"></div></div><div class="srow"><div class="slabel">لون الإسم</div><div class="svalue"><input id="nameColor" type="color" value="${esc(p.nameColor||'#222222')}"></div></div><div class="srow"><div class="slabel">لون الخط</div><div class="svalue"><input id="fontColor" type="color" value="${esc(p.fontColor||p.nameColor||'#222222')}"></div></div><div class="srow"><div class="slabel">لون الخلفية</div><div class="svalue"><input id="bgColor" type="color" value="${esc(p.bgColor||'#ffffff')}"></div></div><button class="save" onclick="saveSettings()">🖉 حفظ</button><button class="plain audioSetting">حجم الخط - 100%</button><button class="plain audioSetting">السيرفر الصوتي: الأساسي</button><button class="plain audioSetting">جودة المايك: الاساسية</button><button class="plain avatarChoice" onclick="changeAvatar()">${avatarLabel(p)}<span>${me.likes>=10||me.admin?'تغيير الصورة':'🔒 تغيير الصورة — تحتاج 10 إعجابات'}</span></button><button class="danger" onclick="deleteAvatar()">✖ حذف الصورة</button><button class="plain toggle ${p.privateOpen!==false?'on':'off'}" onclick="toggleSetting('privateOpen')">💬 المحادثات الخاصة: ${p.privateOpen!==false?'مفتوحة':'مغلقة'}</button><button class="plain toggle ${p.notificationsOpen!==false?'on':'off'}" onclick="toggleSetting('notificationsOpen')">✉ التنبيهات: ${p.notificationsOpen!==false?'مفتوحة':'مغلقة'}</button>${me.admin?`<button class="plain" onclick="openAdmin()">👑 لوحة الإدارة</button>`:''}<button class="danger" onclick="logout()">↪ تسجيل خروج</button></div></div>`,'settings')}
async function saveSettings(){try{const j=await api('/api/profile',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({displayName:document.getElementById('decor')?.value||'',status:document.getElementById('status')?.value||'متصل الآن',nameColor:document.getElementById('nameColor')?.value||'#222222',fontColor:document.getElementById('fontColor')?.value||'#222222',bgColor:document.getElementById('bgColor')?.value||'#ffffff'})});me.profile=j.profile;me.displayName=j.profile.displayName;toast('تم الحفظ');closeLayer();refreshRoomBar()}catch(e){toast(e.message)}}
async function toggleSetting(k){const p=me.profile||{};p[k]=p[k]===false;try{const j=await api('/api/profile',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({[k]:p[k]})});me.profile=j.profile;openSettings()}catch(e){toast(e.message)}}
function changeAvatar(){if(me.likes<10&&!me.admin)return toast('الصورة تفتح بعد 10 إعجابات');const f=document.createElement('input');f.type='file';f.accept='image/*';f.onchange=async()=>{const fd=new FormData();fd.append('file',f.files[0]);try{const j=await api('/api/profile/avatar',{method:'POST',body:fd});me.profile.avatar=j.avatar;openSettings()}catch(e){toast(e.message)}};f.click()}
async function deleteAvatar(){try{const j=await api('/api/profile/avatar',{method:'DELETE'});me.profile.avatar=j.avatar||'';toast('تم حذف الصورة');openSettings()}catch(e){toast(e.message)}}
async function logout(){try{await api('/api/logout',{method:'POST'})}catch{}localStorage.removeItem('rimaz_sid');sid='';socket?.disconnect();login()}
function emojiPicker(target){document.querySelector('.emojiModal')?.remove();const box=document.createElement('div');box.className='emojiModal';box.innerHTML='<div class="emojiHead"><b>الإيموجي</b><button type="button" id="emojiClose">×</button></div><div class="emojiGrid"></div>';document.querySelector('.chat').appendChild(box);const grid=box.querySelector('.emojiGrid');EMOJIS.forEach(e=>{const b=document.createElement('button');b.type='button';b.textContent=e;b.addEventListener('click',()=>pickEmoji(e,target));grid.appendChild(b)});box.querySelector('#emojiClose').addEventListener('click',()=>box.remove())}
function pickEmoji(e,target){if(target==='public'){const i=document.getElementById('msgInput');i.value+=e;i.focus()}else if(target==='private'){const i=document.getElementById('privateText');if(i){i.value+=e;i.focus()}}else{const i=document.getElementById('wallText');if(i){i.value+=e;i.focus()}}document.querySelector('.emojiModal')?.remove()}
function updateMeBadges(){document.getElementById('onlineCount')?.setAttribute('title',`إعجاباتك: ${me.likes}`)}
function updatePrivateButton(){const n=Object.values(privateUnread).reduce((a,b)=>a+(Number(b)||0),0);const b=document.querySelector('.bottom button:nth-child(4)');if(b)b.innerHTML=`💬 خاص${n?` <span class="unreadBadge">${n}</span>`:''}`}
function notifyCount(){return notifications.length?` (${notifications.length})`:''}
function jsq(s){return JSON.stringify(String(s)).replace(/</g,'\u003c')}
function adminUserRows(a){return a.map(u=>{const canGrant=me.owner||me.role==='admin';const canReset=me.owner;const canVip=me.owner||me.role==='admin';const canRole=me.owner||me.role==='admin';return `<div class="adminUser"><div><b>${esc(u.name)}</b> ${u.vip?'👑VIP':''}<br><small>${u.likes} إعجاب · مستوى ${u.level} · ${esc(u.role||'member')}</small></div><button ${canGrant?'':'disabled'} onclick="grantLike(${jsq(u.name)},10)">+10</button><button ${canReset?'':'disabled'} class="red" onclick="resetLikes(${jsq(u.name)})">تصفير</button><button onclick="memberAdminMenu(${jsq(u.name)})">إجراءات</button>${canVip?`<button onclick="grantVip(${jsq(u.name)})">VIP</button>`:''}</div>`}).join('')}
function memberAdminMenu(n){const owner=!!me.owner,admin=me.role==='admin'||owner;let html=`<div class="adminCard"><h3>${esc(n)}</h3><div class="adminGrid"><button onclick="modUser('kick',${jsq(n)})">طرد</button><button onclick="modUser('ban',${jsq(n)})">حظر</button><button onclick="modUser('mute',${jsq(n)})">كتم</button><button onclick="sendGift(${jsq(n)})">هدية</button>${admin?`<button onclick="grantLike(${jsq(n)},10)">زيادة لايكات</button>`:''}${owner?`<button class="red" onclick="resetLikes(${jsq(n)})">تصفير لايكات</button><button onclick="setRole(${jsq(n)},'admin')">إعطاء إداري</button>`:''}${admin?`<button onclick="setRole(${jsq(n)},'super')">إعطاء سوبر</button><button onclick="setRole(${jsq(n)},'banner')">إعطاء بنر</button><button onclick="grantVip(${jsq(n)})">هدية VIP</button>`:''}</div></div>`;const body=document.getElementById('adminBody');if(body)body.insertAdjacentHTML('afterbegin',html);else layer(`<div class="overlay">${head('إدارة العضو: '+n)}<div class="overlayBody adminPanel">${html}</div></div>`,'memberAdmin') }

async function openAdmin(){try{const d=await api('/api/admin/data');layer(`<div class="overlay admin">${head('لوحة الإدارة — '+(me.owner?'المالك':'الإداري'))}<div class="tabs"><button class="active" onclick="adminTab('users')">الأعضاء</button><button onclick="adminTab('rooms')">الغرف</button><button onclick="adminTab('tools')">التحكم</button></div><div id="adminBody" class="overlayBody adminPanel">${adminUsers(d.users)}</div></div>`,'admin')}catch(e){toast(e.message)}}
function adminUsers(a){return `<div class="adminCard"><h3>إدارة الإعجابات</h3><div class="adminGrid"><input id="grantName" placeholder="اسم العضو"><input id="grantAmount" type="number" value="1"><button onclick="grantLike(grantName.value,grantAmount.value)">منح إعجاب</button><button onclick="resetLikes(grantName.value)">تصفير</button></div></div><div class="adminCard"><h3>الأعضاء</h3>${adminUserRows(a)}</div>`}
async function modUser(action,n){try{await api('/api/admin/member-action',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n,action,room:currentRoom||'public'})});toast(action==='kick'?'تم الطرد، ويمكنه العودة مباشرة':action==='ban'?'تم الحظر لمدة 15 دقيقة':action==='mute'?'تم الكتم':'تم التنفيذ');openAdmin()}catch(e){toast(e.message)}}
async function sendGift(n){const gift=prompt('اختر الهدية: درع أسود\nدرع أبيض\nدرع فضي\nوردة','وردة');if(!gift)return;try{await api('/api/admin/gift',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n,gift})});toast('تم إرسال الهدية')}catch(e){toast(e.message)}}
async function grantVip(n){try{await api('/api/admin/gift-vip',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n})});toast('تم منح VIP لمدة 24 ساعة');openAdmin()}catch(e){toast(e.message)}}
async function setRole(n,role){try{await api('/api/admin/role',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n,role})});toast('تم تحديث الصلاحية');openAdmin()}catch(e){toast(e.message)}}
async function adminTab(t){const d=await api('/api/admin/data');const b=document.getElementById('adminBody');if(t==='users')b.innerHTML=adminUsers(d.users);else if(t==='rooms')b.innerHTML=`<div class="adminCard"><h3>إنشاء غرفة</h3><div class="adminGrid"><input id="rn" placeholder="اسم الغرفة"><input id="rc" type="number" value="50"><select id="rk"><option value="public">عامة</option><option value="private">خاصة</option><option value="voice">مايك</option></select><button onclick="createRoom()">إنشاء</button></div></div>${d.rooms.map(r=>`<div class="adminUser"><div><b>${esc(r.name)}</b><br><small>${r.online||0}/${r.capacity}</small></div><button onclick="toast('الغرف الأساسية محمية')">تحكم</button><button class="red" onclick="deleteRoom('${r.id}')">حذف</button></div>`).join('')}`;else b.innerHTML=`<div class="adminCard"><h3>إعلان عام</h3><textarea id="broadcastText" style="width:100%;min-height:80px"></textarea><button class="plain" onclick="broadcast()">إرسال للجميع</button></div><div class="adminCard"><h3>تحكم بالعضو</h3><div class="adminGrid"><input id="modName" placeholder="اسم العضو"><input id="modRoom" value="public"><button onclick="modAction('mute')">كتم</button><button onclick="modAction('ban')">حظر</button><button onclick="modAction('unban')">رفع الحظر</button><button onclick="modAction('kick')">طرد</button></div></div><div class="adminCard"><h3>صلاحيات المالك</h3><p>الادمن <b>admin</b> هو مالك الموقع وصلاحياته كاملة ولا تعتمد على عدد الإعجابات.</p><p>400 إعجاب = التنبيهات. 500 = صورة وفيديو وصوت + اتصال صوتي + اتصال كام.</p></div>`}
async function grantLike(n,a){try{const j=await api('/api/admin/grant-like',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n,amount:Number(a)})});toast('تمت إضافة الإعجابات: '+j.likes);openAdmin()}catch(e){toast(e.message)}}
async function resetLikes(n){try{await api('/api/admin/reset-likes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n})});toast('تم التصفير');openAdmin()}catch(e){toast(e.message)}}
async function createRoom(){try{await api('/api/admin/room',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:rn.value,capacity:rc.value,kind:rk.value})});toast('تم إنشاء الغرفة');adminTab('rooms')}catch(e){toast(e.message)}}
async function deleteRoom(id){try{await api('/api/admin/room/'+id,{method:'DELETE'});adminTab('rooms')}catch(e){toast(e.message)}}
async function modAction(action){try{await api('/api/admin/'+action,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:modName.value,room:modRoom.value})});toast('تم تنفيذ الأمر');}catch(e){toast(e.message)}}
async function broadcast(){try{await api('/api/admin/broadcast',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:broadcastText.value})});toast('تم الإرسال')}catch(e){toast(e.message)}}
function callChoice(){if(!privateTo)return toast('اختر عضوًا أولًا');const layerEl=document.getElementById('layer');if(!layerEl)return;layerEl.insertAdjacentHTML('beforeend',`<div class="callChoice" id="callChoice"><div class="callChoiceBox"><h3>اختر نوع الاتصال</h3><button onclick="document.getElementById('callChoice')?.remove();startCall(false)">☎ اتصال صوتي</button><button onclick="document.getElementById('callChoice')?.remove();startCall(true)">📹 اتصال كام</button><button class="cancel" onclick="document.getElementById('callChoice')?.remove()">إلغاء</button></div></div>`)}
let pc=null,localStream=null,callMode='voice';
async function startCall(camera){if(me.likes<500&&!me.admin)return toast('الاتصال يفتح عند 500 إعجاب');callMode=camera?'camera':'voice';pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});localStream=await navigator.mediaDevices.getUserMedia(camera?{audio:true,video:true}:{audio:true});localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));showCall(camera);pc.onicecandidate=e=>e.candidate&&socket.emit('ice',{to:privateTo,candidate:e.candidate});pc.ontrack=e=>{const v=document.getElementById('remoteVideo');if(v)v.srcObject=e.streams[0]};const offer=await pc.createOffer();await pc.setLocalDescription(offer);socket.emit('call-offer',{to:privateTo,offer,video:camera})}
function showCall(camera){document.getElementById('layer').insertAdjacentHTML('beforeend',`<div class="call"><video id="remoteVideo" autoplay playsinline></video><div class="callBar"><button onclick="endCall()">إنهاء</button><button class="ok" onclick="toast('${camera?'كاميرا':'صوت'}')">${camera?'📹 اتصال كام':'☎ اتصال'}</button></div></div>`)}
async function handleOffer(d){if(key(d.from||d.to)!==key(privateTo))return;if(me.likes<500&&!me.admin)return;pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});pc.onicecandidate=e=>e.candidate&&socket.emit('ice',{to:d.from,candidate:e.candidate});pc.ontrack=e=>{const v=document.getElementById('remoteVideo');if(v)v.srcObject=e.streams[0]};localStream=await navigator.mediaDevices.getUserMedia(d.video?{audio:true,video:true}:{audio:true});localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));await pc.setRemoteDescription(d.offer);const ans=await pc.createAnswer();await pc.setLocalDescription(ans);socket.emit('call-answer',{to:d.from,answer:ans,video:d.video});showCall(!!d.video)}
async function handleAnswer(d){if(!pc)return;await pc.setRemoteDescription(d.answer)}
async function handleIce(d){try{await pc?.addIceCandidate(d.candidate)}catch{}}
function endCall(){localStream?.getTracks().forEach(t=>t.stop());pc?.close();pc=null;document.querySelector('.call')?.remove()}
window.addEventListener('beforeunload',()=>socket?.disconnect());
sid='';localStorage.removeItem('rimaz_sid');login();
</script>
