<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>دردشة ريماز عراقية</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Tahoma,Arial;background:#eee;color:#222}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0}.app{height:100dvh;max-width:720px;margin:auto;background:white;display:flex;flex-direction:column;overflow:hidden;position:relative}.top{height:40px;background:#222;color:#fff;display:flex;align-items:center;gap:8px;padding:0 8px;flex-shrink:0}.top button{background:transparent;color:white;font-size:18px}.title{flex:1;text-align:center;font-size:13px;font-weight:bold}.sub{height:25px;background:#101010;color:white;display:flex;align-items:center;justify-content:space-between;padding:0 7px;font-size:10px}.main{display:flex;flex:1;min-height:0}.members{width:36%;max-width:205px;min-width:118px;overflow:auto;background:#f7f7f7;border-left:1px solid #aaa}.member{display:flex;gap:4px;padding:4px;border-bottom:1px solid #ddd;font-size:10px;min-height:49px}.avatar{width:31px;height:36px;object-fit:cover;background:#e7d7c5;border:1px solid #aaa}.mname{font-weight:bold}.likes{color:#d22;font-size:9px;margin-top:2px}.tiny{background:#222;color:#fff;padding:3px 5px;font-size:9px;margin-top:3px}.chat{flex:1;min-width:0;display:flex;flex-direction:column}.feed{flex:1;overflow:auto;background:#fffaf2;padding:4px}.msg{display:flex;gap:5px;padding:3px 0;border-bottom:1px dotted #ddd;font-size:12px;line-height:1.5}.msg img{width:30px;height:34px;object-fit:cover}.who{font-weight:bold;background:#f1e4d5;padding:0 3px}.system{text-align:center;color:#666;font-size:10px;padding:4px}.composer{display:flex;gap:3px;padding:4px;background:#191919}.composer input{flex:1;min-width:0;height:29px;padding:4px;font-size:12px}.sq,.send{height:29px;width:29px;background:#333;color:white}.send{background:#111}.bottom{height:39px;background:#171717;display:flex;flex-shrink:0}.bottom button{flex:1;background:transparent;color:white;border-left:1px solid #333;font-size:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}.ico{font-size:15px}.bottom .active{background:#444;color:#ffd35d}.badge{background:#e22;border-radius:10px;padding:0 4px}.overlay{position:absolute;inset:40px 0 39px;background:#0007;display:flex;align-items:center;justify-content:center;padding:16px;z-index:4}.panel{width:min(420px,100%);max-height:90%;overflow:auto;background:white;border:1px solid #888;box-shadow:0 4px 16px #0005}.ph{height:34px;background:#191919;color:white;display:flex;align-items:center;padding:0 8px;font-size:13px;font-weight:bold}.ph span{flex:1}.close{background:#d33;color:white;width:25px;height:25px}.pb{padding:10px;font-size:12px}.pb label{display:block;margin:7px 0 3px}.pb input:not([type=checkbox]),.pb textarea,.pb select{width:100%;padding:6px;border:1px solid #bbb}.green{background:#278f49;color:white;padding:7px 12px;margin-top:8px}.row{display:flex;gap:5px;flex-wrap:wrap}.row button{background:#222;color:white;padding:7px;font-size:11px}.post{padding:8px 2px;border-bottom:1px solid #ddd}.post strong{background:#f1e4d5}.login{position:absolute;inset:0;z-index:10;background:#f4f4f4;display:flex;align-items:center;justify-content:center;padding:18px}.loginbox{width:100%;max-width:390px;background:white;border:1px solid #aaa}.loginhead{background:#222;color:white;text-align:center;padding:12px;font-weight:bold}.inner{padding:14px}.inner input{width:100%;padding:10px;margin:5px 0;border:1px solid #bbb}.inner button{width:100%;padding:10px;margin-top:6px;background:#248d4b;color:white}.inner .guest{background:#333}.note{text-align:center;font-size:10px;color:#777;margin-top:8px}[hidden]{display:none!important}
</style></head><body><div class="app"><header class="top"><button id="menu">☰</button><button id="back">‹</button><div class="title" id="roomTitle">دردشة ريماز عراقية</div><button id="share">↗</button><button id="x">×</button></header><div class="sub"><span>● متصل</span><span id="roomInfo">الغرفة العامة</span><span id="count">👥 1</span></div><main class="main"><aside class="members" id="members"></aside><section class="chat"><div class="feed" id="feed"></div><div class="composer"><button class="sq" id="exit">↪</button><button class="sq" id="emoji">☺</button><input id="msg" placeholder="اكتب رسالتك هنا"><button class="send" id="send">➤</button></div></section></main><nav class="bottom"><button data-panel="members" class="active"><span class="ico">♟</span><span id="membersLabel">1 الموجودين</span></button><button data-panel="private"><span class="ico">▣</span><span>خاص <b id="badge" class="badge" hidden>0</b></span></button><button data-panel="rooms"><span class="ico">♧</span><span>الغرف</span></button><button data-panel="wall"><span class="ico">▤</span><span>الحائط</span></button><button data-panel="settings"><span class="ico">⚙</span><span>الضبط</span></button></nav><div id="overlay" class="overlay" hidden><section class="panel"><div class="ph"><span id="pt">الضبط</span><button class="close" id="close">×</button></div><div class="pb" id="pb"></div></section></div><div class="login" id="login"><div class="loginbox"><div class="loginhead">دردشة ريماز عراقية</div><div class="inner"><label>اسم المستخدم</label><input id="name" placeholder="اكتب اسمك"><label>كلمة المرور</label><input id="pass" type="password" placeholder="اختياري للزائر"><button id="enter">دخول الدردشة</button><button class="guest" id="guest">دخول كزائر</button><button id="register">تسجيل عضو جديد</button><div class="note">دردشة عربية للهاتف والكمبيوتر</div></div></div></div></div>
<script src="/socket.io/socket.io.js"></script><script>
(()=>{const $=x=>document.getElementById(x);let me=null,socket=window.io?io():null,room='الغرفة العامة',privateOpen=true,noticesOpen=true,lastLike=0,likeCount=0;const av='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="60" height="70"><rect width="60" height="70" fill="#e7d7c5"/><circle cx="30" cy="23" r="13" fill="#a58b73"/><path d="M7 70Q8 40 30 42Q52 40 53 70" fill="#786451"/></svg>');function esc(s){return String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function sys(t){let d=document.createElement('div');d.className='system';d.textContent=t;$('feed').append(d);$('feed').scrollTop=$('feed').scrollHeight}function message(m){let d=document.createElement('div');d.className='msg';d.innerHTML=`<img src="${m.avatar||av}"><div><span class="who">${esc(m.name)}</span> ${esc(m.text)}</div>`;$('feed').append(d);$('feed').scrollTop=$('feed').scrollHeight}function draw(list){$('members').innerHTML='';list.forEach(u=>{let d=document.createElement('div');d.className='member';d.innerHTML=`<img class="avatar" src="${u.avatar||av}"><div><div class="mname">${esc(u.name)}</div><div class="likes">❤️ ${u.likes||0}　🟢 ${esc(u.status||'متصل')}</div>${me?`<button class="tiny" data-private="${esc(u.id)}" data-name="${esc(u.name)}">خاص</button> <button class="tiny" data-like="${esc(u.id)}">❤️</button>`:'<small>تصفح فقط</small>'}</div>`;$('members').append(d)});$('count').textContent='👥 '+list.length;$('membersLabel').textContent=list.length+' الموجودين'}function panel(title,html){$('pt').textContent=title;$('pb').innerHTML=html;$('overlay').hidden=false}function open(n){document.querySelectorAll('.bottom button').forEach(b=>b.classList.toggle('active',b.dataset.panel===n));if(n==='settings')panel('الضبط',`<label>الزخرفة</label><input value="✿"><label>الحالة</label><input value="متصل"><label>لون الاسم</label><input type="color" value="#222222"><label>لون الخط</label><input type="color" value="#222222"><label>لون الخلفية</label><input id="bg" type="color" value="#fffaf2"><label>حجم الخط</label><select id="fs"><option>12</option><option>14</option><option>16</option><option>18</option></select><label>جودة المايك</label><select><option>متوسطة</option><option>عالية</option><option>منخفضة</option></select><div class="row"><button id="changeAvatar">تغيير الصورة (بعد 10 إعجابات)</button><button id="deleteAvatar">حذف الصورة</button></div><p><label><input id="privToggle" type="checkbox" ${privateOpen?'checked':''}> فتح المحادثات الخاصة</label><label><input id="notToggle" type="checkbox" ${noticesOpen?'checked':''}> فتح التنبيهات</label></p><button class="green" id="save">حفظ</button> <button class="green" id="logout" style="background:#444">تسجيل الخروج</button>`);else if(n==='wall')panel('الحائط',`<div class="post"><strong>ريماز عراقية</strong><p>أهلاً وسهلاً بكم في الدردشة ❤️</p><button>❤️ إعجاب</button> <button>💬 تعليق</button></div><label>اكتب منشورك</label><textarea id="walltext" rows="3"></textarea><button class="green" id="post">نشر</button>`);else if(n==='rooms')panel('الغرف',`<div class="row"><button data-room="الغرفة العامة">الغرفة العامة</button><button data-room="غرفة الأصدقاء">غرفة الأصدقاء</button><button data-room="غرفة المايك">غرفة المايك 🎙</button></div><p>الغرفة العامة للكتابة فقط، وغرفة المايك مخصصة للصوت.</p>`);else if(n==='private')panel('الخاص',privateOpen?'<p>اختر شخصًا من قائمة الموجودين لبدء محادثة خاصة.</p><button id="disablePrivate">إغلاق الخاص</button>':'<p>أنت أغلقت المحادثات الخاصة.</p>');else panel('المتواجدين في الدردشة',$('members').innerHTML)}function enter(name,register=false){if(!socket){alert('الاتصال بالخادم غير متوفر حالياً');return}socket.emit('auth:join',{name,password:$('pass').value,register})}function send(){if(!me){alert('تصفح فقط — سجّل الدخول حتى ترسل رسالة');return}let t=$('msg').value.trim();if(!t)return;socket?.emit('chat:message',{text:t,room});$('msg').value=''}$('enter').onclick=()=>{let n=$('name').value.trim();if(n)enter(n,false);else alert('اكتب اسم المستخدم')};$('guest').onclick=()=>{let n=$('name').value.trim()||('زائر'+Math.floor(Math.random()*99999));$('pass').value='';enter(n,false)};$('register').onclick=()=>{let n=$('name').value.trim();if(!n||!$('pass').value){alert('اكتب الاسم وكلمة المرور');return}enter(n,true)};$('send').onclick=send;$('msg').onkeydown=e=>{if(e.key==='Enter')send()};$('emoji').onclick=()=>{$('msg').value+=' 😊';$('msg').focus()};$('exit').onclick=()=>{if(!me){alert('أنت تتصفح فقط');return}socket?.emit('room:join','الغرفة العامة');room='الغرفة العامة';$('roomTitle').textContent=room;$('roomInfo').textContent=room};$('back').onclick=$('x').onclick=()=>$('overlay').hidden=true;$('close').onclick=()=>$('overlay').hidden=true;$('menu').onclick=()=>open('members');$('share').onclick=()=>alert('مشاركة رابط الدردشة');document.querySelectorAll('.bottom button').forEach(b=>b.onclick=()=>open(b.dataset.panel));$('members').onclick=e=>{if(!me){alert('قائمة الموجودين للتصفح فقط قبل الدخول');return}let p=e.target.closest('[data-private]'),l=e.target.closest('[data-like]');if(p){if(!privateOpen){alert('أنت أغلقت الخاص من الإعدادات');return}window.privateTarget=p.dataset.private;panel('محادثة خاصة مع '+p.dataset.name,`<div id="pf" style="height:150px;overflow:auto;background:#fffaf2"></div><div class="composer"><button class="sq" id="call">☎</button><button class="sq" id="pe">☺</button><input id="pi" placeholder="اكتب رسالتك هنا"><button class="send" id="ps">➤</button></div><p>400 إعجاب للتنبيهات · 500 إعجاب للصور والفيديو والاتصال</p>`)}if(l){socket?.emit('user:like',l.dataset.like)}};if(socket){socket.on('members',draw);socket.on('system',sys);socket.on('chat:message',m=>{if(m.room===room)message(m)});socket.on('app:error',t=>alert(t));socket.on('auth:ok',u=>{me=u;$('login').hidden=true;sys('هذا المستخدم قد دخل الغرفة');socket.emit('browse:members')});socket.on('user:liked',d=>{if(me&&me.likes>=400)alert('وصلك إعجاب من '+d.from)});socket.on('private:message',d=>{if(me&&me.noticesOpen)alert('رسالة خاصة من '+d.from+': '+d.text)});socket.on('wall:post',d=>{if($('overlay').hidden===false&&$('pt').textContent==='الحائط'){let el=document.createElement('div');el.className='post';el.textContent=d.name+': '+d.text;$('pb').prepend(el)}})}
$('overlay').addEventListener('change',e=>{if(e.target.id==='privToggle')privateOpen=e.target.checked;if(e.target.id==='notToggle')noticesOpen=e.target.checked});$('overlay').onclick=e=>{if(e.target.dataset.room){room=e.target.dataset.room;$('roomTitle').textContent=room;$('roomInfo').textContent=room;socket?.emit('room:join',room);$('overlay').hidden=true;sys('انتقلت إلى '+room)}if(e.target.id==='save'){if($('fs'))$('feed').style.fontSize=$('fs').value+'px';if($('bg'))$('feed').style.background=$('bg').value;alert('تم حفظ الإعدادات')}if(e.target.id==='logout'){location.reload()}if(e.target.id==='disablePrivate'){privateOpen=false;panel('الخاص','<p>تم إغلاق الخاص من الإعدادات.</p>')}if(e.target.id==='changeAvatar'){if((me?.likes||0)<10){alert('تغيير الصورة متاح بعد 10 إعجابات');return}let i=document.createElement('input');i.type='file';i.accept='image/*';i.onchange=()=>{let f=i.files[0];if(f){me.avatar=URL.createObjectURL(f);draw([me])}};i.click()}if(e.target.id==='deleteAvatar'){if(me)me.avatar=av;alert('تم حذف الصورة')}if(e.target.id==='post'){let t=$('walltext').value.trim();if(t){let d=document.createElement('div');d.className='post';d.innerHTML='<strong>'+esc(me?.name||'زائر')+'</strong><p>'+esc(t)+'</p><button>❤️ إعجاب</button> <button>💬 تعليق</button>';$('pb').prepend(d)}}if(e.target.id==='call'){if((me?.likes||0)<500)alert('الاتصال الصوتي والكاميرا متاحان بعد 500 إعجاب');else panel('نوع الاتصال','<div class="row"><button>☎ اتصال صوتي</button><button>📹 اتصال كاميرا</button></div>')}if(e.target.id==='ps'){let t=$('pi').value.trim();if(t&&me){socket?.emit('private:message',{targetId:window.privateTarget,text:t});let d=document.createElement('p');d.textContent='أنا: '+t;$('pf').append(d);$('pi').value=''}}if(e.target.id==='pe')$('pi').value+=' 😊'};
})();</script></body></html>
