<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>دردشة ريماز عراقية</title>
<script src="/socket.io/socket.io.js"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;font-family:Tahoma,Arial,sans-serif;background:#fff;color:#222}
button,input,textarea{font:inherit}
button{cursor:pointer}
#app{min-height:100vh}
.auth{max-width:420px;margin:0 auto;padding:25px 14px}
.auth h1{text-align:center;margin:10px 0 20px;font-size:24px}
.auth-section{border:1px solid #ccc;padding:15px;margin-bottom:12px;background:#fff}
.auth-section h2{font-size:18px;margin:0 0 10px}
input,textarea,select{width:100%;padding:10px;border:1px solid #bbb;border-radius:5px;margin:5px 0;background:#fff}
button{padding:9px 13px;border:1px solid #777;border-radius:5px;background:#eee}
.primary{background:#222;color:#fff;border-color:#222}
.danger{background:#b22;color:#fff;border-color:#b22}
.error{background:#fff0f0;border:1px solid #d66;padding:9px;margin:8px 0;display:none}
.page{max-width:1000px;margin:auto}
.top{border-bottom:1px solid #ccc;padding:10px;display:flex;align-items:center;gap:8px;position:sticky;top:0;background:#fff;z-index:10}
.top .brand{font-weight:bold;margin-left:auto}
.top .user{font-size:14px}
.nav{display:flex;gap:5px;overflow:auto}
.nav button{white-space:nowrap}
.content{padding:10px;padding-bottom:80px}
.room-bar{display:flex;gap:6px;overflow:auto;padding-bottom:8px}
.room-btn{white-space:nowrap}
.room-btn.active{background:#222;color:#fff}
.chat{border:1px solid #ccc}
.chat-head{padding:10px;border-bottom:1px solid #ccc;font-weight:bold}
.messages{height:calc(100vh - 245px);min-height:320px;overflow:auto;padding:10px;background:#fafafa}
.message{margin:7px 0;padding:8px;background:#fff;border:1px solid #ddd;border-radius:5px}
.message .name{font-weight:bold;font-size:13px}
.message .time{font-size:11px;color:#777;margin-top:3px}
.compose{display:flex;gap:5px;padding:8px;border-top:1px solid #ccc;position:sticky;bottom:0;background:#fff}
.compose input{margin:0;flex:1}
.compose button{white-space:nowrap}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ccc;padding:7px;display:flex;gap:5px;justify-content:center;z-index:20}
.bottom button{flex:1;max-width:150px}
.panel{border:1px solid #ccc;padding:12px;margin-bottom:10px;background:#fff}
.item{border-bottom:1px solid #ddd;padding:10px 0}
.item:last-child{border-bottom:0}
.muted{color:#777;font-size:13px}
.row{display:flex;gap:7px;align-items:center}
.row>*{flex:1}
.modal{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;z-index:50}
.modal.open{display:flex}
.modal-box{background:#fff;width:100%;max-height:85vh;overflow:auto;padding:15px;border-radius:10px 10px 0 0}
.close{float:left}
@media(min-width:700px){
 .content{padding-bottom:20px}
 .bottom{position:static;border-top:0;justify-content:flex-start;padding:10px}
 .bottom button{flex:0 0 auto}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal" class="modal"><div class="modal-box" id="modalBox"></div></div>

<script>
"use strict";

let sid=localStorage.getItem("rimaz_sid")||"";
let me=null;
let socket=null;
let currentRoom="الغرفة العامة";
let privateTarget="";
let rooms=[];

const app=document.getElementById("app");
const modalEl=document.getElementById("modal");
const modalBox=document.getElementById("modalBox");

async function api(url,options={}){
  const headers={...(options.headers||{})};
  if(sid) headers["x-session"]=sid;
  const response=await fetch(url,{...options,headers});
  const data=await response.json().catch(()=>({}));
  if(!response.ok) throw new Error(data.error||("HTTP "+response.status));
  return data;
}

function esc(value){
  return String(value??"").replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

function showError(id,message){
  const el=document.getElementById(id);
  if(el){el.textContent=message;el.style.display="block";}
}

function hideError(id){
  const el=document.getElementById(id);
  if(el)el.style.display="none";
}

function auth(){
  app.innerHTML=`
  <main class="auth">
    <h1>دردشة ريماز عراقية</h1>
    <div id="authError" class="error"></div>

    <section class="auth-section">
      <h2>دخول عضو مسجل</h2>
      <input id="loginName" placeholder="الاسم">
      <input id="loginPass" type="password" placeholder="كلمة المرور">
      <button class="primary" style="width:100%" onclick="loginMember()">دخول</button>
    </section>

    <section class="auth-section">
      <h2>تسجيل حساب جديد</h2>
      <input id="registerName" placeholder="الاسم">
      <input id="registerPass" type="password" placeholder="كلمة المرور">
      <button style="width:100%" onclick="registerMember()">تسجيل</button>
    </section>

    <section class="auth-section">
      <h2>دخول زائر</h2>
      <input id="guestName" placeholder="اسم الزائر">
      <button style="width:100%" onclick="loginGuest()">دخول زائر</button>
    </section>
  </main>`;
}

async function registerMember(){
  hideError("authError");
  try{
    const name=document.getElementById("registerName").value.trim();
    const password=document.getElementById("registerPass").value;
    const data=await api("/api/register",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({name,password})
    });
    await enterWithSession(data.sid);
  }catch(e){showError("authError",e.message);}
}

async function loginMember(){
  hideError("authError");
  try{
    const name=document.getElementById("loginName").value.trim();
    const password=document.getElementById("loginPass").value;
    const data=await api("/api/login",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({name,password})
    });
    await enterWithSession(data.sid);
  }catch(e){showError("authError",e.message);}
}

async function loginGuest(){
  hideError("authError");
  try{
    const name=document.getElementById("guestName").value.trim();
    const data=await api("/api/guest",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({name})
    });
    await enterWithSession(data.sid);
  }catch(e){showError("authError",e.message);}
}

async function enterWithSession(newSid){
  if(!newSid) throw new Error("لم يتم إنشاء جلسة الدخول");
  sid=newSid;
  localStorage.setItem("rimaz_sid",sid);
  const state=await api("/api/state");
  if(!state.user) throw new Error("تعذر إنشاء جلسة الدخول");
  me=state.user;
  await loadRooms();
  renderChat();
}

async function start(){
  if(!sid){auth();return;}
  try{
    const state=await api("/api/state");
    if(!state.user){
      localStorage.removeItem("rimaz_sid");
      sid="";
      auth();
      return;
    }
    me=state.user;
    await loadRooms();
    renderChat();
  }catch(e){
    localStorage.removeItem("rimaz_sid");
    sid="";
    me=null;
    auth();
  }
}

async function loadRooms(){
  const data=await api("/api/rooms");
  rooms=data;
  if(!rooms.some(r=>r.name===currentRoom)) currentRoom="الغرفة العامة";
}

function top(){
  return `<header class="top">
    <div class="brand">دردشة ريماز عراقية</div>
    <div class="user">${esc(me.name)} — ${me.type==="guest"?"زائر":"عضو"} — ${me.likes||0} إعجاب</div>
    <button onclick="account()">الحساب</button>
    <button onclick="settings()">الضبط</button>
    <button onclick="logout()">خروج</button>
  </header>`;
}

function bottom(){
  return `<nav class="bottom">
    <button onclick="settings()">الضبط</button>
    <button onclick="wall()">الحائط</button>
    <button onclick="roomsPanel()">الغرف</button>
    <button onclick="privatePanel()">الخاص</button>
    <button onclick="people()">المتواجدين</button>
    <button onclick="account()">الحساب</button>
    <button onclick="leaveRoom()">خروج من الغرفة</button>
  </nav>`;
}

function renderChat(){
  app.innerHTML=`<div class="page">${top()}<div class="content">
    <div class="room-bar" id="roomBar"></div>
    <section class="chat">
      <div class="chat-head" id="chatHead">${esc(currentRoom)}</div>
      <div class="messages" id="messages"></div>
      <div class="compose">
        <input id="messageInput" placeholder="اكتب رسالتك..." onkeydown="if(event.key==='Enter')sendMessage()">
        <button onclick="addEmoji('😊')">😊</button>
        <button class="primary" onclick="sendMessage()">إرسال</button>
      </div>
    </section>
  </div>${bottom()}</div>`;
  drawRoomBar();
  connectRoom();
}

function drawRoomBar(){
  const bar=document.getElementById("roomBar");
  if(!bar)return;
  bar.innerHTML=rooms.map(r=>`
    <button class="room-btn ${r.name===currentRoom?"active":""}" onclick="switchRoom(${JSON.stringify(r.name)})">
      ${esc(r.name)} (${r.online||0})
    </button>`).join("");
}

function connectRoom(){
  if(socket) socket.disconnect();
  socket=io();
  socket.on("connect",()=>{
    socket.emit("join",{sid,room:currentRoom});
  });
  socket.on("history",messages=>{
    const box=document.getElementById("messages");
    if(!box)return;
    box.innerHTML="";
    messages.forEach(addMessage);
    box.scrollTop=box.scrollHeight;
  });
  socket.on("message",message=>addMessage(message));
  socket.on("room-denied",data=>alert(data.message||"لا يمكن دخول الغرفة"));
  socket.on("room-error",data=>alert(data.message||"خطأ"));
  socket.on("room-kicked",data=>{
    alert(data.action==="ban"?"تم حظرك من الغرفة":"تم طردك من الغرفة");
    currentRoom="الغرفة العامة";
    renderChat();
  });
}

function addMessage(message){
  const box=document.getElementById("messages");
  if(!box)return;
  const nearBottom=(box.scrollHeight-box.scrollTop-box.clientHeight)<100;
  box.insertAdjacentHTML("beforeend",`
    <div class="message">
      <div class="name">${esc(message.name)}</div>
      <div>${esc(message.text)}</div>
      <div class="time">${new Date(message.time).toLocaleTimeString("ar-IQ",{hour:"2-digit",minute:"2-digit"})}</div>
    </div>`);
  if(nearBottom || message.name===me?.name) box.scrollTop=box.scrollHeight;
}

function sendMessage(){
  const input=document.getElementById("messageInput");
  if(!input||!socket)return;
  const text=input.value.trim();
  if(!text)return;
  socket.emit("message",{text});
  input.value="";
  input.focus();
}

function addEmoji(e){
  const input=document.getElementById("messageInput");
  if(input){input.value+=e;input.focus();}
}

async function switchRoom(name){
  currentRoom=name;
  if(socket) socket.disconnect();
  renderChat();
}

function leaveRoom(){
  if(socket)socket.emit("leave");
  currentRoom="الغرفة العامة";
  renderChat();
}

function openModal(html){
  modalBox.innerHTML=html;
  modalEl.classList.add("open");
}

function closeModal(){
  modalEl.classList.remove("open");
  modalBox.innerHTML="";
}

async function roomsPanel(){
  await loadRooms();
  openModal(`<button class="close" onclick="closeModal()">إغلاق</button><h2>الغرف</h2>
    ${rooms.map(r=>`<div class="item">
      <b>${esc(r.name)}</b><div class="muted">${esc(r.desc||"")}</div>
      <div>${r.online||0} متواجد / السعة ${r.capacity}</div>
      <button onclick="closeModal();switchRoom(${JSON.stringify(r.name)})">دخول</button>
    </div>`).join("")}`);
}

async function people(){
  try{
    const data=await api("/api/online");
    openModal(`<button class="close" onclick="closeModal()">إغلاق</button><h2>المتواجدون</h2>
      ${data.map(x=>`<div class="item">
        <b>${esc(x.name)}</b> — ${x.likes||0} إعجاب — مستوى ${x.level}
        <div class="muted">${esc(x.room||"خارج غرفة")}</div>
        <button onclick="closeModal();openPrivate(${JSON.stringify(x.name)})">خاص</button>
      </div>`).join("")}`);
  }catch(e){alert(e.message);}
}

function openPrivate(name){
  privateTarget=name;
  openModal(`<button class="close" onclick="closeModal()">رجوع</button>
    <h2>الخاص مع ${esc(name)}</h2>
    <div id="privateMessages" class="panel"></div>
    <div class="row">
      <input id="privateInput" placeholder="اكتب رسالة خاصة" onkeydown="if(event.key==='Enter')sendPrivate()">
      <button class="primary" onclick="sendPrivate()">إرسال</button>
    </div>
    <p class="muted">الوسائط والمكالمات تبقى مقفلة حتى 500 إعجاب حسب صلاحيات الموقع.</p>`);
}

function privatePanel(){people();}

function sendPrivate(){
  const input=document.getElementById("privateInput");
  if(!input||!socket||!privateTarget)return;
  const text=input.value.trim();
  if(!text)return;
  socket.emit("private",{to:privateTarget,text});
  const box=document.getElementById("privateMessages");
  if(box)box.insertAdjacentHTML("beforeend",`<div class="item"><b>أنت:</b> ${esc(text)}</div>`);
  input.value="";
}

async function wall(){
  try{
    const data=await api("/api/wall");
    openModal(`<button class="close" onclick="closeModal()">إغلاق</button><h2>الحائط</h2>
      <div class="panel">
        <textarea id="wallText" placeholder="اكتب منشورًا"></textarea>
        <button class="primary" onclick="postWall()">نشر</button>
      </div>
      ${data.map(p=>`<div class="item"><b>${esc(p.name)}</b><div>${esc(p.text)}</div></div>`).join("")}`);
  }catch(e){alert(e.message);}
}

async function postWall(){
  const text=document.getElementById("wallText")?.value.trim();
  if(!text)return;
  try{await api("/api/wall",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text})});wall();}
  catch(e){alert(e.message);}
}

async function settings(){
  try{
    const data=await api("/api/profile");
    const p=data.profile||{};
    openModal(`<button class="close" onclick="closeModal()">إغلاق</button><h2>الضبط</h2>
      <div class="panel">
        <b>الإعجابات:</b> ${data.likes||0}<br>
        <b>المستوى:</b> ${data.level||1}<br>
        <b>الصورة:</b> يمكن تغييرها بعد 10 إعجابات.
      </div>
      <div class="panel">
        <label>الحالة</label><input id="setStatus" value="${esc(p.status||"")}">
        <label>النبذة</label><textarea id="setBio">${esc(p.bio||"")}</textarea>
        <label>الصورة الرمزية</label><input id="setAvatar" value="${esc(p.avatar||"👤")}">
        <button class="primary" onclick="saveSettings()">حفظ</button>
      </div>`);
  }catch(e){alert(e.message);}
}

async function saveSettings(){
  try{
    await api("/api/profile",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({
      avatar:document.getElementById("setAvatar").value,
      status:document.getElementById("setStatus").value,
      bio:document.getElementById("setBio").value
    })});
    closeModal();
  }catch(e){alert(e.message);}
}

async function account(){
  try{
    const data=await api("/api/profile");
    openModal(`<button class="close" onclick="closeModal()">إغلاق</button><h2>الحساب</h2>
      <div class="panel"><b>الاسم:</b> ${esc(data.name)}<br>
      <b>النوع:</b> ${data.type==="guest"?"زائر":"عضو"}<br>
      <b>الإعجابات:</b> ${data.likes}<br>
      <b>المستوى:</b> ${data.level}<br>
      <b>الحالة:</b> ${esc(data.profile.status||"")}</div>`);
  }catch(e){alert(e.message);}
}

async function logout(){
  try{await api("/api/logout",{method:"POST"});}catch(e){}
  if(socket)socket.disconnect();
  sid="";me=null;
  localStorage.removeItem("rimaz_sid");
  auth();
}

start();
</script>
</body>
</html>
