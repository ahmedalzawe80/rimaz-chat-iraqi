<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>دردشة ريماز عراقية</title>
<script src="/socket.io/socket.io.js"></script>

<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;min-height:100%;font-family:Tahoma,Arial,sans-serif}
body{background:#f3f4f6;color:#222;overflow-x:hidden;padding-bottom:70px}
button,input,textarea,select{font:inherit}
button{cursor:pointer}

.black{background:#08090c;color:#fff;border:0;border-radius:5px;padding:9px 13px}
.purple{background:#7547e8;color:#fff;border:0;border-radius:6px;padding:9px 13px}
.red{background:#df5555;color:#fff;border:0;border-radius:5px;padding:9px 13px}
.green{background:#198754;color:#fff;border:0;border-radius:5px;padding:9px 13px}

.top{
  min-height:64px;background:#fff;border-bottom:1px solid #cfd2da;
  box-shadow:0 1px 5px #0001;display:flex;align-items:center;
  gap:10px;padding:7px 10px;position:sticky;top:0;z-index:30
}

.logo{
  flex:1;text-align:center;font-weight:900;font-size:21px;color:#171717
}
.logo span{color:#171717}

.user{font-weight:bold;display:flex;align-items:center;gap:7px}
.ava{
  width:38px;height:38px;border-radius:50%;display:grid;
  place-items:center;background:#e9e9ec;border:1px solid #ccc
}

.nav{display:flex;gap:4px;overflow:auto}
.nav button{
  border:0;background:#f7f7f8;padding:8px 9px;border-radius:6px;
  white-space:nowrap
}
.nav .on{background:#222;color:#fff}

.layout{
  max-width:1180px;margin:8px auto 12px;padding:0 6px;
  display:grid;grid-template-columns:220px minmax(0,1fr) 230px;gap:7px
}

.card{
  background:#fff;border:1px solid #c9ccd4;border-radius:7px;
  box-shadow:0 1px 4px #0001
}
.side{padding:7px}
.title{font-weight:900;font-size:16px;margin:3px 4px 8px}

.room{
  display:flex;align-items:center;gap:8px;background:#fafafa;
  border:1px solid #e1e2e6;border-radius:4px;padding:7px;
  margin:3px 0;min-height:52px
}
.room.active{background:#e7e7eb;color:#111;border-color:#bfc2c9}
.pic{
  width:35px;height:35px;border-radius:4px;background:#e3e3e6;
  display:grid;place-items:center;border:1px solid #d0d0d4
}
.count{font-size:11px;color:#444;margin-right:auto}
.muted{font-size:12px;color:#777}

.chat{
  min-height:650px;border-radius:7px;display:flex;
  flex-direction:column;overflow:hidden
}

.chathead{
  background:#fafafa;padding:9px;border-bottom:1px solid #cfd2da;
  display:flex;align-items:center;gap:7px
}
.chathead strong{font-size:16px;flex:1}

.tag{
  background:#e9e9ec;color:#222;border:1px solid #d2d3d8;
  padding:4px 7px;border-radius:5px;font-size:11px
}

.room-meta{
  display:flex;align-items:center;gap:5px;font-size:11px;color:#666;
  padding:5px 9px;background:#f1f1f3;border-bottom:1px solid #d0d1d6
}
.room-meta b{color:#222}
.room-meta .sep{color:#aaa}

.chat-actions{display:flex;gap:4px}
.chat-actions button{
  background:#090b1b;color:#fff;border:0;border-radius:4px;
  padding:6px 8px;font-size:11px
}

.messages{
  background:#fff;padding:10px;flex:1;min-height:48vh;
  max-height:calc(100vh - 250px);overflow:auto
}

.notice{
  background:#f0f0f2;color:#222;border:1px solid #d6d7dc;
  border-radius:5px;padding:8px;text-align:center;margin-bottom:8px
}

.msgline{
  display:flex;gap:7px;align-items:flex-start;margin:7px 0
}
.msgline .ava{flex:0 0 32px;width:32px;height:32px}
.msgbody{min-width:0;flex:1}
.bubble{
  display:inline-block;vertical-align:top;background:#f4f4f5;
  border:1px solid #d7d8dd;border-radius:5px;padding:7px 9px;
  max-width:90%;word-break:break-word
}
.name{font-weight:900;color:#222;font-size:13px}
.time{font-size:10px;color:#999;margin-right:5px}
.msgtools{display:inline-flex;gap:3px;margin-right:4px;vertical-align:top}
.msgtools button{
  border:1px solid #d2d3d7;background:#fff;border-radius:4px;
  padding:2px 5px;font-size:11px
}

.compose{
  display:flex;gap:4px;background:#f4f4f5;padding:7px;
  border-top:1px solid #cfd2da
}
.compose input{
  flex:1;min-width:0;border:1px solid #c9c5bc;
  border-radius:5px;padding:9px;background:#fff
}

.quickbar{
  display:flex;gap:4px;padding:5px 7px;background:#fff;
  border-top:1px solid #e1e2e5;overflow:auto
}
.quickbar button{
  border:1px solid #d2d3d8;background:#f7f7f8;
  border-radius:4px;padding:5px 9px;white-space:nowrap
}

.rooms-strip{
  display:grid;grid-template-columns:repeat(2,1fr);
  gap:5px;margin-bottom:7px
}
.rooms-strip .room{margin:0}

.bottom{
  position:fixed;bottom:0;left:0;right:0;background:#fff;
  border-top:1px solid #bfc2c9;box-shadow:0 -2px 8px #0001;
  display:flex;justify-content:center;gap:3px;padding:5px 6px;z-index:50
}
.bottom button{
  background:#08090c;color:#fff;border:1px solid #000;
  border-radius:4px;min-width:88px;padding:9px 10px;font-size:13px
}
.bottom button.active{background:#08090c}

.profile-card{
  display:grid;grid-template-columns:85px 1fr;gap:12px;
  align-items:center;background:#f7f7f8;border:1px solid #d4d5da;
  border-radius:6px;padding:12px;margin-bottom:10px
}
.profile-avatar{
  width:78px;height:78px;border-radius:50%;display:grid;
  place-items:center;background:#ececef;border:2px solid #bfc2c9;
  font-size:38px
}
.statrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.stat{
  background:#fff;border:1px solid #d4d5da;border-radius:4px;
  padding:7px 10px;font-size:12px
}
.stat b{font-size:15px}

.member-row{
  display:grid;grid-template-columns:42px 1fr auto;gap:9px;
  align-items:center;padding:9px 5px;border-bottom:1px solid #ececf0
}
.member-row .avatar{
  width:40px;height:40px;border-radius:50%;display:grid;
  place-items:center;background:#eee;border:1px solid #ccc;font-size:21px
}
.member-meta{min-width:0}
.member-meta b{display:block}
.member-meta small{color:#777}

.level{
  display:inline-block;background:#090b1b;color:#fff;border-radius:3px;
  padding:2px 5px;font-size:10px;margin-right:4px
}
.like-btn{
  background:#fff;border:1px solid #bbb;border-radius:4px;
  padding:7px 10px;font-weight:700
}
.like-btn.locked{opacity:.55}
.like-count{color:#b33a65;font-weight:900}

.rank-panel{
  background:#f7f7f8;border:1px solid #d4d5da;border-radius:6px;
  padding:10px;margin:9px 0
}
.rank-title{font-weight:900;margin-bottom:6px}
.rank-progress{
  height:8px;background:#ddd;border-radius:99px;overflow:hidden
}
.rank-progress i{display:block;height:100%;background:#222}

.badge-row{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.badge{
  width:36px;height:36px;border-radius:9px;display:grid;
  place-items:center;border:1px solid #cfd2da;background:#f7f7f8;
  font-size:21px
}
.badge.locked{opacity:.32;filter:grayscale(1)}

.notice-list{max-height:430px;overflow:auto}
.notif{
  display:flex;gap:8px;padding:9px;border-bottom:1px solid #ececf0
}
.notif.unread{background:#f1edff}
.notif-icon{
  width:34px;height:34px;border-radius:50%;display:grid;
  place-items:center;background:#ececef
}
.notif-body{flex:1}
.notif-body small{display:block;color:#888;margin-top:3px}

.bell{position:relative}
.bell-count{
  position:absolute;top:-4px;left:-4px;background:#df5555;color:#fff;
  border-radius:99px;min-width:17px;height:17px;font-size:10px;
  display:grid;place-items:center
}

.admin-box{
  background:#fff8e8;border:1px solid #e6d29b;
  border-radius:5px;padding:8px;margin-top:10px
}

.profile-buttons{
  display:flex;gap:5px;flex-wrap:wrap;margin-top:8px
}
.profile-buttons button{flex:1;min-width:110px}

.room-admin{
  background:#f8f8fa;border:1px solid #d4d5da;
  border-radius:6px;padding:9px;margin-top:8px
}
.room-admin-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:6px
}
.room-admin-grid button{padding:8px}

.voice-stage{
  background:linear-gradient(#f4f4f6,#fff);
  border:1px solid #cfd2da;border-radius:7px;padding:10px
}
.voice-top{
  display:flex;gap:6px;align-items:center;margin-bottom:8px
}
.voice-top .tag{margin-right:auto}
.mic-grid{
  display:grid;grid-template-columns:repeat(4,1fr);gap:8px
}
.mic-seat{
  min-height:104px;background:#fff;border:1px solid #d0d2d8;
  border-radius:7px;display:grid;place-items:center;
  text-align:center;padding:7px
}
.mic-seat.on{border:2px solid #222;background:#f0f0f2}
.mic-avatar{
  width:48px;height:48px;border-radius:50%;
  background:#e6e7eb;display:grid;place-items:center;font-size:25px
}
.voice-controls{
  display:flex;gap:6px;flex-wrap:wrap;margin-top:9px
}
.voice-controls button{flex:1;min-width:110px}

.moderation-list{
  max-height:360px;overflow:auto;border:1px solid #ddd;border-radius:5px
}
.moderation-row{
  display:grid;grid-template-columns:1fr auto;gap:6px;
  padding:8px;border-bottom:1px solid #eee;align-items:center
}
.moderation-actions{display:flex;gap:4px;flex-wrap:wrap}
.moderation-actions button{font-size:10px;padding:5px}

.post{
  border:1px solid #ddd;border-radius:8px;padding:11px;margin:8px 0;
  background:#fff
}

.locked{opacity:.55}

.modal{
  position:fixed;inset:0;background:#0008;display:none;
  place-items:center;z-index:100
}
.modal.open{display:grid}
.box{
  width:min(560px,94vw);max-height:90vh;overflow:auto;
  background:#fff;border-radius:11px
}
.boxhead{
  background:#090b1b;color:#fff;padding:12px;font-size:19px;
  font-weight:bold;display:flex;justify-content:space-between
}
.boxbody{padding:13px}
.boxbody label{
  display:block;background:#090b1b;color:#fff;padding:7px;
  margin-top:7px
}
.boxbody input,.boxbody textarea,.boxbody select{
  width:100%;padding:9px;border:1px solid #bbb;margin-bottom:8px
}
.close{
  background:#df5555;color:#fff;border:0;border-radius:5px;padding:2px 9px
}

.auth{
  min-height:100vh;display:grid;place-items:center;
  background:#f2efff;padding:15px
}
.authbox{
  width:min(760px,94vw);background:#fff;border:1px solid #ddd;
  border-radius:17px;padding:23px;box-shadow:0 10px 45px #2222
}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.authcard{border:1px solid #ddd;border-radius:11px;padding:14px}
.authcard input{
  width:100%;padding:10px;border:1px solid #ddd;
  border-radius:7px;margin:4px 0 8px
}

.room-banner{
  background:#ececef;border:1px solid #d0d1d6;border-radius:5px;
  padding:6px 8px;margin-bottom:7px;font-size:12px;color:#333
}

.hidden{display:none!important}

@media(max-width:900px){
  .layout{grid-template-columns:1fr;margin-top:5px;margin-bottom:70px;padding:0 4px}
  .side{display:none}
  .chat{min-height:calc(100vh - 135px)}
  .rooms-strip{grid-template-columns:1fr}
  .grid{grid-template-columns:1fr}
  .nav{width:100%}
  .top{flex-wrap:wrap}
  .logo{order:-1;flex-basis:100%;font-size:18px}
  .bottom button{flex:1;min-width:0;font-size:11px;padding:8px 3px}
}

@media(max-width:600px){
  .profile-card{grid-template-columns:70px 1fr}
  .profile-avatar{width:66px;height:66px;font-size:31px}
  .member-row{grid-template-columns:38px 1fr}
  .member-row .like-btn{grid-column:2}
  .profile-buttons button{min-width:0}
  .mic-grid{grid-template-columns:repeat(2,1fr)}
  .room-admin-grid{grid-template-columns:1fr}
}
</style>
</head>

<body>

<div id="app"></div>

<div id="modal" class="modal">
  <div class="box" id="box"></div>
</div>

<script>
let sid=sessionStorage.getItem("rimaz_sid")||"";
let me=null;
let socket=null;
let currentRoom="الغرفة العامة";
let rooms=[];
let members=[];
let privateToName="";
let rtc=null;
let rtcTarget="";
let rtcKind="";
let localStream=null;
let pendingIce=[];
let currentPage="rooms";

const app=document.getElementById("app");
const modal=document.getElementById("modal");
const box=document.getElementById("box");

function esc(v){
  return String(v??"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function timeText(t){
  try{
    return new Date(t).toLocaleTimeString("ar-IQ",{hour:"2-digit",minute:"2-digit"});
  }catch(e){return "";}
}

function rankName(level){
  if(level>=3)return "⭐ مميز";
  if(level>=2)return "🏅 متفاعل";
  return "عضو";
}

function rankProgress(likes){
  if(likes>=500)return 100;
  if(likes>=400)return Math.round(((likes-400)/100)*100);
  return Math.round((likes/400)*100);
}

function openModal(title,html){
  box.innerHTML=`
    <div class="boxhead">
      <span>${esc(title)}</span>
      <button class="close" onclick="closeModal()">×</button>
    </div>
    <div class="boxbody">${html}</div>
  `;
  modal.classList.add("open");
}

function closeModal(){
  modal.classList.remove("open");
}

modal.addEventListener("click",e=>{
  if(e.target===modal)closeModal();
});

async function api(url,opt={}){
  opt.headers={
    ...(opt.headers||{}),
    ...(sid?{"x-session":sid}:{})
  };

  const r=await fetch(url,opt);
  const j=await r.json().catch(()=>({}));

  if(!r.ok)throw Error(j.error||"حدث خطأ");
  return j;
}

async function start(){
  try{
    const s=await api("/api/state");
    me=s.user;

    if(!me){
      auth();
      return;
    }

    await syncRooms();
    connectSocket();
    await show("rooms");
  }catch(e){
    console.error(e);
    auth();
  }
}

async function syncRooms(){
  try{
    const rs=await api("/api/rooms");
    const icons=["🏠","🔒","❤️","🎙️","🌙","⭐","🌹","🎧"];

    rooms=rs.map((r,i)=>({
      icon:icons[i%icons.length],
      name:r.name,
      desc:r.kind==="voice"?"مايك":r.kind==="private"?"خاص":r.desc||"نص فقط",
      count:r.online??r.count??0,
      kind:r.kind,
      capacity:r.capacity||0,
      mics:r.mics||0
    }));
  }catch(e){
    console.error(e);
  }
}

function auth(){
  app.innerHTML=`
    <div class="auth">
      <div class="authbox">

        <div class="logo">
          دردشة <span>ريماز عراقية</span>
        </div>

        <p style="text-align:center">
          دخول بدون إيميل أو رقم هاتف
        </p>

        <div class="grid">

          <div class="authcard">
            <h2>دخول عضو</h2>
            <input id="ln" placeholder="اسم المستخدم">
            <input id="lp" type="password" placeholder="كلمة المرور">

            <button class="purple"
              style="width:100%"
              onclick="login()">
              دخول عضو
            </button>

            <p class="muted">
              العضو المسجل سابقًا لا يحتاج إعادة التسجيل.
            </p>
          </div>

          <div class="authcard">
            <h2>تسجيل حساب جديد</h2>
            <input id="rn" placeholder="اسم المستخدم">
            <input id="rp" type="password" placeholder="كلمة المرور">

            <button class="purple"
              style="width:100%"
              onclick="reg()">
              إنشاء حساب
            </button>

            <p class="muted">
              اسم + باسورد فقط.
            </p>
          </div>

        </div>

        <div class="authcard" style="margin-top:10px">
          <h2>دخول زائر</h2>

          <input id="gn" placeholder="اسم فريد">

          <button class="black"
            style="width:100%"
            onclick="guest()">
            دخول زائر
          </button>

          <p class="muted">
            اسم الزائر يجب أن يكون غير مستخدم.
          </p>
        </div>

      </div>
    </div>
  `;
}

async function reg(){
  try{
    const name=document.getElementById("rn").value.trim();
    const password=document.getElementById("rp").value;

    const j=await api("/api/register",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({name,password})
    });

    sid=j.sid;
    sessionStorage.setItem("rimaz_sid",sid);

    await start();
  }catch(e){
    alert(e.message);
  }
}

async function login(){
  try{
    const name=document.getElementById("ln").value.trim();
    const password=document.getElementById("lp").value;

    const j=await api("/api/login",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({name,password})
    });

    sid=j.sid;
    sessionStorage.setItem("rimaz_sid",sid);

    await start();
  }catch(e){
    alert(e.message);
  }
}

async function guest(){
  try{
    const name=document.getElementById("gn").value.trim();

    const j=await api("/api/guest",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({name})
    });

    sid=j.sid;
    sessionStorage.setItem("rimaz_sid",sid);

    await start();
  }catch(e){
    alert(e.message);
  }
}

function connectSocket(){
  if(socket){
    try{socket.disconnect()}catch(e){}
  }

  socket=io();

  socket.on("connect",()=>{
    joinCurrentRoom();
  });

  socket.on("history",items=>{
    renderMessages(items||[]);
  });

  socket.on("message",m=>{
    if(m.room===currentRoom)addMessage(m);
  });

  socket.on("private",m=>{
    if(m.from===privateToName || m.to===privateToName){
      addPrivateMessage(m);
    }
  });

  socket.on("room-presence",async()=>{
    await syncRooms();
    if(currentPage==="rooms")refreshRoomPage();
  });

  socket.on("room-error",d=>{
    alert(d?.message||"حدث خطأ في الغرفة");
  });

  socket.on("room-denied",d=>{
    alert(d?.message||"لا يمكنك دخول هذه الغرفة");
  });

  socket.on("room-kicked",async()=>{
    currentRoom="الغرفة العامة";
    alert("تم إخراجك من الغرفة");
    await syncRooms();
    await show("rooms");
  });

  socket.on("room-moderation",d=>{
    if(d?.action==="mute")alert("تم كتمك في هذه الغرفة");
    if(d?.action==="unmute")alert("تم إلغاء كتمك");
  });

  socket.on("mic-state",async()=>{
    if(currentPage==="rooms" && currentRoom==="غرفة الصوت"){
      await renderVoiceRoom();
    }
  });

  socket.on("mic-request",d=>{
    if(me?.admin && d?.name){
      alert("طلب تشغيل المايك من: "+d.name);
    }
  });

  socket.on("call-offer",receiveCallOffer);
  socket.on("call-answer",receiveCallAnswer);
  socket.on("ice",receiveIce);
}

function joinCurrentRoom(){
  if(!socket||!socket.connected||!sid)return;

  socket.emit("join",{
    sid,
    room:currentRoom
  });
}

async function show(page){
  currentPage=page;

  if(!me){
    auth();
    return;
  }

  if(page==="rooms"){
    await syncRooms();
    roomsPage();
  }

  if(page==="private"){
    await privatePage();
  }

  if(page==="members"){
    await membersPage();
  }

  if(page==="wall"){
    await wallPage();
  }

  if(page==="profile"){
    await profilePage();
  }

  if(page==="notifications"){
    await notificationsView();
  }

  if(page==="settings"){
    await settings();
  }
}

function header(active){
  return `
    <header class="top">

      <div class="user">
        <div class="ava">${esc(me?.profile?.avatar||"👤")}</div>
        <span>
          ${esc(me?.name||"")}
          ${me?.type==="guest"?" (زائر)":""}
        </span>
      </div>

      <div class="logo">
        دردشة <span>ريماز عراقية</span>
      </div>

      <nav class="nav">

        <button class="${active==="rooms"?"on":""}"
          onclick="show('rooms')">
          الغرف
        </button>

        <button class="${active==="private"?"on":""}"
          onclick="show('private')">
          الخاص
        </button>

        <button class="${active==="members"?"on":""}"
          onclick="show('members')">
          الأعضاء
        </button>

        <button class="${active==="wall"?"on":""}"
          onclick="show('wall')">
          الحائط
        </button>

        <button class="bell"
          onclick="notificationsView()">

async function uploadMedia(){
  try{
    const input=document.getElementById("mediaInput");
    if(!input?.files?.length)return;

    const fd=new FormData();
    fd.append("file",input.files[0]);
    fd.append("to",privateToName);

    const r=await fetch("/api/media",{
      method:"POST",
      headers:sid?{"x-session":sid}:{},
      body:fd
    });

    const j=await r.json();

    if(!r.ok)throw Error(j.error||"فشل الرفع");

    if(socket){
      socket.emit("private",{
        to:privateToName,
        text:"📎 تم إرسال ملف: "+j.name+" "+location.origin+j.url
      });
    }

    alert("تم رفع الملف وإرساله.");
  }catch(e){
    alert(e.message);
  }
}

async function startCall(name,video){
  if((me.likes||0)<500){
    alert("الاتصال يفتح عند 500 إعجاب.");
    return;
  }

  if(!socket){
    alert("الاتصال غير جاهز.");
    return;
  }

  try{
    localStream=await navigator.mediaDevices.getUserMedia({
      audio:true,
      video:!!video
    });

    rtc=new RTCPeerConnection({
      iceServers:[
        {urls:"stun:stun.l.google.com:19302"}
      ]
    });

    rtcTarget=name;
    rtcKind=video?"video":"audio";
    pendingIce=[];

    localStream.getTracks().forEach(t=>{
      rtc.addTrack(t,localStream);
    });

    rtc.onicecandidate=e=>{
      if(e.candidate){
        socket.emit("ice",{
          to:rtcTarget,
          candidate:e.candidate
        });
      }
    };

    rtc.ontrack=e=>{
      showRemoteStream(e.streams[0]);
    };

    const offer=await rtc.createOffer();
    await rtc.setLocalDescription(offer);

    socket.emit("call-offer",{
      to:name,
      offer,
      video
    });

    showCallBox(name,video,false);
  }catch(e){
    alert("تعذر تشغيل الاتصال: "+e.message);
    stopCall();
  }
}

async function receiveCallOffer(d){
  if(!d?.from)return;

  if((me.likes||0)<500)return;

  const ok=confirm(
    (d.video?"📹":"📞")+" اتصال وارد من "+d.from+"\nهل تريد الرد؟"
  );

  if(!ok)return;

  try{
    localStream=await navigator.mediaDevices.getUserMedia({
      audio:true,
      video:!!d.video
    });

    rtc=new RTCPeerConnection({
      iceServers:[
        {urls:"stun:stun.l.google.com:19302"}
      ]
    });

    rtcTarget=d.from;
    rtcKind=d.video?"video":"audio";

    localStream.getTracks().forEach(t=>{
      rtc.addTrack(t,localStream);
    });

    rtc.onicecandidate=e=>{
      if(e.candidate){
        socket.emit("ice",{
          to:rtcTarget,
          candidate:e.candidate
        });
      }
    };

    rtc.ontrack=e=>{
      showRemoteStream(e.streams[0]);
    };

    await rtc.setRemoteDescription(
      new RTCSessionDescription(d.offer)
    );

    const answer=await rtc.createAnswer();
    await rtc.setLocalDescription(answer);

    socket.emit("call-answer",{
      to:d.from,
      answer
    });

    showCallBox(d.from,!!d.video,true);

    for(const c of pendingIce){
      try{
        await rtc.addIceCandidate(c);
      }catch(e){}
    }

    pendingIce=[];
  }catch(e){
    alert("تعذر الرد على الاتصال: "+e.message);
    stopCall();
  }
}

async function receiveCallAnswer(d){
  if(!rtc||!d?.answer)return;

  try{
    await rtc.setRemoteDescription(
      new RTCSessionDescription(d.answer)
    );

    for(const c of pendingIce){
      try{
        await rtc.addIceCandidate(c);
      }catch(e){}
    }

    pendingIce=[];
  }catch(e){
    console.error(e);
  }
}

async function receiveIce(d){
  if(!d?.candidate)return;

  const c=new RTCIceCandidate(d.candidate);

  if(rtc?.remoteDescription){
    try{
      await rtc.addIceCandidate(c);
    }catch(e){}
  }else{
    pendingIce.push(c);
  }
}

function showCallBox(name,video,incoming){
  openModal(
    video?"📹 اتصال كاميرا":"📞 اتصال صوتي",
    `
      <div class="notice">
        ${incoming?"مكالمة واردة":"جاري الاتصال"} مع
        <b>${esc(name)}</b>
      </div>

      <video id="remoteVideo"
        ${video?"":"style=\"display:none\""}
        autoplay playsinline
        style="width:100%;background:#000;border-radius:8px">
      </video>

      <audio id="remoteAudio"
        autoplay
        ${video?"style=\"display:none\"":""}>
      </audio>

      <div class="profile-buttons">

        <button class="red"
          onclick="stopCall()">
          إنهاء الاتصال
        </button>

      </div>
    `
  );
}

function showRemoteStream(stream){
  const video=document.getElementById("remoteVideo");
  const audio=document.getElementById("remoteAudio");

  if(video){
    video.srcObject=stream;
    video.play().catch(()=>{});
  }

  if(audio){
    audio.srcObject=stream;
    audio.play().catch(()=>{});
  }
}

function stopCall(){
  try{
    if(rtc){
      rtc.close();
      rtc=null;
    }
  }catch(e){}

  if(localStream){
    localStream.getTracks().forEach(t=>{
      try{t.stop()}catch(e){}
    });
    localStream=null;
  }

  rtcTarget="";
  pendingIce=[];

  closeModal();
}

start();
</script>
