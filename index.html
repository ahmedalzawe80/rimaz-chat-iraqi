let micRaised=false,voiceMuted=false,voiceLocalStream=null,roomOutputMuted=false,voiceRequestPending=false,voiceMicRequestId=0;const voicePeers=new Map(),pendingVoiceIce=new Map(),voiceAnalyzers=new Map(),pendingVoiceOutgoingIce=new Map(),voiceOfferSent=new Set();

async function openMembers(){const a=await api('/api/members');layer(`<div class="overlay membersOverlay"><div class="overlayHead membersHead"><span>المتواجدين</span><button class="close" onclick="closeLayer()">×</button></div><div class="overlayBody"><div style="padding:5px"><input id="memberSearch" style="width:100%;height:38px;border:1px solid #aaa;padding:5px" placeholder="... البحث" oninput="filterMembers()"></div><div id="memberList">${memberRows(a)}</div></div></div>`,'members')}
function memberRows(a){const onlineUsers=a.filter(x=>x.online===true);const roomUsers=currentRoom?onlineUsers.filter(x=>String(x.room||'')===String(currentRoom)):[];const allRows=list=>list.map(x=>{const online=x.online!==false;const dot=memberStatusClass(x);const name=displayFor(x);return `<div class="member row ${String(x.name||'').toLowerCase()==='admin'?'adminMember':''} ${x.profile?.banner?'hasPersonalBanner':''}" data-name="${esc(name)}" onclick="openMemberProfile('${esc(x.name)}')"><span class="memberStatusBar ${dot}" title="${online?(x.profile?.privateOpen===false?'الخاص مغلق':'الخاص مفتوح'):'غير موجود'}"></span><img class="memberAvatar" src="${esc(avatarFor(x.profile))}" alt="" loading="lazy"><div class="memberMain"><div class="memberNameLine" data-from="${esc(x.name)}">${personalBannerIdentity(x.profile,name,memberBadge(x),false,'onlineIdentity')}</div><div class="memberSub">${esc(online?(x.profile?.status||(x.type==='guest'?'(غير مسجل)':'(عضو جديد)')):'غير متصل')}</div></div><div class="memberLikes">${String(x.name||'').toLowerCase()==='admin'?'':`${Number(x.likes)||0} ♥`}</div><span class="memberCountryFlag" aria-label="العلم">${x.type==='guest'?'👤':'🇮🇶'}</span></div>`}).join('');if(currentRoom){const roomRows=allRows(roomUsers);const roomUserNames=new Set(roomUsers.map(x=>key(x.name)));const otherOnlineUsers=onlineUsers.filter(x=>!roomUserNames.has(key(x.name)));const allOnlineRows=allRows(otherOnlineUsers);return `${roomRows||'<div class="empty">لا يوجد أعضاء في هذه الغرفة</div>'}<div class="memberSectionBar">المتواجدين في الدردشة</div>${allOnlineRows||'<div class="empty">لا يوجد متواجدون</div>'}`}return allRows(onlineUsers)||'<div class="empty">لا يوجد متواجدون</div>'}
function filterMembers(){const q=key(memberSearch.value);document.querySelectorAll('#memberList .member').forEach(x=>x.style.display=key(x.dataset.name).includes(q)?'grid':'none')}
async function openRooms(){rooms=await api('/api/rooms');layer(`<div class="overlay roomsOverlay"><div class="overlayHead roomsHead"><button class="close" onclick="closeLayer()">×</button><span>غرف الدردشة: ${rooms.reduce((n,r)=>n+(r.online||0),0)}</span></div><div class="overlayBody"><button class="newRoom" onclick="openCreateRoomModal()">+ إنشاء غرفة</button>${rooms.map(r=>`<div class="room ${r.id===currentRoom?'room-current':''} room-theme-${r.theme==='black'?'black':'red'}" aria-current="${r.id===currentRoom?'true':'false'}" onclick="reenterRoom('${esc(r.id)}')"><img src="${esc(r.image||avatarFor({}))}"><span class="roomLockMark">${r.locked?'🔒':''}</span><div><div class="roomName">${esc(r.name)}</div><div class="roomDesc">${esc(r.desc||'غرفة عامة ..')}</div></div><div class="count ${r.kind==='voice'?'voice':''}">${r.kind==='voice'?'🎙️':'♟'}${r.online||0}/${r.capacity}</div></div>`).join('')}</div></div>`,'rooms')}

mKind]:checked')?.value==='voice'?'block':'none'}))}

async function openPrivate(name){try{if(privateOpen&&key(privateTo)!==key(name))clearPrivateMediaObjectUrls();privateMinimizedPeer=null;let u=(await api('/api/members')).find(x=>key(x.name)===key(name));if(!u||!u.online){const contacts=await api('/api/private/contacts');const existing=contacts.find(x=>key(x.name)===key(name));if(!existing){showBlockModal('هذا المستخدم غير متصل');return}u={name:existing.name,type:'member',profile:existing.profile||{},online:false,likes:0,level:1,role:'member'};}if(u?.profile?.privateOpen===false&&!canOpenClosedPrivate(u)){showBlockModal(`لقد أغلق ${displayFor(u)} المحادثة الخاصة`);return}privateTo=name;privatePeerProfile=u.profile||{};privatePeerUser=u;privateOpen=true;markPrivateRead(name);const dn=displayFor(u)||name;layer(`<div class="overlay privateOverlay"><div class="privateHead"><span class="privateCountryFlag" title="علم دولة المستخدم" style="display:flex;align-items:center;justify-content:center;font-size:21px;min-width:24px" data-country="${esc(u.countryCode||u.profile?.countryCode||u.profile?.country||'IQ')}">${countryFlag(u.countryCode||u.profile?.countryCode||u.profile?.country||'IQ')}</span><span class="privateStatus ${u?.online?(u?.profile?.privateOpen===false?'statusClosed':'statusOpen'):'statusOffline'}" title="${u?.online?(u?.profile?.privateOpen===false?'الخاص مغلق':'الخاص مفتوح'):'غير موجود'}"></span><img class="privateHeadAvatar" src="${esc(avatarFor(u.profile||{}))}" alt=""><div class="privateHeadName"><div class="privateHeadTitle" data-from="${esc(u.name)}">${personalBannerIdentity(u.profile,dn,memberBadge(u),false,'privateHeadBanner')}</div><small>${esc(u?.profile?.status||(u?.type==='guest'?'(غير مسجل)':'(عضو جديد)'))}</small></div><div class="privateHeadActions"><button class="privateClose" title="إغلاق نافذة المحادثة مع الاحتفاظ بسجل الرسائل" onclick="closePrivateConversation()">×</button><button class="blue" title="إرسال تنبيه" onclick="notifyUser('${esc(name)}')">✉</button><button class="privateLike" titl function sharePrivate(){if(me.likes<500&&!me.admin)return toast('الإرسال والوسائط تفتح عند 500 إعجاب');const f=document.createElement('input');f.type='file';f.accept='image/*,video/*,audio/*';f.onchange=async()=>{const file=f.files?.[0];if(!file)return;const b=document.getElementById('privateBody');if(!b)return;const id='private-upload-'+Date.now();const wrap=document.createElement('div');wrap.className='pmsg me rimazUploadWrap';wrap.innerHTML=mediaUploadBar(id,file.name);b.appendChild(wrap);b.scrollTop=b.scrollHeight;const fd=new FormData();fd.append('file',file);fd.append('to',privateTo);fd.append('scope','private');window.activeMediaUploads=window.activeMediaUploads||{};const entry=window.activeMediaUploads[id]={xhr:null,cancelled:false};try{const promise=uploadMediaWithProgress('/api/media',fd,n=>{const bar=document.getElementById(id);if(bar){bar.querySelector('.rimazUploadFill').style.width=n+'%';bar.querySelector('.rimazUploadPercent').textContent=n+'%'}});entry.xhr=window.currentMediaUploadXhr;const result=await promise;if(entry.cancelled)return;delete window.activeMediaUploads[id];wrap.remove();addPrivateMedia(result)}catch(e){if(!entry.cancelled){wrap.remove();toast(e.message)}delete window.activeMediaUploads[id]}};f.click()}

async function choosePersonalBanner(){if(!(me?.owner||hasClientPermission('banner_upload')))return toast('ما عندك صلاحية رفع البنر');const picker=document.createElement('input');picker.type='file';picker.accept='image/jpeg,image/png,image/gif,image/webp,image/avif';picker.onchange=async()=>{const original=picker.files?.[0];if(!original)return;try{let file=original;if(!/^image\/(jpeg|png|gif|webp|avif)$/.test(file.type))throw new Error('اختر JPG أو PNG أو GIF أو WEBP أو AVIF');if(file.type==='image/gif'&&file.size>8*1024*1024)throw new Error('حجم GIF أكبر من 8MB؛ قلّل حجمه مع الحفاظ على الحركة ثم أعد رفعه');if(file.size>8*1024*1024&&file.type!=='image/gif'){const img=new Image(),url=URL.createObjectURL(file);try{await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=()=>reject(new Error('تعذر قراءة الصورة')) ;img.src=url});const scale=Math.min(1,1800/Math.max(img.width,img.height));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/webp',0.84));if(blob&&blob.size<file.size)file=new File([blob],'personal-banner.webp',{type:'image/webp'});}finally{URL.revokeObjectURL(url)}}if(file.size>8*1024*1024)throw new Error('حجم الصورة أكبر من 8MB حتى بعد ضغطها');const fd=new FormData();fd.append('file',file);const result=await api('/api/profile/banner',{method:'POST',body:fd});me.profile=me.profile||{};me.profile.banner=result.banner;toast('تم رفع البنر بنجاح');openSettings()}catch(e){toast(e.message||'تعذر رفع البنر')}};picker.click()}

لبنر الشخصي':'رفع بنر شخصي'}</button>${p.banner?`<button class="danger" onclick="deletePersonalBanner()">حذف البنر الشخصي</button>`:''}`:''}${(me.owner||me.panelAccess||(Array.isArray(me.myPermissions)&&me.myPermissions.length>0))?`${hasClientPermission('bots_manage')||me.owner?`<button class="plain" onclick="openBotsPanel()">⭐ بوت | Boot</button>`:''}${hasClientPermission('announcement_post')||me.owner?`<button class="plain" onclick="openTimedAnnouncementComposer()">📢 الإعلان للدعاية والمسابقات</button>`:''}<button class="plain" onclick="openAdmin()">🛠 لوحة التحكم</button>`:''}<button class="danger" onclick="logout()">↪ تسجيل خروج</button></div></div>`,'settings')}

function readComposer(el){if(!el)return '';let out='';const walk=n=>{if(n.nodeType===3){out+=n.nodeValue;return}if(n.nodeType!==1)return;if(n.tagName==='IMG'&&n.dataset.smileyId){out+='[[smiley:'+n.dataset.smileyId+']]';return}if(n.tagName==='BR'){out+='\n';return}for(const c of n.childNodes)walk(c)};for(const c of el.childNodes)walk(c);return out}function pickEmoji(item,target,isImage){const id=target==='private'?'privateText':target==='wall'?'wallText':'msgInput';const input=document.getElementById(id);if(input){input.focus();const sel=window.getSelection();let range;if(sel&&sel.rangeCount&&input.contains(sel.anchorNode))range=sel.getRangeAt(0);else{range=document.createRange();range.selectNodeContents(input);range.collapse(false)}range.deleteContents();let node;if(isImage){node=document.createElement('img');node.src=String(item.icon||'');node.alt=item.name||'سميل';node.dataset.smileyId=String(item.id);node.className='composerSmiley'}else node=document.createTextNode(String(item.icon||''));range.insertNode(node);range.setStartAfter(node);range.collapse(true);sel.removeAllRanges();sel.addRange(range);input.dispatchEvent(new Event('input',{bubbles:true}))}document.querySelector('.emojiModal')?.remove()}function updateMeBadges(){document.getElementById('onlineCount')?.setAttribute('title',`إعجاباتك: ${me.likes}`)}

 const can=p=>hasClientPermission(p);const u=(window.adminCachedUsers||[]).find(x=>key(x.name)===key(n))||{};
 const ranks=rankChoices().filter(()=>can('rank_assign'));const gifts=Array.isArray(window.giftPickerCatalog)?window.giftPickerCatalog:[];

window.chatShortcutCache=window.chatShortcutCache||null;
async function expandChatShortcut(input,force=false){
 // Keep shortcut tokens visible while composing; expand only at the send action.
 if(!force||!input||!canUseChatPermission('shortcuts_manage'))return;
 try{
  if(!window.chatShortcutCache||!window.chatSmileyCache){const d=await api('/api/chat-tools');window.chatShortcutCache=Array.isArray(d.shortcuts)?d.shortcuts:[];window.chatSmileyCache=Array.isArray(d.smileys)?d.smileys:[];}
  if(input.isContentEditable){
   const walker=document.createTreeWalker(input,NodeFilter.SHOW_TEXT);let lastText=null,node;while((node=walker.nextNode()))lastText=node;
   if(!lastText)return;const value=lastText.nodeValue||'',match=value.match(/(^|\s)([^\s]+)\s*$/);if(!match)return;
   const token=match[2],norm=normalizeSmileyShortcut(token),item=(window.chatShortcutCache||[]).find(x=>normalizeSmileyShortcut(x.title)===norm),smiley=(window.chatSmileyCache||[]).find(x=>normalizeSmileyShortcut(x.shortcut)===norm);if(!item&&!smiley)return;
   const before=value.slice(0,match.index)+match[1];lastText.nodeValue=before;
   if(smiley){const icon=String(smiley.icon||'');if(icon.startsWith('/uploads/')||icon.startsWith('/smileys/')||icon.startsWith('data:image/')||/^\/classic-smileys(?:-[^/]+)?\//.test(icon)){const img=document.createElement('img');img.src=icon;img.alt=smiley.name||'سميل';img.dataset.smileyId=String(smiley.id);img.className='composerSmiley';lastText.parentNode.insertBefore(img,lastText.nextSibling);const spacer=document.createTextNode('');img.parentNode.insertBefore(spacer,img.nextSibling);const range=document.createRange();range.setStart(spacer,0);range.collapse(true);const sel=window.getSelection();sel.removeAllRanges();sel.addRange(range);}else{const text=document.createTextNode(icon);lastText.parentNode.insertBefore(text,lastText.nextSibling);const range=document.createRange();range.setStartAfter(text);range.collapse(true);const sel=window.getSelection();sel.removeAllRanges();sel.addRange(range);}}
   else{const text=document.createTextNode(String(item.text||''));lastText.parentNode.insertBefore(text,lastText.nextSibling);const range=document.createRange();range.setStartAfter(text);range.collapse(true);const sel=window.getSelection();sel.removeAllRanges();sel.addRange(range);}
   return;
  }
  const value=String(input.value||''),trimmed=value.trimEnd(),match=trimmed.match(/(?:^|\s)([^\s]+)$/);if(!match)return;const token=match[1],norm=normalizeSmileyShortcut(token),item=(window.chatShortcutCache||[]).find(x=>normalizeSmileyShortcut(x.title)===norm),smiley=(window.chatSmileyCache||[]).find(x=>normalizeSmileyShortcut(x.shortcut)===norm);if(!item&&!smiley)return;const start=trimmed.length-token.length;const icon=String(smiley?.icon||'');input.value=value.slice(0,start)+(smiley?((icon.startsWith('/uploads/')||icon.startsWith('/smileys/')||icon.startsWith('data:image/')||/^\/classic-smileys(?:-[^/]+)?\//.test(icon))?'[[smiley:'+smiley.id+']]':icon):String(item.text||''))+value.slice(trimmed.length);try{input.setSelectionRange(input.value.length,input.value.length)}catch{}
 }catch(e){console.warn('shortcut expansion failed',e)}
}
async function openShortcuts(target){if(!canUseChatPermission('shortcuts_manage'))return toast('زر الاختصارات غير متاح لرتبتك');try{const d=await api('/api/chat-tools');const items=d.shortcuts||[];if(!items.length)return toast('ماكو اختصارات مضافة حالياً');const box=document.createElement('div');box.className='emojiModal';box.innerHTML='<div class="emojiHead"><b>⚡ الاختصارات</b><button type="button" id="shortcutClose">×</button></div><div class="emojiGrid" style="grid-template-columns:repeat(2,minmax(0,1fr))"></div>';document.querySelector('.chat')?.appendChild(box);const grid=box.querySelector('.emojiGrid');items.forEach(x=>{const b=document.createElement('button');b.type='button';b.style.fontSize='13px';b.textContent=x.title;b.title=x.text;b.addEventListener('click',()=>{const input=document.getElementById(target==='private'?'privateText':target==='wall'?'wallText':'msgInput');if(input){if(input.isContentEditable){input.focus();const sel=window.getSelection(),range=document.createRange();range.selectNodeContents(input);range.collapse(false);sel.removeAllRanges();sel.addRange(range);range.insertNode(document.createTextNode((input.textContent?' ':'')+x.text))}else input.value+=(input.value?' ':'')+x.text;input.focus()}box.remove()});grid.appendChild(b)});box.querySelector('#shortcutClose').onclick=()=>box.remove()}catch(e){toast(e.message)}}

async function saveSubscriptionPlan(){const name=document.getElementById('subPlanName')?.value,days=Number(document.getElementById('subPlanDays')?.value),priceLabel=document.getElementById('subPlanPrice')?.value,description=document.getElementById('subPlanDesc')?.value,grantsVip=!!document.getElementById('subPlanVip')?.checked;try{await api('/api/admin/subscriptions/plans',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,days,priceLabel,description,grantsVip})});toast('تم حفظ خطة الاشتراك');adminTab('subscriptions')}catch(e){toast(e.message)}}
async function editSubscriptionPlan(id,currentName,currentDays,currentPrice,currentDescription,grantsVip){const name=prompt('اسم الخطة:',currentName);if(name===null)return;const days=Number(prompt('مدة الخطة بالأيام:',String(currentDays)));if(!Number.isInteger(days)||days<1||days>3650)return toast('المدة يجب أن تكون من يوم إلى 3650');const priceLabel=prompt('السعر أو الوصف المختصر:',currentPrice);if(priceLabel===null)return;const description=prompt('وصف الخطة:',currentDescription);if(description===null)return;try{await api('/api/admin/subscriptions/plans',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,name,days,priceLabel,description,grantsVip})});toast('تم تعديل الخطة');adminTab('subscriptions')}catch(e){toast(e.message)}}
async function deleteSubscriptionPlan(id){if(!confirm('حذف خطة الاشتراك؟ لن تُحذف سجلات اشتراكات الأعضاء السابقة.'))return;try{await api('/api/admin/subscriptions/plans/'+encodeURIComponent(id),{method:'DELETE'});toast('تم حذف الخطة');adminTab('subscriptions')}catch(e){toast(e.message)}}
async function assignSubscription(){const name=document.getElementById('subTarget')?.value,planId=document.getElementById('subPlanChoice')?.value,days=document.getElementById('subDaysOverride')?.value;if(!name||!planId)return toast('اختر الحساب والخطة');try{await api('/api/admin/subscriptions/assign',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,planId,days})});toast('تم منح أو تجديد الاشتراك');adminTab('subscriptions')}catch(e){toast(e.message)}}
async function cancelSubscription(name){if(!confirm('إلغاء اشتراك '+name+'؟'))return;try{await api('/api/admin/subscriptions/cancel',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name})});toast('تم إلغاء الاشتراك');adminTab('subscriptions')}catch(e){toast(e.message)}}
async function createAdCampaign(){const file=document.getElementById('adImageFile')?.files?.[0];if(!file)return toast('اختر صورة الإعلان');const fd=new FormData();fd.append('file',file);fd.append('title',document.getElementById('adTitle')?.value||'');fd.append('url',document.getElementById('adUrl')?.value||'');const toIso=v=>v?new Date(v).toISOString():'';fd.append('startsAt',toIso(document.getElementById('adStart')?.value||''));fd.append('endsAt',toIso(document.getElementById('adEnd')?.value||''));try{await api('/api/admin/ads',{method:'POST',body:fd});toast('تم إنشاء الحملة الإعلانية');adminTab('ads')}catch(e){toast(e.message)}}

async function deleteAdCampaign(id){if(!confirm('حذف الحملة وصورتها؟'))return;try{await api('/api/admin/ads/'+encodeURIComponent(id),{method:'DELETE'});toast('تم حذف الحملة');adminTab('ads')}catch(e){toast(e.message)}}
async function saveControlCenter(){const modules={};document.querySelectorAll('[data-module]').forEach(x=>modules[x.dataset.module]=x.checked);try{await api('/api/admin/control-center',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({modules})});toast('تم حفظ مركز التحكم')}catch(e){toast(e.message)}}
async function adminWallControl(action){const labels={stop:'إيقاف الحائط مؤقتاً؟ لن يستطيع أحد نشر نصوص أو وسائط حتى تعيد تشغيله.',restart:'إعادة تشغيل الحائط والسماح بالنشر من جديد؟',clear:'حذف جميع منشورات الحائط نهائياً؟ هذا لا يحذف رسائل الدردشة أو حسابات الأعضاء.'};if(!confirm(labels[action]||'تأكيد الإجراء؟'))return;try{const r=await api('/api/admin/wall/control',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action})});toast(action==='stop'?'تم إيقاف الحائط':action==='restart'?'تمت إعادة تشغيل الحائط':'تم حذف الحائط بالكامل ('+(r.removed||0)+' منشور)');await adminTab('wall')}catch(e){toast(e.message)}}
async function adminDeleteWallUser(name){name=String(name||'').trim();if(!name)return toast('حدد العضو أولاً');if(!confirm('حذف جميع منشورات الحائط الخاصة بـ '+name+' فقط؟ لن تتأثر منشورات بقية الأعضاء.'))return;try{const r=await api('/api/admin/wall/control',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'delete-user',name})});toast('تم حذف '+r.removed+' منشور من الحائط للعضو '+name);if(activeOverlay==='wall')openWall()}catch(e){toast(e.message)}}
async function adminDeleteWallUserSelected(){const n=document.getElementById('wallDeleteTarget')?.value;if(!n)return toast('اختر العضو أولاً');return adminDeleteWallUser(n)}
async function grantLike(n,a){n=String(n||'').trim();if(!n)return toast('اكتب اسم الحساب');try{const j=await api('/api/admin/grant-like',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n,amount:Number(a)})});toast('تمت إضافة اللايكات: '+j.likes);adminTab('users')}catch(e){toast(e.message)}}
async function resetLikes(n){n=String(n||'').trim();if(!n)return toast('اكتب اسم الحساب');if(!confirm('متأكد تريد تصفير لايكات '+n+'؟'))return;try{await api('/api/admin/reset-likes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n})});toast('تم تصفير اللايكات');adminTab('users')}catch(e){toast(e.message)}}
function previewRoomImage(input){const file=input?.files?.[0],preview=document.getElementById('roomImagePreview'),label=document.getElementById('roomImageFileName');if(label)label.textContent=file?file.name:'ما مختار صورة بعد';if(!preview)return;if(!file){preview.style.display='none';preview.removeAttribute('src');return}if(!file.type.startsWith('image/')){toast('اختار ملف صورة فقط');input.value='';preview.style.display='none';return}preview.src=URL.createObjectURL(file);preview.style.display='block'}
async function createRoom(){const name=document.getElementById('rn')?.value,desc=document.getElementById('rd')?.value,capacity=document.getElementById('rc')?.value,kind=document.getElementById('rk')?.value,mics=document.getElementById('rmics')?.value,micLikesRequired=document.getElementById('rmlikes')?.value,file=document.getElementById('roomImageFile')?.files?.[0];try{const created=await api('/api/admin/room',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,desc,capacity,kind,mics,micLikesRequired})});if(file&&created.id){const fd=new FormData();fd.append('file',file);await api('/api/admin/room/'+encodeURIComponent(created.id)+'/image',{method:'POST',body:fd})}toast('تم إنشاء الغرفة'+(file?' وحفظ صورتها':'')+' بنجاح');adminTab('rooms')}catch(e){toast(e.message)}}
async function setRoomLock(id,name){const password=prompt('اكتب باسورد غرفة '+name+' (لا يمكن تفعيل القفل بدونه):');if(password===null)return;if(!password.trim()){toast('لازم تكتب الباسورد قبل تفعيل القفل');return;}try{await api('/api/admin/room/'+encodeURIComponent(id)+'/lock',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password})});toast('تم حفظ الباسورد وتفعيل قفل الغرفة');await adminTab('rooms')}catch(e){toast(e.message)}}

function startPrivateCallStats(){if(callStatsTimer)clearInterval(callStatsTimer);callStatsTimer=setInterval(async()=>{const active=pc;if(!active||callMode!=='camera'||active.connectionState==='closed')return;try{const report=await active.getStats(),rows=[],codecById=new Map(),transports=[];report.forEach(item=>{if(item.type==='codec')codecById.set(item.id,item.mimeType||item.codec||'unknown');if(item.type==='transport')transports.push({dtlsState:item.dtlsState,iceState:item.iceState,selectedCandidatePairId:item.selectedCandidatePairId})});report.forEach(item=>{if(item.type==='inbound-rtp'&&(item.kind==='video'||item.mediaType==='video'))rows.push({direction:'receive',packetsReceived:item.packetsReceived,bytesReceived:item.bytesReceived,framesReceived:item.framesReceived,framesDecoded:item.framesDecoded,framesPerSecond:item.framesPerSecond,frameWidth:item.frameWidth,frameHeight:item.frameHeight,framesDropped:item.framesDropped,codec:codecById.get(item.codecId)||item.codecId});if(item.type==='outbound-rtp'&&(item.kind==='video'||item.mediaType==='video'))rows.push({direction:'send',packetsSent:item.packetsSent,bytesSent:item.bytesSent,framesSent:item.framesSent,framesEncoded:item.framesEncoded,framesPerSecond:item.framesPerSecond,frameWidth:item.frameWidth,frameHeight:item.frameHeight,codec:codecById.get(item.codecId)||item.codecId})});const pairIds=transports.map(t=>t.selectedCandidatePairId).filter(Boolean);const pairs=[];report.forEach(item=>{if(item.type==='candidate-pair'&&pairIds.includes(item.id))pairs.push({state:item.state,nominated:item.nominated,currentRoundTripTime:item.currentRoundTripTime,availableOutgoingBitrate:item.availableOutgoingBitrate,localCandidateId:item.localCandidateId,remoteCandidateId:item.remoteCandidateId})});const localVideo=localStream?.getVideoTracks?.()[0];console.info('[Rimaz private video diagnostics]',{connection:active.connectionState,ice:active.iceConnectionState,signaling:active.signalingState,localTrack:localVideo?{enabled:localVideo.enabled,muted:localVideo.muted,readyState:localVideo.readyState,settings:localVideo.getSettings?.()}:null,transports,pairs,video:rows})}catch(error){console.warn('Private video stats unavailable',error)}},3000)}

function addPrivateCallTracks(stream){if(!pc||!stream)throw new Error('اتصال الفيديو غير جاهز');for(const track of stream.getTracks()){const exists=pc.getSenders().some(sender=>sender.track?.id===track.id);if(!exists)pc.addTrack(track,stream)}}
function configureCallPeer(peerName,iceServers){callPeerName=peerName;callOfferSent=false;callRemoteStream=null;callRemoteVideoStream=null;callRemoteAudioStream=null;pc=new RTCPeerConnection({iceServers:iceServers||[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun.cloudflare.com:3478'}]});pc.onicecandidate=e=>{if(!e.candidate||!callPeerName)return;if(!callOfferSent)pendingOutgoingCallIce.push(e.candidate);else socket?.emit('ice',{to:callPeerName,candidate:e.candidate})};pc.ontrack=e=>{console.info('[Rimaz private call] remote track received',{kind:e.track.kind,id:e.track.id,muted:e.track.muted,readyState:e.track.readyState,streams:e.streams?.length||0});attachCallRemoteTrack(e.track)};pc.oniceconnectionstatechange=()=>console.info('[Rimaz private call] ICE state',pc?.iceConnectionState);pc.onsignalingstatechange=()=>console.info('[Rimaz private call] signaling state',pc?.signalingState);pc.onconnectionstatechange=()=>{console.info('[Rimaz private call] connection state',pc?.connectionState);if(pc&&['failed','closed'].includes(pc.connectionState))endCall(false)};if(callMode==='camera')startPrivateCallStats();return pc}
function flushOutgoingCallIce(){callOfferSent=true;while(pendingOutgoingCallIce.length){socket?.emit('ice',{to:callPeerName,candidate:pendingOutgoingCallIce.shift()})}}
async function flushCallIce(){if(!pc?.remoteDescription)return;while(pendingCallIce.length){const candidate=pendingCallIce.shift();try{await pc.addIceCandidate(candidate)}catch(error){console.warn('Private call ICE candidate failed',error)}}}
async function switchCallCamera(){
 if(callMode!=='camera'||!localStream||!pc||callCameraSwitching)return;
 if(!navigator.mediaDevices?.getUserMedia)return toast('المتصفح لا يدعم تبديل الكاميرا');
 const oldTrack=localStream.getVideoTracks()[0];
 if(!oldTrack)return toast('مسار الكاميرا غير متاح');
 const sender=pc.getSenders().find(item=>item.track?.kind==='video');
 if(!sender)return toast('مسار إرسال الفيديو غير جاهز');
 const oldSettings=oldTrack.getSettings?.()||{};
 const oldDeviceId=oldSettings.deviceId||'';
 const oldFacing=oldSettings.facingMode||callFacingMode||'user';
 const nextFacing=oldFacing==='environment'?'user':'environment';
 callCameraSwitching=true;
 const button=document.getElementById('switchCallCameraButton');
 if(button){button.disabled=true;button.textContent='جارٍ التبديل…'}
 let freshStream=null,oldTrackStopped=false;
 const stopFresh=()=>{if(freshStream){freshStream.getTracks().forEach(track=>track.stop());freshStream=null}};
 const rejectWrongCamera=(stream)=>{stream?.getTracks().forEach(track=>track.stop());const error=new Error('WRONG_CAMERA_SELECTED');error.name='OverconstrainedError';throw error};
 const validateCandidate=(stream,avoidId,direction)=>{
  const track=stream?.getVideoTracks?.()[0];
  if(!track){stream?.getTracks?.().forEach(item=>item.stop());const error=new Error('NO_VIDEO_TRACK');error.name='NotFoundError';throw error}
  const settings=track.getSettings?.()||{};
  if(avoidId&&settings.deviceId&&settings.deviceId===avoidId)rejectWrongCamera(stream);
  if(settings.facingMode&&settings.facingMode!==direction)rejectWrongCamera(stream);
  return stream;
 };
 const acquireFacing=async(direction,avoidId='')=>{
  const errors=[];
  let devices=[];
  try{devices=(await navigator.mediaDevices.enumerateDevices()).filter(device=>device.kind==='videoinput'&&device.deviceId)}catch(error){errors.push(error)}
  const isBack=direction==='environment';
  const labelPattern=isBack?/(back|rear|environment|world|خلف)/i:/(front|user|face|أمام)/i;
  const candidates=devices.filter(device=>device.deviceId!==avoidId&&labelPattern.test(device.label||''));
  for(const device of candidates){
   try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{deviceId:{exact:device.deviceId}}});
    return validateCandidate(stream,avoidId,direction);
   }catch(error){errors.push(error);console.warn('Camera device selection failed',error)}
  }
  // Use an exact facing-mode request when device labels are missing or unreliable.
  try{
   const stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{exact:direction}}});
   return validateCandidate(stream,avoidId,direction);
  }catch(error){errors.push(error)}
  // Last fallback lets the browser select the requested direction, then verifies it did not return the old lens.
  try{
   const stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:direction}}});
   return validateCandidate(stream,avoidId,direction);
  }catch(error){errors.push(error)}

 };
 try{
  try{freshStream=await acquireFacing(nextFacing,oldDeviceId)}
  catch(firstError){
   // A number of Android camera HALs expose one active camera at a time. Release the old capture only for that hardware-busy response.
   if(!['NotReadableError','TrackStartError'].includes(firstError?.name))throw firstError;
   oldTrack.stop();oldTrackStopped=true;
   await new Promise(resolve=>setTimeout(resolve,200));
   freshStream=await acquireFacing(nextFacing,oldDeviceId);
  }
  const nextTrack=freshStream.getVideoTracks()[0];
  await sender.replaceTrack(nextTrack);
  localStream.removeTrack(oldTrack);
  localStream.addTrack(nextTrack);
  freshStream.getTracks().filter(track=>track!==nextTrack).forEach(track=>track.stop());
  freshStream=null;
  if(!oldTrackStopped)oldTrack.stop();
  callFacingMode=nextFacing;
  attachCallLocal(localStream);
 }catch(error){
  stopFresh();
  console.error('Private-call camera switch failed',error);

   try{
    let restoredStream=null;
    if(oldDeviceId){try{restoredStream=await navigator.mediaDevices.getUserMedia({audio:false,video:{deviceId:{exact:oldDeviceId}}})}catch(restoreByIdError){console.warn('Restore by previous camera ID failed',restoreByIdError)}}

    localStream.removeTrack(oldTrack);
    localStream.addTrack(restoredTrack);
    restoredStream.getTracks().filter(track=>track!==restoredTrack).forEach(track=>track.stop());
    callFacingMode=oldFacing;
    attachCallLocal(localStream);
   }catch(restoreError){console.error('Original camera restore failed',restoreError);toast('تعذر تبديل الكاميرا وتعذر استرجاع الكاميرا السابقة؛ أعد تشغيل الكاميرا')}
  }
  if(error?.name==='NotAllowedError'||error?.name==='SecurityError')toast('المتصفح منع الوصول للكاميرا؛ راجع إذن الكاميرا للموقع');

  else if(['NotReadableError','TrackStartError'].includes(error?.name))toast('الكاميرا مشغولة من تطبيق أو عملية أخرى؛ أغلق تطبيق الكاميرا وحاول مجدداً');
  else toast('تعذر تبديل الكاميرا؛ بقي الاتصال على الكاميرا السابقة');
 }finally{
  callCameraSwitching=false;
  if(button){button.disabled=false;button.textContent=callFacingMode==='environment'?'⇄ الكاميرا الأمامية':'⇄ الكاميرا الخلفية'}
 }
}

async function startCall(camera){if(me.likes<500&&!me.admin)return toast('الاتصال يفتح عند 500 إعجاب');if(!privateTo)return toast('اختر عضوًا للاتصال');try{endCall(false,false);callMode=camera?'camera':'voice';callFacingMode='user';const iceServers=await getPrivateCallIceServers();configureCallPeer(privateTo,iceServers);showCall(camera,true);localStream=await navigator.mediaDevices.getUserMedia(camera?{audio:{echoCancellation:true,noiseSuppression:true},video:{facingMode:{ideal:'user'}}}:{audio:{echoCancellation:true,noiseSuppression:true},video:false});if(camera)attachCallLocal(localStream);addPrivateCallTracks(localStream);const offer=await pc.createOffer();await pc.setLocalDescription(offer);socket.emit('call-offer',{to:privateTo,offer,video:camera});flushOutgoingCallIce()}catch(error){console.error('Private call start failed',error);endCall(false,false);toast(error?.name==='NotAllowedError'?'اسمح للمتصفح باستخدام الكاميرا والمايك':'تعذر بدء الاتصال؛ تحقق من صلاحية الكاميرا والمايك')}}
function showCall(camera,outgoing=false){document.querySelector('.call')?.remove();document.getElementById('layer').insertAdjacentHTML('beforeend',`<div class="call ${camera?'cameraCall':'voiceCall'}">${camera?'<video id="remoteVideo" autoplay muted playsinline webkit-playsinline></video><audio id="remoteAudio" autoplay playsinline></audio><div id="remoteVideoStatus" class="remoteVideoStatus">بانتظار صورة الطرف الآخر…</div><video id="localVideo" class="localCallPreview" autoplay muted playsinline webkit-playsinline></video>':'<audio id="remoteAudio" autoplay playsinline></audio>'}<div class="callBar">${camera?'<button type="button" id="switchCallCameraButton" class="switchCallCamera" title="تبديل الكاميرا" aria-label="تبديل الكاميرا" onclick="switchCallCamera()">⇄ الكاميرا الخلفية</button>':''}<button onclick="endCall()">إنهاء الاتصال</button><button class="ok" onclick="document.querySelector('.call')?.classList.toggle('call-minimized')">${outgoing?'بانتظار الرد':(camera?'📹 اتصال فيديو':'☎ اتصال صوتي')}</button></div></div>`);if(camera&&localStream)attachCallLocal(localStream);if(callRemoteStream)attachCallRemote(callRemoteStream)}
function handleOffer(d){if(!d?.from)return;if(pc||pendingIncomingCall){socket?.emit('call-reject',{to:d.from,reason:'busy'});return}pendingIncomingCall=d;const layerEl=document.getElementById('layer');if(layerEl){document.getElementById('incomingCallCard')?.remove();layerEl.insertAdjacentHTML('beforeend',incomingCallCard(d))}else socket?.emit('call-reject',{to:d.from,reason:'unavailable'})}
async function acceptIncomingCall(){const incoming=pendingIncomingCall;if(!incoming)return;if(micRaised||voiceRequestPending){toast('لا تستطيع الرد على المكالمة لأنك تتحدث باستخدام مايك الغرفة');return;}acceptedIncomingCallForRetry=incoming;pendingIncomingCall=null;document.getElementById('incomingCallCard')?.remove();callMode=incoming.video?'camera':'voice';callFacingMode='user';try{const iceServers=await getPrivateCallIceServers();configureCallPeer(incoming.from,iceServers);showCall(!!incoming.video,false);localStream=await navigator.mediaDevices.getUserMedia(incoming.video?{audio:{echoCancellation:true,noiseSuppression:true},video:{facingMode:{ideal:'user'}}}:{audio:{echoCancellation:true,noiseSuppression:true},video:false});if(incoming.video)attachCallLocal(localStream);await pc.setRemoteDescription(incoming.offer);await flushCallIce();addPrivateCallTracks(localStream);const answer=await pc.createAnswer();await pc.setLocalDescription(answer);socket.emit('call-answer',{to:incoming.from,answer,video:!!incoming.video});flushOutgoingCallIce()}catch(error){console.error('Private call acceptance failed',error);socket?.emit('call-reject',{to:incoming.from,reason:error?.name==='NotAllowedError'?'permission':'failed'});endCall(false,false);toast(error?.name==='NotAllowedError'?'لم تسمح باستخدام المايك أو الكاميرا':'تعذر قبول الاتصال؛ تحقق من صلاحية الجهاز')}}

<script id="rimaz-banner-typewriter-v4678">
(function(){
  const start=()=>{
    const node=document.getElementById('rimazBannerTypedText');
    if(!node||node.dataset.started==='1')return;
    node.dataset.started='1';
    const phrase=Array.from('دردشة ريماز عراقية');
    if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches){node.textContent=phrase.join('');return;}
    let index=0, deleting=false;
    const tick=()=>{
      if(!document.body.contains(node))return;
      if(!deleting){index=Math.min(index+1,phrase.length);node.textContent=phrase.slice(0,index).join('');if(index===phrase.length){deleting=true;window.setTimeout(tick,2100);return;}window.setTimeout(tick,115);}
      else{index=Math.max(0,index-1);node.textContent=phrase.slice(0,index).join('');if(index===0){deleting=false;window.setTimeout(tick,500);return;}window.setTimeout(tick,65);}
    };
    tick();
  };
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start,{once:true});else start();
})();
</script>
