name: Validate Rimaz Project

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - fix/bound-private-media-ticket-cache
  pull_request:
    # Push validation runs on every candidate commit. Only validate PR lifecycle
    # events here; bot archive commits must not trigger approval-gated sync runs.
    types:
      - opened
      - reopened
      - ready_for_review
    branches:
      - safety/validate-and-backup-before-sync
      - main
    paths:
      - 'server.js'
      - 'lib/**'
      - 'verify.js'
      - 'index.html'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'npm-shrinkwrap.json'
      - '*.md'
      - 'docs/**/*.md'
      - 'Dockerfile'
      - '.dockerignore'
      - '.gitignore'
      - '.github/**'
      - '.editorconfig'
      - '.nvmrc'
      - '.gitattributes'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js from .nvmrc
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Install exact locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify installed dependency tree
        run: npm ls --depth=0

      - name: Check JavaScript syntax
        run: |
          node --check server.js
          node --check verify.js

      - name: Run project regression tests
        run: npm test

      - name: Build production container
        run: docker build --pull -t rimaz-chat-iraqi:ci .

      - name: Smoke-test production container HTTP and Socket.IO
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/rimaz-smoke-data
          mkdir -p /tmp/rimaz-smoke-data/uploads
          dd if=/dev/zero of=/tmp/rimaz-smoke-data/uploads/load-test.bin bs=1M count=12 status=none
          rm -f /tmp/rimaz-home.html /tmp/rimaz-socketio.txt
          docker run --detach --name rimaz-smoke --memory=128m --memory-swap=128m --cpus=0.25 --publish 127.0.0.1:3000:3000 --volume /tmp/rimaz-smoke-data:/data/rimaz --env PORT=3000 --env DATA_DIR=/data/rimaz rimaz-chat-iraqi:ci
          cleanup() {
            docker logs rimaz-smoke || true
            docker rm --force rimaz-smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/ -o /tmp/rimaz-home.html; then break; fi
            sleep 1
          done
          test -s /tmp/rimaz-home.html
          grep -qi '<html' /tmp/rimaz-home.html
          curl --fail --silent 'http://127.0.0.1:3000/socket.io/?EIO=4&transport=polling' -o /tmp/rimaz-socketio.txt
          grep -q '^0{' /tmp/rimaz-socketio.txt
          node scripts/chat-integration-smoke.js
          # Exercise concurrent streamed media reads and ordinary HTTP/Socket.IO polling
          # while the container is constrained to the production memory and CPU limits.
          seq 1 8 | xargs -P 4 -I{} curl --fail --silent --show-error http://127.0.0.1:3000/uploads/load-test.bin -o /dev/null
          seq 1 24 | xargs -P 4 -I{} sh -c 'curl --fail --silent --show-error http://127.0.0.1:3000/ -o /dev/null && curl --fail --silent --show-error "http://127.0.0.1:3000/socket.io/?EIO=4&transport=polling" -o /dev/null'
          # Read the container's own cgroup-v2 counters after the concurrent workload.
          # Keep an 8 MiB safety margin below the configured 128 MiB hard limit.
          MEMORY_LIMIT="$(docker exec rimaz-smoke cat /sys/fs/cgroup/memory.max)"
          MEMORY_CURRENT="$(docker exec rimaz-smoke cat /sys/fs/cgroup/memory.current)"
          MEMORY_PEAK="$(docker exec rimaz-smoke cat /sys/fs/cgroup/memory.peak)"
          test "$MEMORY_LIMIT" = "134217728"
          [[ "$MEMORY_CURRENT" =~ ^[0-9]+$ && "$MEMORY_PEAK" =~ ^[0-9]+$ ]]
          test "$MEMORY_CURRENT" -le 125829120
          test "$MEMORY_PEAK" -le 125829120
          echo "Container cgroup-v2 memory after workload: current=$MEMORY_CURRENT bytes peak=$MEMORY_PEAK bytes limit=$MEMORY_LIMIT bytes"
          STATE="$(docker inspect --format '{{.State.OOMKilled}} {{.State.Running}} {{.HostConfig.Memory}} {{.HostConfig.NanoCpus}}' rimaz-smoke)"
          test "$STATE" = "false true 134217728 250000000"

  refresh-release-archive:
    # Archive writes must run only once per branch push. PR validation remains read-only,
    # preventing concurrent push/PR jobs from racing to commit the same ZIP file.
    if: github.event_name == 'push' && github.ref == 'refs/heads/fix/bound-private-media-ticket-cache'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout validated branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/bound-private-media-ticket-cache
          fetch-depth: 0

      - name: Rebuild and verify exact tracked-file archive
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re, stat, subprocess, zipfile
          archive='rimaz-final-deep-audit-46.93.72.zip'
          tracked=subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          paths=sorted(p for p in tracked if p and p != archive and os.path.isfile(p))
          with zipfile.ZipFile(archive,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for path in paths:
                  info=zipfile.ZipInfo(path,date_time=(2024,1,1,0,0,0))
                  info.external_attr=(stat.S_IFREG|stat.S_IMODE(os.stat(path).st_mode))<<16
                  info.compress_type=zipfile.ZIP_DEFLATED
                  with open(path,'rb') as f:z.writestr(info,f.read(),compress_type=zipfile.ZIP_DEFLATED,compresslevel=9)
          with zipfile.ZipFile(archive) as z:
              if z.testzip():raise SystemExit('ZIP CRC failure')
              actual=set()
              total=0
              for item in z.infolist():
                  name=item.filename.replace('\\','/')
                  if name.startswith('/') or re.match(r'^[A-Za-z]:',name) or any(p in ('.','..') for p in name.split('/')):raise SystemExit('Unsafe path: '+name)
                  if ((item.external_attr>>16)&0o170000)==stat.S_IFLNK:raise SystemExit('Symlink: '+name)
                  if not item.is_dir():
                      if name in actual:raise SystemExit('Duplicate path: '+name)
                      actual.add(name)
                  total+=item.file_size
                  if item.compress_size and item.file_size/item.compress_size>250:raise SystemExit('Suspicious compression ratio: '+name)
              if actual!=set(paths):raise SystemExit(f'Parity mismatch missing={sorted(set(paths)-actual)[:10]} extra={sorted(actual-set(paths))[:10]}')
              if total>500*1024*1024:raise SystemExit('Expanded archive too large')
          print(f'Exact archive rebuilt and verified: {len(actual)} files, {os.path.getsize(archive)} bytes')
          PY

      - name: Set up Node.js for extracted archive validation
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Install locked dependencies and test the rebuilt archive
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="$RUNNER_TEMP/rimaz-release-archive"
          mkdir -p "$PROJECT"
          python3 - <<'PY'
          import os, re, stat, zipfile
          archive='rimaz-final-deep-audit-46.93.72.zip'
          target=os.environ['RUNNER_TEMP']+'/rimaz-release-archive'
          with zipfile.ZipFile(archive) as z:
              if z.testzip():raise SystemExit('ZIP CRC failure')
              seen=set()
              total=0
              for item in z.infolist():
                  name=item.filename.replace('\\','/')
                  if name.startswith('/') or re.match(r'^[A-Za-z]:',name) or any(p in ('.','..') for p in name.split('/')):raise SystemExit('Unsafe path: '+name)
                  if ((item.external_attr>>16)&0o170000)==stat.S_IFLNK:raise SystemExit('Symlink: '+name)
                  if not item.is_dir():
                      if name in seen:raise SystemExit('Duplicate path: '+name)
                      seen.add(name)
                  total+=item.file_size
                  if item.compress_size and item.file_size/item.compress_size>250:raise SystemExit('Suspicious compression ratio: '+name)
              if total>500*1024*1024:raise SystemExit('Expanded archive too large')
              z.extractall(target)
          PY
          cd "$PROJECT"
          npm ci --no-audit --no-fund
          npm ls --depth=0
          node --check server.js
          node --check verify.js
          npm test
          cmp -s index.html public/index.html
          docker build --pull -t rimaz-chat-iraqi:release-archive .

      - name: Commit refreshed archive
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add rimaz-final-deep-audit-46.93.72.zip
          if git diff --cached --quiet; then
            echo "Archive already matches the validated source."
            exit 0
          fi
          git commit -m "build: refresh audited archive after validated changes"
          git push origin HEAD:refs/heads/fix/bound-private-media-ticket-cache
