name: Validate Rimaz Project

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - fix/bound-private-media-ticket-cache
  pull_request:
    branches:
      - safety/validate-and-backup-before-sync
      - main
    paths:
      - 'server.js'
      - 'verify.js'
      - 'index.html'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'npm-shrinkwrap.json'
      - '*.md'
      - 'docs/**/*.md'
      - 'Dockerfile'
      - '.dockerignore'
      - '.gitignore'
      - '.github/**'
      - '.editorconfig'
      - '.nvmrc'
      - '.gitattributes'
      - 'rimaz-final-deep-audit-46.93.72.zip'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js from .nvmrc
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            echo "NOTICE: package-lock.json is not present yet; using npm install for this transitional run."
            npm install --no-audit --no-fund
          fi

      - name: Check JavaScript syntax
        run: |
          node --check server.js
          node --check verify.js

      - name: Run project regression tests
        run: npm test

      - name: Build production container
        run: docker build --pull -t rimaz-chat-iraqi:ci .
