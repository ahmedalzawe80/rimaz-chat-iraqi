name: Validate Rimaz Project

on:
  push:
    branches:
      - maintenance/repository-cleanup-2026-11-24
  pull_request:
    branches:
      - safety/validate-and-backup-before-sync
      - main
    paths:
      - 'server.js'
      - 'verify.js'
      - 'index.html'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'npm-shrinkwrap.json'
      - 'README.md'
      - '.gitignore'
      - '.dockerignore'
      - 'Dockerfile'
      - 'CHANGELOG.md'
      - 'DEPLOYMENT-46.93.72.md'
      - '.github/workflows/**'
      - 'rimaz-final-deep-audit-46.93.72.zip'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check JavaScript syntax
        run: |
          node --check server.js
          node --check verify.js

      - name: Run project regression tests
        run: npm test
