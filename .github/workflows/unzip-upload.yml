
name: Clean Replace Project Upload

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replace-project:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract and validate ZIP
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="rimaz-final-deep-audit-46.93.72.zip"
          STAGING="$RUNNER_TEMP/rimaz-upload"

          if [ ! -f "$ARCHIVE" ]; then
            echo "ERROR: $ARCHIVE not found"
            exit 1
          fi

          unzip -tq "$ARCHIVE"

          mkdir -p "$STAGING"
          unzip -q "$ARCHIVE" -d "$STAGING"

          SOURCE=""
          MATCHES=0

          if [ -f "$STAGING/package.json" ] && [ -f "$STAGING/server.js" ]; then
            SOURCE="$STAGING"
            MATCHES=1
          else
            while IFS= read -r file; do
              dir="$(dirname "$file")"

              if [ -f "$dir/server.js" ]; then
                SOURCE="$dir"
                MATCHES=$((MATCHES + 1))
              fi
            done < <(find "$STAGING" -type f -name package.json)
          fi

          if [ "$MATCHES" -ne 1 ]; then
            echo "ERROR: Expected exactly one valid project root"
            exit 1
          fi

          echo "PROJECT_SOURCE=$SOURCE" >> "$GITHUB_ENV"
          echo "Project validated successfully"

      - name: Clean and replace old files
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "$PROJECT_SOURCE/package.json" ] || [ ! -f "$PROJECT_SOURCE/server.js" ]; then
            echo "ERROR: Project validation failed"
            exit 1
          fi

          rsync -a --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='data.json' \
            --exclude='google1a84d9d1dec7b85d.html' \
            --exclude='rimaz-final-deep-audit-46.93.72.zip' \
            "$PROJECT_SOURCE/" ./

          echo "Project files replaced successfully"

      - name: Commit clean project
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "Clean replace project from audited ZIP"
            git push
          else
            echo "No changes to commit"
          fi
