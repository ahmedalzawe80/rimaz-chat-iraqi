
name: Unzip Project Upload

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip uploaded project
        run: |
          if [ ! -f upload-project.zip ]; then
            echo "upload-project.zip not found"
            exit 1
          fi
          unzip -o upload-project.zip -d extracted
          rsync -a extracted/ ./ --exclude=.git --exclude=upload-project.zip
          rm -rf extracted upload-project.zip

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Upload and extract project ZIP"
          git push
