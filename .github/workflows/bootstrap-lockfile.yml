name: Bootstrap reproducible npm install

on:
  push:
    branches:
      - fix/bound-private-media-ticket-cache
    paths:
      - '.github/workflows/bootstrap-lockfile.yml'

permissions:
  contents: write

concurrency:
  group: rimaz-lockfile-bootstrap
  cancel-in-progress: false

jobs:
  create-lockfile:
    if: github.ref == 'refs/heads/fix/bound-private-media-ticket-cache'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/bound-private-media-ticket-cache
          fetch-depth: 0

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Generate and validate a genuine npm lockfile
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          fi
          node <<'NODE'
          const pkg = require('./package.json');
          const lock = require('./package-lock.json');
          if (lock.lockfileVersion !== 3) throw new Error('Expected npm lockfileVersion 3');
          if (!lock.packages || !lock.packages['']) throw new Error('Missing root package metadata');
          const sort = value => JSON.stringify(Object.fromEntries(Object.entries(value || {}).sort(([a],[b]) => a.localeCompare(b))));
          if (sort(lock.packages[''].dependencies) !== sort(pkg.dependencies)) {
            throw new Error('Lockfile root dependencies do not exactly match package.json');
          }
          if (lock.packages[''].name !== pkg.name || lock.packages[''].version !== pkg.version) {
            throw new Error('Lockfile root package identity does not match package.json');
          }
          console.log('Verified npm lockfile v3 and exact root dependency declarations.');
          NODE

      - name: Verify clean deterministic install
        run: npm ci --no-audit --no-fund

      - name: Run regression suite
        run: |
          node --check server.js
          node --check verify.js
          npm test

      - name: Switch production Docker build to npm ci
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('Dockerfile')
          text = path.read_text()
          old = 'RUN npm install --omit=dev'
          new = 'RUN npm ci --omit=dev'
          if text.count(old) == 1:
              path.write_text(text.replace(old, new))
          elif text.count(new) == 1:
              print('Dockerfile already uses npm ci.')
          else:
              raise SystemExit('Expected exactly one production dependency install command in Dockerfile.')
          PY

      - name: Build production image with the lockfile
        run: docker build --pull -t rimaz-chat-iraqi:locked-ci .

      - name: Commit the verified lockfile and Docker install change
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json Dockerfile
          if git diff --cached --quiet; then
            echo "No lockfile or Dockerfile changes to commit."
          else
            git commit -m "build: lock production dependencies with npm ci"
            git push origin HEAD:fix/bound-private-media-ticket-cache
          fi
          FINAL_SHA="$(git rev-parse HEAD)"
          echo "Verified final candidate commit: $FINAL_SHA"
          gh workflow run validate-project.yml --ref fix/bound-private-media-ticket-cache
          echo "Dispatched full validation workflow for the final candidate head."
