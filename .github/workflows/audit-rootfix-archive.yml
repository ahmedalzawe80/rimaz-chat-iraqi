name: Audit Rootfix Archive

on:
  push:
    branches:
      - safety/validate-and-backup-before-sync
    paths:
      - 'rimaz-chat-iraqi-v46.93.73-rootfix.zip'
      - '.github/workflows/audit-rootfix-archive.yml'

permissions:
  contents: read

jobs:
  inspect-archive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate archive layout and extract safely
        id: archive
        shell: bash
        run: |
          python3 - <<'PY'
          import os, zipfile
          archive = 'rimaz-chat-iraqi-v46.93.73-rootfix.zip'
          target = os.path.join(os.environ['RUNNER_TEMP'], 'rimaz-rootfix')
          with zipfile.ZipFile(archive) as z:
              names = z.namelist()
              for name in names:
                  normalized = name.replace('\\\\', '/')
                  if normalized.startswith('/') or any(part == '..' for part in normalized.split('/')):
                      raise SystemExit(f'Unsafe archive path: {name}')
              candidates = []
              for name in names:
                  if name.endswith('/package.json') or name == 'package.json':
                      root = name[:-len('package.json')].rstrip('/')
                      required = [root + '/' + item if root else item for item in ('package.json','server.js','verify.js','index.html','public/index.html')]
                      if all(item in names for item in required):
                          candidates.append(root)
              if len(candidates) != 1:
                  raise SystemExit(f'Expected one complete project root, found: {candidates}')
              root = candidates[0]
              z.extractall(target)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('root=' + root + '\\n')
          print(f'Validated one project root: {root or "."}')
          print(f'Archive entries: {len(names)}')
          PY

      - name: Check extracted JavaScript and synchronized HTML
        shell: bash
        run: |
          PROJECT="$RUNNER_TEMP/rimaz-rootfix/${{ steps.archive.outputs.root }}"
          cd "$PROJECT"
          node --check server.js
          node --check verify.js
          cmp -s index.html public/index.html
          echo "Archive JavaScript syntax and HTML synchronization passed."

      - name: Install dependencies and run archive regression suite
        shell: bash
        run: |
          PROJECT="$RUNNER_TEMP/rimaz-rootfix/${{ steps.archive.outputs.root }}"
          cd "$PROJECT"
          npm install --ignore-scripts --no-audit --no-fund
          npm test
