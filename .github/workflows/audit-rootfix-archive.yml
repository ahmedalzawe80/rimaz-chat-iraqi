name: Audit Rootfix Archive

on:
  push:
    branches:
      - safety/validate-and-backup-before-sync
      - maintenance/repository-cleanup-2026-11-24
      - fix/bound-private-media-ticket-cache
      - fix/persistent-data-symlink-boundary
    paths:
      - 'rimaz-final-deep-audit-46.93.72.zip'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-archive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js from .nvmrc
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Validate archive layout and extract safely
        id: archive
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re, stat, zipfile
          archive = 'rimaz-final-deep-audit-46.93.72.zip'
          target = os.path.join(os.environ['RUNNER_TEMP'], 'rimaz-rootfix')
          seen_files = set()
          with zipfile.ZipFile(archive) as z:
              infos = z.infolist()
              bad_member = z.testzip()
              if bad_member is not None:
                  raise SystemExit(f'Archive CRC/integrity check failed: {bad_member}')
              if len(infos) > 30000:
                  raise SystemExit(f'Too many archive entries: {len(infos)}')
              total_size = 0
              for item in infos:
                  name = item.filename.replace('\\', '/')
                  parts = name.split('/')
                  if name.startswith('/') or re.match(r'^[A-Za-z]:', name) or any(part in ('.', '..') for part in parts):
                      raise SystemExit(f'Unsafe archive path: {item.filename}')
                  normalized = '/'.join(parts)
                  mode = (item.external_attr >> 16) & 0o170000
                  if mode == stat.S_IFLNK:
                      raise SystemExit(f'Archive symlink is not allowed: {item.filename}')
                  if not item.is_dir():
                      if normalized in seen_files:
                          raise SystemExit(f'Duplicate archive file path: {normalized}')
                      seen_files.add(normalized)
                  total_size += item.file_size
                  if item.file_size > 0 and item.compress_size == 0:
                      raise SystemExit(f'Invalid compressed size for: {item.filename}')
                  if item.compress_size > 0 and item.file_size / item.compress_size > 250:
                      raise SystemExit(f'Suspicious compression ratio for: {item.filename}')
              if total_size > 500 * 1024 * 1024:
                  raise SystemExit(f'Archive expands beyond 500 MiB: {total_size}')
              names = [item.filename for item in infos]
              candidates = []
              for name in names:
                  if name.endswith('/package.json') or name == 'package.json':
                      root = name[:-len('package.json')].rstrip('/')
                      required = [root + '/' + item if root else item for item in ('package.json','server.js','verify.js','index.html','public/index.html')]
                      if all(item in names for item in required):
                          candidates.append(root)
              if len(candidates) != 1:
                  raise SystemExit(f'Expected one complete project root, found: {candidates}')
              root = candidates[0]
              z.extractall(target)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('root=' + root + chr(10))
          print(f'Validated one project root: {root or "."}')
          print(f'Archive entries: {len(infos)}; expanded bytes: {total_size}')
          PY

      - name: Require archive to match the candidate application source
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="$RUNNER_TEMP/rimaz-rootfix/${{ steps.archive.outputs.root }}"
          for file in package.json package-lock.json Dockerfile server.js verify.js index.html; do
            if ! cmp -s "$PROJECT/$file" "$file"; then
              echo "ERROR: archived $file differs from the reviewed repository candidate."
              echo "Rebuild the audited ZIP from this exact candidate before it can be used for source synchronization."
              exit 1
            fi
          done
          if ! diff -qr --no-dereference "$PROJECT/public" public; then
            echo "ERROR: archived public assets differ from the reviewed repository candidate."
            exit 1
          fi
          if ! diff -qr --no-dereference "$PROJECT/lib" lib; then
            echo "ERROR: archived server library modules differ from the reviewed repository candidate."
            exit 1
          fi
          cp package-lock.json "$PROJECT/package-lock.json"
          cp Dockerfile "$PROJECT/Dockerfile"
          echo "Archive application source and public assets exactly match the candidate."

      - name: Check extracted JavaScript and synchronized HTML
        shell: bash
        run: |
          PROJECT="$RUNNER_TEMP/rimaz-rootfix/${{ steps.archive.outputs.root }}"
          cd "$PROJECT"
          node --check server.js
          node --check verify.js
          cmp -s index.html public/index.html
          echo "Archive JavaScript syntax and synchronized HTML passed."

      - name: Install locked dependencies and run archive regression suite
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="$RUNNER_TEMP/rimaz-rootfix/${{ steps.archive.outputs.root }}"
          cd "$PROJECT"
          npm ci --no-audit --no-fund
          npm ls --depth=0
          node --check server.js
          node --check verify.js
          npm test
          cmp -s index.html public/index.html
          docker build --pull -t rimaz-chat-iraqi:archive-ci .
