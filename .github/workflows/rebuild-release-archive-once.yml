name: Rebuild release archive once

on:
  push:
    branches:
      - fix/bound-private-media-ticket-cache
    paths:
      - '.github/workflows/rebuild-release-archive-once.yml'
      - 'server.js'
      - 'verify.js'
      - 'index.html'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'Dockerfile'
      - '*.md'
      - 'docs/**/*.md'

permissions:
  contents: write

concurrency:
  group: rimaz-one-time-archive-rebuild
  cancel-in-progress: false

jobs:
  rebuild-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/bound-private-media-ticket-cache
          fetch-depth: 0

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Rebuild deterministic ZIP from tracked candidate files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, stat, subprocess, zipfile
          archive = 'rimaz-final-deep-audit-46.93.72.zip'
          builder = '.github/workflows/rebuild-release-archive-once.yml'
          tracked = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          paths = sorted(p for p in tracked if p and p not in (archive, builder) and os.path.isfile(p))
          if not paths:
              raise SystemExit('No tracked project files found')
          with zipfile.ZipFile(archive, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9, strict_timestamps=True) as z:
              for path in paths:
                  info = zipfile.ZipInfo(path, date_time=(2024, 1, 1, 0, 0, 0))
                  mode = stat.S_IMODE(os.stat(path).st_mode)
                  info.external_attr = (stat.S_IFREG | mode) << 16
                  info.compress_type = zipfile.ZIP_DEFLATED
                  with open(path, 'rb') as source:
                      z.writestr(info, source.read(), compress_type=zipfile.ZIP_DEFLATED, compresslevel=9)
          with zipfile.ZipFile(archive) as z:
              bad = z.testzip()
              if bad:
                  raise SystemExit(f'CRC check failed: {bad}')
              names = z.namelist()
              if len(names) != len(set(names)):
                  raise SystemExit('Duplicate archive paths found')
              if set(names) != set(paths):
                  raise SystemExit('Archive does not exactly match the tracked candidate file list')
          print(f'Rebuilt {archive}: {len(paths)} files, {os.path.getsize(archive)} bytes')
          PY

      - name: Validate archive safety and exact candidate parity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re, stat, subprocess, zipfile
          archive = 'rimaz-final-deep-audit-46.93.72.zip'
          target = os.path.join(os.environ['RUNNER_TEMP'], 'rimaz-archive-check')
          tracked = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          expected = {p for p in tracked if p and p not in (archive, '.github/workflows/rebuild-release-archive-once.yml') and os.path.isfile(p)}
          with zipfile.ZipFile(archive) as z:
              if z.testzip() is not None:
                  raise SystemExit('ZIP CRC validation failed')
              actual = set()
              total = 0
              for item in z.infolist():
                  name = item.filename.replace('\\', '/')
                  parts = name.split('/')
                  if name.startswith('/') or re.match(r'^[A-Za-z]:', name) or any(p in ('.', '..') for p in parts):
                      raise SystemExit(f'Unsafe ZIP path: {name}')
                  mode = (item.external_attr >> 16) & 0o170000
                  if mode == stat.S_IFLNK:
                      raise SystemExit(f'Symlink is not allowed: {name}')
                  if not item.is_dir():
                      if name in actual:
                          raise SystemExit(f'Duplicate path: {name}')
                      actual.add(name)
                  total += item.file_size
                  if item.compress_size and item.file_size / item.compress_size > 250:
                      raise SystemExit(f'Suspicious compression ratio: {name}')
              if total > 500 * 1024 * 1024:
                  raise SystemExit('Archive expands beyond 500 MiB')
              if actual != expected:
                  raise SystemExit(f'Archive parity mismatch: missing={sorted(expected-actual)[:10]}, extra={sorted(actual-expected)[:10]}')
              z.extractall(target)
          print(f'Archive safety and full tracked-file parity passed ({len(actual)} files).')
          PY

      - name: Run locked dependency and regression checks inside extracted archive
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="$RUNNER_TEMP/rimaz-archive-check"
          cd "$PROJECT"
          npm ci --no-audit --no-fund
          npm ls --depth=0
          node --check server.js
          node --check verify.js
          npm test
          cmp -s index.html public/index.html
          docker build --pull -t rimaz-chat-iraqi:rebuilt-archive .

      - name: Commit rebuilt archive to candidate branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rimaz-final-deep-audit-46.93.72.zip
          if git diff --cached --quiet; then
            echo "Archive already matches the candidate; no commit needed."
            exit 0
          fi
          git commit -m "build: regenerate audited release archive from exact candidate"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:fix/bound-private-media-ticket-cache"
